      for(const o of av.filter(o=>P(o.i)))for(const f of o.g.files){const u=fsAbs(f.p);await c.delete(u);fsHave.delete(u)}}
    else{const list=fsMissing(fsMan.core).concat(...av.filter(o=>kind==='all'||!P(o.i)).map(o=>fsMissing(o.g)));
      box.innerHTML=fsHTML('Скачиваем… 0 из '+fsMB(fsBytes(list)),cls);const bar=box.querySelector('#fsBar'),st=box.querySelector('#fsSt');
      fail=await fsDownload(list,(d,t)=>{if(bar)bar.style.width=(d/t*100)+'%';if(st)st.textContent='Скачиваем… '+fsMB(d)+' из '+fsMB(t)})}
  }catch(e){fail=1}
  fsBusy=false;box.innerHTML=fsHTML(null,cls)+(fail?'<p class="fs-note">Часть файлов не скачалась. Проверьте интернет и нажмите ещё раз.</p>':'')}

/* ---------- settings (shared with the main menu through localStorage) ---------- */
const SDEF={q:'auto',d:'normal',imm:false,fn:true,soft:false,text:3,mus:70,sfx:80,vib:true};
function getS(){const s=Object.assign({},SDEF);try{Object.assign(s,JSON.parse(localStorage.getItem('sboi_settings')||'{}'))}catch(e){}return s}
function putS(s){try{localStorage.setItem('sboi_settings',JSON.stringify(s))}catch(e){}try{parent.postMessage('sboi:settings','*')}catch(e){}}
let conf=null,saveOpen=false,saveMsg='';
const DHT={easy:'Широкое окно реакции. Провал QTE не наказывает, а только меняет ветку.',normal:'Обычное окно реакции, ошибки влияют на исход сцены.',hard:'Узкое окно реакции, ошибки стоят дорого.'};
function setBody(){const S=getS();const sw=(k,b,i)=>`<div class="str"><span class="tx"><b>${b}</b><i>${i}</i></span><button class="ssw" role="switch" data-sw="${k}" aria-checked="${!!S[k]}" aria-label="${b}"></button></div>`;
  const seg=(k,opts)=>`<div class="sseg" role="group">${opts.map(([v,l])=>`<button data-seg="${k}" data-v="${v}" aria-pressed="${S[k]===v}">${l}</button>`).join('')}</div>`;
  const rg=(k,l,min,max,st,suf)=>`<div class="srg"><label for="s_${k}">${l}</label><input type="range" id="s_${k}" data-rg="${k}" min="${min}" max="${max}" step="${st}" value="${S[k]}"><span>${S[k]}${suf}</span></div>`;
  return `<div class="sgrp"><div class="sgl">Качество графики</div>${seg('q',[['auto','Авто'],['высокое','Высокое'],['стандартное','Стандарт'],['экономное','Эконом']])}</div>
  <div class="sgrp"><div class="sgl">Сложность QTE</div>${seg('d',[['easy','Лёгкая'],['normal','Обычная'],['hard','Сложная']])}<p class="sgh">${DHT[S.d]}</p></div>
  <div class="sgrp"><div class="sgl">Сюжет</div>${sw('imm','Иммерсивный режим','Таймер на историю, QTE ускоряются. Можно выключить в любой момент.')}${sw('fn','Сноски выборов','«Артур это запомнит», «Это отразится на финале».')}${sw('soft','Смягчённый режим','Убирает жёсткие сцены и пикантные намёки.')}</div>
  <div class="sgrp"><div class="sgl">Текст и звук</div>${rg('text','Скорость текста',1,5,1,'')}${rg('mus','Музыка',0,100,5,'%')}${rg('sfx','Звуки',0,100,5,'%')}${sw('vib','Вибрация в QTE','Если телефон поддерживает.')}</div>
  <div class="sgrp"><div class="sgl">Файлы игры</div><div class="fsbox" id="fsBox">${fsHTML(null,'sbtn')}</div></div>
  <div class="sgrp" style="border:0"><div class="sgl">Сохранение</div>
    <button class="sbtn" data-act="copy"><span>Скопировать сохранение</span><small>код в буфер</small></button>
    ${saveMsg?`<p class="sgh">${saveMsg}</p>`:''}
    <button class="sbtn" data-act="load"><span>Загрузить сохранение</span><small>вставить код</small></button>
    ${saveOpen?`<textarea class="scode" id="scode" aria-label="Код сохранения" placeholder="Вставьте код сохранения"></textarea><button class="sbtn" data-act="apply"><span>Применить код</span><small>заменит текущий прогресс</small></button>`:''}
    ${conf?`<div class="sconf"><p>Начать сюжет заново? Прогресс всех историй, отношения и улики сотрутся. Настройки и алмазы останутся.</p><div class="row"><button class="sbtn danger" data-act="reset-yes">Да, заново</button><button class="sbtn" data-act="reset-no">Отмена</button></div></div>`:`<button class="sbtn danger" data-act="reset"><span>Начать сюжет заново</span><small>с пролога</small></button>`}
  </div>`}
function reSet(){const sc=$('shB').scrollTop;$('shB').innerHTML=setBody();$('shB').scrollTop=sc}
function saveCode(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sboi_'))o[k]=localStorage.getItem(k)}}catch(e){}return 'SBOI1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
$('shB').addEventListener('click',e=>{if(openId!=='settings')return;const S=getS();
  const sg=e.target.closest('[data-seg]');if(sg){S[sg.dataset.seg]=sg.dataset.v;putS(S);reSet();return}
  const w=e.target.closest('[data-sw]');if(w){S[w.dataset.sw]=!S[w.dataset.sw];putS(S);reSet();return}
  const fb=e.target.closest('[data-fs]');if(fb){fsRun(fb.dataset.fs,$('fsBox'),'sbtn');return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='copy'){const code=saveCode();const done=()=>{saveMsg='Код скопирован. Сохраните его в заметках.';reSet()};
    try{navigator.clipboard.writeText(code).then(done,()=>{saveMsg='Не удалось скопировать автоматически. Код: '+code;reSet()})}catch(err){saveMsg='Код: '+code;reSet()}}
  if(act==='load'){saveOpen=!saveOpen;reSet()}
  if(act==='apply'){const v=($('scode')||{}).value||'';try{const o=JSON.parse(decodeURIComponent(escape(atob(v.trim().replace(/^SBOI1-/,'')))));Object.keys(o).forEach(k=>{if(k.startsWith('sboi_'))localStorage.setItem(k,o[k])});saveOpen=false;saveMsg='Сохранение загружено.';putS(getS())}catch(err){saveMsg='Код не подошёл. Проверьте, что он скопирован целиком, начиная с SBOI1-.'}reSet()}
  if(act==='reset'){conf=true;reSet()}
  if(act==='reset-no'){conf=null;reSet()}
  if(act==='reset-yes'){conf=null;try{const ks=['sboi_prologue','sboi_progress'];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/^sboi_(morok|whitechapel|obet|patient|zvezda|podval|gavan|hozyain|zoloto)/.test(k))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(err){}close();try{parent.postMessage('sboi:restart','*')}catch(err){}}
});
$('shB').addEventListener('input',e=>{const r=e.target.closest('[data-rg]');if(!r||openId!=='settings')return;const S=getS();S[r.dataset.rg]=+r.value;putS(S);r.nextElementSibling.textContent=r.value+(r.dataset.rg==='text'?'':'%')});
$('gear').onclick=()=>{conf=null;saveOpen=false;saveMsg='';open('settings')};
/* ---------- full-screen viewers: Изнанка map and branch chart ---------- */
const ARC=[['rima','Римма: Последний коридор','Нулевой пациент · тир'],['natasha','Чёрные воды','Тихая гавань · путь к Острову Черепа'],['neon','Neon Run: Drift','Подвал · Катя Белокрылина']];
function openArc(k){const a=ARC.find(q=>q[0]===k);$('vT').textContent=a[1];$('vS').textContent=a[2];$('vBody').innerHTML='';const f=document.createElement('iframe');f.title=a[1];f.allow='autoplay; fullscreen';f.src='arcade-'+k+'.html';$('vBody').appendChild(f);close();$('viewer').classList.add('on')}
const VIEWS={map:['Карта Изнанки','девять ключей к сердцу','map.html'],flow:['Схема развилок','Морок · Катя Близнюк','flow-morok.html']};
function openView(k,tab){const v=VIEWS[k];$('vT').textContent=v[0];$('vS').textContent=v[1];$('vBody').innerHTML='';const f=document.createElement('iframe');f.title=v[0];
  f.src=v[2]+(tab?'#'+tab:'');$('vBody').appendChild(f);close();$('viewer').classList.add('on')}
$('shB').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&!b.disabled)openView(b.dataset.view,b.dataset.tab)});
$('vBack').onclick=()=>{$('viewer').classList.remove('on');setTimeout(()=>{$('vBody').innerHTML=''},300)};
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!e.target.closest('input,textarea'))e.preventDefault();lastTouch=n},{passive:false});
let centered=false;function layout(){drawPortal();if(pano.clientWidth&&room.clientWidth){centerOn(760);centered=true}edges()}
Promise.all([imB.decode(),imC.decode(),(room.querySelector('img')||{decode:()=>Promise.resolve()}).decode().catch(()=>{})]).then(()=>{layout();requestAnimationFrame(frame)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{centered?(drawPortal(),edges()):layout()},150)});
})();
</script>
<script>document.querySelector(".top .ib").addEventListener("click",()=>parent.postMessage("sboi:menu","*"));</script></body></html>
