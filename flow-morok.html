const COLS=[[330,'Глава 1'],[560,'Глава 2'],[790,'Глава 3'],[1020,'Глава 4 · ночь'],[1250,'Глава 4 · суд'],[1500,'Концовка']];
const PATH=['S'];for(const k in N){const n=N[k];if(n.c&&FL(n.c)&&n.w(FL(n.c)))PATH.push(k)}
let sel='S';
const svg=document.getElementById('svg'),sheet=document.getElementById('sheet');
const st=k=>PATH.includes(k)?'path':(!N[k].c||OPEN(N[k].c))?'seen':'lock';
function wrap(t,max){const w=t.split(' ');const out=[];let l='';for(const x of w){if((l+' '+x).trim().length>max&&l){out.push(l);l=x}else l=(l+' '+x).trim()}out.push(l);return out}
const lockI=(x,y)=>`<g fill="none" stroke="#6f6696" stroke-width="2.4"><path d="M${x-6} ${y-2}v-6a6 6 0 0 1 12 0v6"/><rect x="${x-10}" y="${y-2}" width="20" height="15" rx="3" fill="#6f6696" fill-opacity=".35"/></g>`;
const ORD=['S','1','2','3','N','T','E'];const col=k=>k==='S'?0:k[0]==='N'?4:k[0]==='T'?5:k[0]==='E'?6:+k[1];
const LATE=[['NA','T1'],['NA','T2'],['NG','T1'],['NG','T2'],['NV','E1'],['NV','E2'],['NV','E3'],['NX','E5'],['T1','E1'],['T1','E2'],['T1','E3'],['T1','E4'],['T2','E2'],['T2','E3'],['T2','E4']];
function edges(){const L=[];const keys=Object.keys(N).filter(k=>col(k)<=4);
  keys.forEach(a=>keys.forEach(b=>{const ca=col(a),cb=col(b);if(cb!==ca+1)return;
    if(ca===0||N[a].y===N[b].y||PATH.includes(a)&&PATH.includes(b)||(ca===3&&cb===4))L.push([a,b])}));return L.concat(LATE)}
function draw(){
  let s='<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1672" height="940"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  COLS.forEach(([x,t])=>s+=`<text x="${x}" y="92" text-anchor="middle" font-size="15" letter-spacing="2" fill="#a99fcc">${esc(t.toUpperCase())}</text>`);
  edges().forEach(([a,b])=>{const A=N[a],B=N[b];const ax=A.x+(A.kind==='start'?38:95),bx=B.x-(B.kind==='end'?62:95);const m=(ax+bx)/2;
    const both=PATH.includes(a)&&PATH.includes(b);const sa=st(a),sb=st(b);
    const c=both?'#e8b85a':(sa!=='lock'&&sb!=='lock')?'rgba(157,123,255,.55)':'#3a3358';
    s+=`<path d="M${ax} ${A.y} C${m} ${A.y} ${m} ${B.y} ${bx} ${B.y}" fill="none" stroke="${c}" stroke-width="${both?3.5:1.6}" ${c==='#3a3358'?'stroke-dasharray="4 6"':''} ${both?'filter="url(#glow)"':''}/>`});
  for(const k in N){const n=N[k],S=st(k),lock=S==='lock';
    const stroke=S==='path'?'#e8b85a':lock?'#3a3358':n.tone==='bad'?'#e0484f':'#9d7bff';
    const fill=S==='path'?'rgba(232,184,90,.16)':lock?'rgba(30,25,52,.75)':'rgba(80,55,170,.28)';
    let g=`<g class="node${sel===k?' sel':''}" data-k="${k}" tabindex="0" role="button">`;
    if(n.kind==='start'){g+=`<circle class="box" cx="${n.x}" cy="${n.y}" r="38" fill="rgba(232,184,90,.25)" stroke="#e8b85a" stroke-width="2.5" filter="url(#glow)"/><text x="${n.x}" y="${n.y+7}" text-anchor="middle" font-size="22" fill="#f6dda0">✦</text><text x="${n.x}" y="${n.y+70}" text-anchor="middle" font-size="15" fill="#f2ecff">${esc(n.t)}</text>`}
    else if(n.kind==='end'){const r=62,p=[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i-Math.PI/2;return(n.x+r*Math.cos(a)).toFixed(1)+','+(n.y+r*Math.sin(a)).toFixed(1)}).join(' ');
      g+=`<polygon class="box" points="${p}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" ${S==='path'?'filter="url(#glow)"':''}/>`;
      if(lock)g+=lockI(n.x,n.y);else wrap(n.t,10).forEach((l,i,a)=>g+=`<text x="${n.x}" y="${n.y+6+(i-(a.length-1)/2)*20}" text-anchor="middle" font-size="16" font-weight="700" fill="#f2ecff">${esc(l)}</text>`)}
    else{g+=`<rect class="box" x="${n.x-95}" y="${n.y-30}" width="190" height="60" rx="30" fill="${fill}" stroke="${stroke}" stroke-width="2.2" ${S==='path'?'filter="url(#glow)"':''}/>`;
      if(lock)g+=lockI(n.x,n.y);else wrap(n.t,19).forEach((l,i,a)=>g+=`<text x="${n.x}" y="${n.y+6+(i-(a.length-1)/2)*19}" text-anchor="middle" font-size="15" fill="#f2ecff">${esc(l)}</text>`)}
    s+=g+'</g>'}
  svg.innerHTML=s}
function show(k){sel=k;const n=N[k],S=st(k);draw();
  if(S==='lock'){sheet.innerHTML=`<div class="tag">Ещё впереди</div><h2>Эта развилка в следующих главах</h2><p>Дойдите до главы ${n.c}, чтобы открыть её.</p>`;return}
  sheet.innerHTML=`<div class="tag">${n.c?'Глава '+n.c:'Начало'}</div><h2>${esc(n.t)}</h2><p>${esc(n.d)}</p><div class="st">${S==='path'?'Ваш путь':'Открыто, но вы выбрали иначе или ещё не прошли'}</div>`}
svg.addEventListener('click',e=>{const g=e.target.closest('.node');if(g)show(g.dataset.k)});

/* ---------- tabs ---------- */
const tabs=document.getElementById('tabs'),vAll=document.getElementById('vAll'),vCh=document.getElementById('vCh');
const T=[['all','Вся история']].concat(CH.map(c=>['c'+c.n,'Глава '+c.n]));
function tab(id){[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(id==='all'){vAll.hidden=false;vCh.hidden=true;show(sel)}else{vAll.hidden=true;vCh.hidden=false;vCh.innerHTML=chView(CH[+id.slice(1)-1])}}
T.forEach(([id,t])=>{const b=document.createElement('button');b.dataset.id=id;b.textContent=t;if(id!=='all'&&!OPEN(+id.slice(1)))b.classList.add('lk');b.onclick=()=>tab(id);tabs.appendChild(b)});
{const want=(window.__TAB||location.hash.slice(1)||'all');tab(T.some(t=>t[0]===want)?want:'all')}
{const e=PATH.find(k=>N[k].kind==='end');if(e&&!window.__TAB){show(e);const sc=document.querySelector('.scroller');if(sc)setTimeout(()=>{sc.scrollLeft=sc.scrollWidth},50)}}
</script>
