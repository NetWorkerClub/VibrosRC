<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Выброс — серверная</title>
<style>
:root{--night:#07050f;--panel:rgba(14,10,30,.95);--line:#3b3166;--ink:#f3eeff;--muted:#b3a8d6;--dim:#7f75a6;--gold:#e8b85a;--term:#96f0b4;--display:"Philosopher",Georgia,serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--body)}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#000}
.pano{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pano::-webkit-scrollbar{display:none}
.room{position:relative;height:100%;aspect-ratio:16/9}
.room>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:14px;-webkit-tap-highlight-color:transparent;outline:none}
.spot.below .tagl{top:auto;bottom:-24px}
.tagl{position:absolute;left:50%;transform:translateX(-50%);top:-26px;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink);background:rgba(7,5,15,.72);border:1px solid rgba(232,184,90,.45);border-radius:99px;padding:2px 9px 2px 20px;pointer-events:none}
.tagl::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--gold);animation:ping 2.2s infinite}
.tagl.off::before{background:var(--dim);animation:none}
.new{display:inline-block;margin-left:5px;font-family:var(--body);font-size:9px;font-weight:700;color:#1a1208;background:var(--gold);border-radius:99px;padding:1px 6px;vertical-align:2px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,184,90,.7)}70%{box-shadow:0 0 0 10px rgba(232,184,90,0)}100%{box-shadow:0 0 0 0 rgba(232,184,90,0)}}
.topscrim{position:absolute;left:0;right:0;top:0;height:calc(96px + env(safe-area-inset-top,0px));background:linear-gradient(to bottom,rgba(7,5,15,.88),rgba(7,5,15,.5) 55%,rgba(7,5,15,0));pointer-events:none}
.top{position:absolute;top:calc(4px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid rgba(243,238,255,.18);background:rgba(7,5,15,.7);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:focus-visible,.sbtn:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.title{display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 8px #000}
.title b{font-family:var(--display);font-size:20px}.title span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1}.sh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sbody{overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.txt{font-size:14px;line-height:1.5;margin:0;color:var(--ink)}
.meter{font-family:ui-monospace,Menlo,monospace;color:var(--term);font-size:13px;letter-spacing:.06em;border:1px solid rgba(150,240,180,.3);background:rgba(10,30,18,.5);border-radius:10px;padding:10px 12px}
.meter i{display:block;height:6px;border-radius:3px;background:rgba(150,240,180,.15);margin-top:8px;overflow:hidden}.meter i b{display:block;height:100%;background:var(--term)}
.sbtn{font:inherit;font-size:14px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(7,5,15,.6);color:var(--ink);cursor:pointer;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.sbtn small{color:var(--dim);font-size:12px}
.note{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{font:inherit;position:relative;padding:0;border:1px solid rgba(150,240,180,.28);border-radius:10px;background:#050b07;color:var(--ink);cursor:pointer;overflow:hidden;text-align:left}
.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.tile span{display:block;padding:6px 8px;font-size:12px;line-height:1.25;color:var(--term);font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tile.lock{cursor:default;border-color:rgba(127,117,166,.3)}
.tile.lock .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#0a0c0b 0 8px,#0d110f 8px 16px);color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em}
.tile.lock span{color:var(--dim)}
.tile .new{position:absolute;right:6px;top:6px;margin:0}
.viewer{position:absolute;inset:0;background:#030604;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.viewer.on{opacity:1;pointer-events:auto}
.vtop{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.vtop b{font-family:var(--display);font-size:18px;display:block}.vtop small{color:var(--term);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#030604}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.vinfo{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid rgba(150,240,180,.2);font-size:13.5px;line-height:1.5}
.vinfo p{margin:0}.vinfo .odd{margin-top:6px;color:var(--term);font-family:ui-monospace,Menlo,monospace;font-size:12px}
#finFr{position:absolute;inset:0;z-index:40;background:#05020a}#finFr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#finX{position:absolute;left:50%;transform:translateX(-50%);top:calc(50px + env(safe-area-inset-top,0px));z-index:2;font:inherit;font-size:11px;letter-spacing:.06em;padding:5px 12px;border-radius:99px;border:1px solid rgba(243,238,255,.25);background:rgba(7,5,15,.7);color:#d9cff5;cursor:pointer}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;color:var(--dim);background:rgba(3,6,4,.8);padding:3px 10px;border-radius:99px;pointer-events:none;transition:opacity .4s}
</style></head><body>
<div class="app">
 <div class="pano" id="pano"><div class="room" id="room"><img id="bg" alt="Серверная"><div id="spots"></div></div></div>
 <div class="topscrim"></div>
 <div class="top"><button class="ib" id="back" aria-label="Назад в лабораторию"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="title"><b>Серверная</b><span>за лабораторией</span></div><div style="width:44px"></div></div>
 <div class="scrim" id="scrim"></div>
 <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><div class="sh"><div><h2 id="shT"></h2><p id="shS"></p></div><button class="ib" id="close" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sbody" id="shB"></div></section>
 <section class="viewer" id="viewer" aria-label="Схема"><div class="vtop"><button class="ib" id="vBack" aria-label="К архиву"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div><b id="vT"></b><small id="vS"></small></div></div><div class="stage" id="stage"><img id="vImg" alt=""><div class="hint" id="hint">Сведите или разведите пальцы, чтобы приблизить</div></div><div class="vinfo"><p id="vD"></p><p class="odd" id="vO"></p></div></section>
</div>
<script>
const $=id=>document.getElementById(id);
const BG={"off": "room2-off.3d22b82b.webp", "vdr": "room2-vdr.b2c8ab13.webp", "cam": "room2-cam.280f6bb4.webp", "stab": "room2-stab.21f0ee3b.webp"};
const SCH={"portal": "sch-portal.c4df9638.webp", "portalt": "sch-portalt.52198438.webp", "stab": "sch-stab.ce751e25.webp", "stabt": "sch-stabt.9b5fb255.webp", "vdr": "sch-vdr.f46288ac.webp", "vdrt": "sch-vdrt.503a3e89.webp", "cam": "sch-cam.9886250d.webp", "camt": "sch-camt.11d0f778.webp", "whitechapel": "sch-whitechapel.3171eda5.webp", "whitechapelt": "sch-whitechapelt.72e8079f.webp", "morok": "sch-morok.4ca94364.webp", "morokt": "sch-morokt.4193ecfa.webp", "hozyain": "sch-hozyain.61cbfd5b.webp", "hozyaint": "sch-hozyaint.a5c33cae.webp", "obet": "sch-obet.0f9b8bff.webp", "obett": "sch-obett.22ee3adf.webp", "zp1": "sch-zp1.888f0cbb.webp", "zp1t": "sch-zp1t.3862c91b.webp", "r7": "sch-r7.157119a4.webp", "r7t": "sch-r7t.39735481.webp", "podval": "sch-podval.b6f82517.webp", "podvalt": "sch-podvalt.94afe44f.webp", "gavan": "sch-gavan.eca413a4.webp", "gavant": "sch-gavant.0eb26037.webp", "aerocar": "sch-aerocar.f99f87a0.webp", "aerocart": "sch-aerocart.04b36848.webp"};
const SN=['Уайтчепел','Морок','Обет','Нулевой пациент','Звезда','Подвал','Тихая гавань','Хозяин','Золотое сердце'];
/* архив: k — схема, s — история (индекс) или условие */
const ARC=[
 {k:'portal',t:'Портал П-0',c:'ОБР. П-0 · ОСНОВНОЙ КОНТУР',d:'Опытный образец. Через него лаборатория открывала миры. Эксплуатация после 08.03 запрещена.',o:'Выходов на схеме три. В журнале подключений — четыре.'},
 {k:'stab',t:'Стабилизатор измерений',c:'СИ-1 · КОНТУР УДЕРЖАНИЯ',d:'Держит контур портала, чтобы миры не расходились. Запускать без полного набора якорей не рекомендуется.'},
 {k:'vdr',t:'Регистратор данных',c:'РД-8 · КАТУШЕЧНЫЙ',d:'Пишет всё, что проходит через контур. Плёнку не перематывали ни разу.'},
 {k:'cam',t:'Система наблюдения',c:'4 КАМЕРЫ · 1 КОММУТАТОР',d:'Камеры в коридорах и у портала. Записи сохраняются на ту же стойку.',need:'n1'},
 {k:'whitechapel',t:'Хронокотёл',c:'ЛОНДОН · 1888',d:'Паровой механизм из бумаг экспедиции. Назначение в документах не указано.',s:0},
 {k:'morok',t:'Фонарь-оберег',c:'ОБРАЗЕЦ ИЗ ЧАСОВНИ',d:'Линза собирает свет, колокольца предупреждают. Руны выбиты вручную.',o:'Одна из рун в реестре не значится.',s:1},
 {k:'obet',t:'Сундук с замками',c:'ХРАНИЛИЩЕ · ЗАПОРНЫЙ МЕХАНИЗМ',d:'Механизм открывается только по порядку. Ошибка запирает все замки заново.',s:2},
 {k:'zp1',t:'Биореактор «Нуль»',c:'КУЛЬТИВАЦИЯ · ЗАКРЫТЫЙ ЦИКЛ',d:'Три ступени фильтрации, отбор проб без вскрытия колбы.',s:3},
 {k:'r7',t:'Скафандр R-7',c:'ЗАЩИТНЫЙ КОСТЮМ · АНОМАЛЬНЫЕ СРЕДЫ',d:'Экспериментальный костюм для работы там, где воздух ведёт себя иначе.',s:4},
 {k:'podval',t:'Нейрогарнитура',c:'ЗАПИСЬ И ДЕКОДИРОВАНИЕ',d:'Снимает сигнал с висков и раскладывает его на образы.',s:5},
 {k:'gavan',t:'Навигационный секстант',c:'МОРСКОЙ · ПЕРЕДЕЛАННЫЙ',d:'Старый секстант с новым приводом и визиром.',s:6},
 {k:'hozyain',t:'Дирижабль и причальная мачта',c:'ВОЗДУШНОЕ СУДНО · ШВАРТОВКА',d:'Жёсткий корпус, газовые отсеки, мачта с поворотным узлом.',o:'Мачта рассчитана на два судна. Второе в реестре не числится.',s:7},
 {k:'aerocar',t:'Аэромобиль',c:'ЧЕТЫРЕ ИМПЕЛЛЕРА',d:'Двухместная машина на кольцевых импеллерах. Прототип или серийный — неясно.',s:8}
];
function LS(k){try{return localStorage.getItem(k)}catch(e){return null}}
function PR(){try{return JSON.parse(LS('sboi_progress')||'{}')}catch(e){return{}}}
function st(){const p=PR(),s=p.stories||{};const done=[0,1,2,3,4,5,6,7,8].filter(i=>(s[i]||{}).state==='done');return{done,n:done.length,n1:!!LS('sboi_node1'),n2:!!LS('sboi_node2')}}
function seenA(){try{return JSON.parse(LS('sboi_arch_seen')||'[]')}catch(e){return[]}}
function open_(a,S){return a.s!=null?S.done.includes(a.s):a.need==='n1'?S.n1:true}
const Z=[
 {id:'servers',name:'Архив схем',x:[20,90,275,720]},
 {id:'door',name:'В лабораторию',x:[295,205,470,600]},
 {id:'stab',name:'Стабилизатор',x:[505,215,1045,690],below:true},
 {id:'cams',name:'Мониторы',x:[1125,210,1345,490]},
 {id:'vdr',name:'Регистратор',x:[1365,295,1525,490],below:true}
];
let S=st();
function render(){S=st();const b=S.n>=9&&S.n2?'stab':S.n2?'cam':S.n1?'vdr':'off';const im=$('bg');if(im.dataset.k!==b){im.src=BG[b];im.dataset.k=b}
 const sn=seenA(),newArc=ARC.some(a=>open_(a,S)&&!sn.includes(a.k));
 const nw={servers:newArc,vdr:S.n>=3&&!S.n1,cams:S.n1&&!S.n2};
 const off={cams:!S.n1};
 $('spots').innerHTML=Z.map(z=>{const[x0,y0,x1,y1]=z.x;return`<button class="spot${z.below?' below':''}" data-z="${z.id}" style="left:${x0/16}%;top:${y0/9}%;width:${(x1-x0)/16}%;height:${(y1-y0)/9}%" aria-label="${z.name}"><span class="tagl${off[z.id]?' off':''}">${z.name}${nw[z.id]?'<span class="new">новое</span>':''}</span></button>`}).join('')}
const FIN=[['Поиск изнанки','5 мини-игр','fin0.html'],['Фаза 1','разговор с Изнанкой','fin1.html'],['Фаза 2','прятки от Изнанки','fin2.html'],['Фаза 3','стражи','fin3.html']];
function openFin(i){close();let f=$('finFr');if(f)f.remove();const w=document.createElement('div');w.id='finFr';w.innerHTML='<iframe allow="autoplay; fullscreen" title="Финал"></iframe><button id="finX" aria-label="Выйти в серверную">✕ выйти</button>';w.querySelector('iframe').src=FIN[i][2];document.querySelector('.app').appendChild(w);$('finX').onclick=closeFin;try{parent.postMessage('sboi:node-open','*')}catch(e){}}
function closeFin(){const f=$('finFr');if(f)f.remove();try{parent.postMessage('sboi:node-close','*')}catch(e){}}
function sheet(t,sub,body){$('shT').textContent=t;$('shS').textContent=sub;$('shB').innerHTML=body;$('sheet').classList.add('on');$('scrim').classList.add('on')}
function close(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
const nodeBtn=(k,t,sub,nw)=>`<button class="sbtn" data-node="${k}"><span>${t}${nw?' <span class="new">новое</span>':''}</span><small>${sub}</small></button>`;
function openZ(id){S=st();
 if(id==='door'){back();return}
 if(id==='vdr'){sheet('Регистратор данных','Катушечный, на столе справа',S.n>=3?`<p class="txt">${S.n1?'Плёнка снова на начале. Журнал той ночи можно прослушать ещё раз.':'Катушки дрогнули и пошли. Регистратор восстановил журнал записей той ночи.'}</p>`+nodeBtn(1,'Узел 1 · Вспышка','журнал записей 08.03',!S.n1):`<p class="txt">Регистратор молчит. Ему не хватает данных.</p><p class="note">Оживёт после трёх пройденных историй (сейчас: ${S.n}).</p>`);return}
 if(id==='cams'){sheet('Мониторы','Четыре камеры наблюдения',S.n1?`<p class="txt">${S.n2?'Записи камер за 23:40 сохранены.':'Экраны мигнули. Камеры наблюдения восстановили записи за 23:40.'}</p>`+nodeBtn(2,'Узел 2 · За минуту до','камеры наблюдения',!S.n2):`<p class="txt">Экраны тёмные. Мониторы питаются от того же контура, что и регистратор.</p><p class="note">Сначала запустите регистратор.</p>`);return}
 if(id==='stab'){const n=S.n,full=n>=9;sheet('Стабилизатор измерений','СИ-1 · контур удержания',`<div class="meter">ЯКОРЕЙ ПОДКЛЮЧЕНО: ${n} / 9<i><b style="width:${n/9*100}%"></b></i></div><p class="txt">${full?(S.n2?'Контур замкнут. Стабилизатор гудит ровно и ждёт оператора.':'Контур замкнут, но мониторы ещё не показали всё, что видели.'):'Стабилизатор холоден. Каждый пройденный мир даёт ему ещё одну точку опоры.'}</p>${full&&S.n2?'<p class="note">Переход откроется в одном из следующих обновлений.</p>':''}<p class="note" style="margin-top:6px">Испытательные прогоны финала:</p>${FIN.map((f,i)=>`<button class="sbtn" data-fin="${i}"><span>${f[0]}</span><small>${f[1]}</small></button>`).join('')}`);return}
 if(id==='servers'){arch();return}}
function arch(){S=st();const sn=seenA();const n=ARC.filter(a=>open_(a,S)).length;
 sheet('Архив схем',`Восстановлено ${n} из ${ARC.length}`,'<div class="grid">'+ARC.map((a,i)=>open_(a,S)?`<button class="tile" data-a="${i}"><img src="${SCH[a.k+'t']}" alt="" loading="lazy">${sn.includes(a.k)?'':'<span class="new">новое</span>'}<span>${a.t}</span></button>`:`<div class="tile lock"><div class="ph">СЕКТОР ПОВРЕЖДЁН</div><span>${a.s!=null?'После истории «'+SN[a.s]+'»':'После узла 1'}</span></div>`).join('')+'</div>')}
/* просмотр схемы: щипок, перетаскивание, двойной тап */
const V={s:1,x:0,y:0,min:1,w:0,h:0};
function fit(){const r=$('stage').getBoundingClientRect(),im=$('vImg');V.w=im.naturalWidth;V.h=im.naturalHeight;if(!V.w)return;V.min=Math.min(r.width/V.w,r.height/V.h);V.s=V.min;V.x=(r.width-V.w*V.s)/2;V.y=(r.height-V.h*V.s)/2;ap()}
function clamp(){const r=$('stage').getBoundingClientRect();V.s=Math.max(V.min,Math.min(V.s,V.min*6));const w=V.w*V.s,h=V.h*V.s;V.x=w<=r.width?(r.width-w)/2:Math.min(0,Math.max(r.width-w,V.x));V.y=h<=r.height?(r.height-h)/2:Math.min(0,Math.max(r.height-h,V.y))}
function ap(){clamp();$('vImg').style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`}
function zoomAt(px,py,ns){const k=ns/V.s;V.x=px-(px-V.x)*k;V.y=py-(py-V.y)*k;V.s=ns;ap()}
(function(){const st=$('stage'),P=new Map();let pd=0,lt=0;
 const loc=e=>{const r=st.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);P.set(e.pointerId,loc(e));$('hint').style.opacity=0;if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}
  if(P.size===1){const t=performance.now();if(t-lt<300){const[x,y]=loc(e);zoomAt(x,y,V.s>V.min*1.3?V.min:V.min*2.6)}lt=t}});
 st.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=loc(e);if(P.size===1){V.x+=n[0]-o[0];V.y+=n[1]-o[1];P.set(e.pointerId,n);ap()}else{P.set(e.pointerId,n);const[a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,V.s*d/pd)}pd=d}});
 const up=e=>{P.delete(e.pointerId);pd=0};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=loc(e);zoomAt(x,y,V.s*(e.deltaY<0?1.15:1/1.15))},{passive:false});
 addEventListener('resize',()=>{if($('viewer').classList.contains('on'))fit()})})();

 const sn=seenA();if(!sn.includes(a.k)){sn.push(a.k);try{localStorage.setItem('sboi_arch_seen',JSON.stringify(sn))}catch(e){}}}

$('back').onclick=back;$('close').onclick=close;$('scrim').onclick=close;

 const nb=e.target.closest('[data-node]');if(nb){close();try{if(parent!==window){parent.postMessage('sboi:node'+nb.dataset.node,'*');return}}catch(_){}location.href='node.html#n'+nb.dataset.node;return}
 const t=e.target.closest('[data-a]');if(t){view(+t.dataset.a);return}
