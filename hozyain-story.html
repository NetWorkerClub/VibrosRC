<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07050f">
<title>Хозяин</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{background:#05030a;color-scheme:dark}</style><style>@font-face{font-family:"Ruslan Display";src:url(morok-ruslan.287f6184.woff) format("woff");font-display:block}#flowOv{position:fixed;inset:0;z-index:200;background:#0a0718;display:flex;flex-direction:column}#flowOv iframe{flex:1;border:0;width:100%}#flowOv .btn{margin:10px auto calc(env(safe-area-inset-bottom) + 12px);flex:none}
</style><style>
:root{--night:#07050f;--ink:#f3eeff;--muted:#b9b0d6;--dim:#7f75a6;--gold:#e8b85a;--violet:#a98bff;--panel:rgba(12,9,22,.86);--line:rgba(232,184,90,.35);
--disp:"Philosopher",Georgia,serif;--text:"PT Serif",Georgia,serif;--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--text);display:flex;justify-content:center;align-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;max-width:calc(100dvh*.5625);overflow:hidden;background:var(--night)}
@media (min-aspect-ratio:9/16){#stage{max-width:calc(100dvh*.5625)}}
.layer{position:absolute;inset:0}
/* backgrounds: two stacked images for crossfade */
#bgA,#bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,filter 1.2s ease}
#bgA.on,#bgB.on{opacity:1}
.ph-bg{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22%;font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);opacity:0;transition:opacity .9s}
.ph-bg.on{opacity:1}
/* panorama */
#pano{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .8s}
#pano::-webkit-scrollbar{display:none}
#pano.on{opacity:1;pointer-events:auto}
#panoIn{position:relative;height:100%}
#panoIn img{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;transition:opacity 2.4s ease}
#panoSun{opacity:0}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;color:var(--ink);font:600 12px var(--ui);cursor:pointer}
.spot.talk{display:flex;flex-direction:column;align-items:center;gap:4px}
.spot.talk i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 25%,rgba(232,184,90,.9) 30%,rgba(232,184,90,0) 70%);box-shadow:0 0 18px 6px rgba(232,184,90,.45);animation:pulse 2.2s ease-in-out infinite}
.spot.talk b{padding:4px 9px;border-radius:99px;background:rgba(10,7,18,.72);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.spot.talk.done{opacity:.45;pointer-events:none}
.spot.talk.done i{animation:none;box-shadow:none;background:rgba(255,255,255,.4)}
.spot.hid{width:64px;height:64px}
.spot.hid.found::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.55)}
@keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 26px 10px rgba(232,184,90,.55)}}
.decor{position:absolute;pointer-events:none}
#candles{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:14px;display:none;gap:10px;z-index:30;padding:8px 10px;border-radius:12px;background:rgba(10,7,18,.6);border:1px solid var(--line)}
#candles.on{display:flex}
.cdl{width:14px;height:38px;position:relative}
.cdl::before{content:"";position:absolute;bottom:0;left:2px;width:10px;height:24px;border-radius:2px;background:linear-gradient(#f4ead2,#c9b98f)}
.cdl::after{content:"";position:absolute;bottom:25px;left:3px;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3b0,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick .18s infinite alternate}
.cdl.out::after{display:none}
.cdl.out::before{background:linear-gradient(#8d8470,#5c5546)}
@keyframes flick{to{transform:scaleY(1.12) translateY(-1px)}}
#panoHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:30;font:600 12.5px var(--ui);color:var(--ink);background:rgba(10,7,18,.7);border:1px solid var(--line);border-radius:99px;padding:7px 14px;white-space:nowrap;display:none}
#panoHint.on{display:block}
/* sprites */
#sprites{pointer-events:none}
.spr{position:absolute;bottom:0;height:76%;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .45s ease,left .5s ease,height .5s ease,filter .5s}
.spr.on{opacity:1}
.spr img{height:100%;width:auto;display:block;filter:drop-shadow(0 0 18px rgba(0,0,0,.55))}
.spr.ph{width:52%;display:flex;align-items:flex-end;justify-content:center}
.spr.ph svg{height:100%;width:auto}
.spr.ph span{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);font:600 11px var(--ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;white-space:nowrap}
.spr.small{height:30%}
.spr.dim img,.spr.dim svg{filter:brightness(.55) saturate(.7)}
/* fx */
#fx{pointer-events:none;z-index:15}
#fog{position:absolute;inset:-20%;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 30% 60%,rgba(200,205,220,.38),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(190,195,215,.3),transparent 50%),radial-gradient(ellipse at 50% 92%,rgba(215,215,230,.45),transparent 60%);animation:fogmove 18s ease-in-out infinite alternate;filter:blur(8px)}
#fog.on{opacity:1}
@keyframes fogmove{to{transform:translate(6%,-3%) scale(1.08)}}
#veil{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
#flash{position:absolute;inset:0;opacity:0;background:#b89bff;mix-blend-mode:screen}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55))}
.sepia #bgA,.sepia #bgB{filter:sepia(.9) contrast(1.1) brightness(.85)}
#memo{position:absolute;left:0;right:0;top:38%;text-align:center;font:italic 20px var(--text);color:#f5e6c4;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .25s;padding:0 30px}
#memo.on{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
/* title card */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.4s;text-align:center;padding:0 24px}
#title.on{opacity:1}
#title h1{margin:0;font:400 54px var(--disp);letter-spacing:.06em;color:#efe4ff;text-shadow:0 0 28px rgba(169,139,255,.7),0 2px 4px #000}
#title p{margin:0;font:400 18px var(--text);color:#e6dcc4;text-shadow:0 2px 8px #000}
/* dialogue */
#ui{z-index:20}
#box{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);min-height:142px;padding:16px 18px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
#box.on{display:block}
#box.port{padding-left:104px}
#name{position:absolute;top:-15px;left:16px;padding:5px 14px;border-radius:99px;background:#1a1330;border:1px solid var(--line);font:400 15px var(--disp);letter-spacing:.04em;color:var(--gold);display:none}
#box.port #name{left:104px}
#name.on{display:block}
#txt{font:400 18px/1.45 var(--text);color:var(--ink);min-height:52px}
#txt.th{font-style:italic;color:#d8cdf5}
#txt.act{font-style:italic;color:var(--muted);font-size:16.5px}
#txt.scr{font-style:italic;color:#cfc6e8;font-size:16.5px}
#portrait{position:absolute;left:12px;bottom:14px;width:82px;height:82px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);display:none;box-shadow:0 0 0 4px rgba(232,184,90,.12)}
#portrait.on{display:block}
#portrait img{width:100%;height:100%;object-fit:cover}
#more{position:absolute;right:16px;bottom:10px;width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);opacity:0;animation:bob 1s ease-in-out infinite}
#more.on{opacity:.9}
@keyframes bob{50%{transform:translate(0,4px) rotate(45deg)}}
/* choices */
#choices{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:10px;z-index:25}
#choices.on{display:flex}
#choices .cq{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:2px;text-shadow:0 1px 6px #000}
.ch{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(16,11,30,.92);color:var(--ink);font:400 16.5px/1.35 var(--text);cursor:pointer;transition:transform .15s,background .15s;animation:chin .35s both}
.ch:active{transform:scale(.98);background:rgba(40,28,70,.95)}
.ch:disabled{opacity:.4}
.ch small{display:block;margin-top:4px;font:500 11.5px var(--ui);color:var(--dim)}
@keyframes chin{from{opacity:0;transform:translateY(10px)}}
/* toast */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-10px);z-index:45;padding:9px 16px;border-radius:99px;background:rgba(18,12,34,.92);border:1px solid var(--gold);color:#f7e7c0;font:600 13.5px var(--ui);opacity:0;transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:14px;height:14px}
/* top bar */
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:35;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,7,18,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px}
#chap:empty{visibility:hidden}
#chap{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(10,7,18,.5);padding:6px 12px;border-radius:99px}
/* modal / menus */
.modal{position:absolute;inset:0;z-index:60;background:rgba(5,3,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.modal.on{display:flex}
.modal h2{margin:0 0 8px;font:400 30px var(--disp);color:#efe4ff;letter-spacing:.05em}
.btn{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(20,14,38,.95);color:var(--ink);font:600 15px var(--ui);cursor:pointer;text-align:center}
.btn.gold{background:linear-gradient(#f1c977,#c99437);color:#1c1206;border-color:#f1c977}
.btn small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px}
.btn.gold small{color:#4a3511}
#log{position:absolute;inset:0;z-index:61;background:rgba(5,3,10,.94);display:none;flex-direction:column}
#log.on{display:flex}
#logList{flex:1;overflow:auto;padding:70px 20px 30px;font:400 16px/1.45 var(--text)}
#logList p{margin:0 0 12px}
#logList b{font:400 13px var(--disp);color:var(--gold);display:block;letter-spacing:.04em}
#logList .th{font-style:italic;color:#d8cdf5}
#logList .act{font-style:italic;color:var(--muted)}
/* QTE */
#qte{position:absolute;inset:0;z-index:50;display:none;touch-action:none}
#qte.on{display:block}
#qte .qhint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);text-align:center;font:700 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px #000}
#qte .qsub{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 94px);text-align:center;font:400 16px var(--text);color:#e7dcff;text-shadow:0 2px 10px #000;padding:0 30px}
#qte .qtime{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top) + 50px);height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#qte .qtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a3a,#ffd27a);transform-origin:left}
#lantern{position:absolute;left:50%;bottom:16%;width:150px;height:150px;transform:translateX(-50%);display:grid;place-items:center}
#lantern svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
#lantern .glow{position:absolute;left:50%;top:55%;width:600px;height:600px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,170,60,.18) 35%,transparent 62%);pointer-events:none;transition:opacity .1s}
#lantern .lamp{width:70px;position:relative}
#lantern.held .lamp{transform:scale(.96)}
#mara{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);height:46%;transition:height .2s linear,opacity .3s;opacity:.9;filter:blur(1.2px)}
#mara svg{height:100%;width:auto;display:block}
#swipe{white-space:nowrap;position:absolute;left:50%;top:40%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;font:700 13px var(--ui);letter-spacing:.14em;color:#fff;text-transform:uppercase;text-shadow:0 2px 10px #000}
#swipe.on{display:flex}
#swipe svg{width:44px;height:90px;animation:sw 0.9s ease-in-out infinite}
@keyframes sw{0%{transform:translateY(-14px);opacity:0}40%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.qbars{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 150px);display:flex;flex-direction:column;gap:14px}
.qbar{font:600 13px var(--ui);color:#fff;text-shadow:0 1px 6px #000}
.qbar div{margin-top:6px;height:12px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3a,#ffe08a);border-radius:12px}
.qbar.ok i{background:linear-gradient(90deg,#8fe08a,#d8ffb0)}
#tapBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:2px solid #ffd27a;background:radial-gradient(circle,rgba(255,150,60,.55),rgba(120,40,10,.6));color:#fff;font:800 13px var(--ui);letter-spacing:.1em;display:grid;place-items:center;box-shadow:0 0 30px rgba(255,140,50,.6)}
#tapBtn.hit{transform:translateX(-50%) scale(.92)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px #ff8a3a;pointer-events:none;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.qres{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 34px var(--disp);letter-spacing:.06em;color:#fff;text-shadow:0 0 20px rgba(255,200,120,.8);opacity:0;transition:opacity .4s;white-space:nowrap}
.qres.on{opacity:1}
.qres.bad{color:#d9c8ff;text-shadow:0 0 20px rgba(150,110,255,.8)}
/* tarot */
#tarot{position:absolute;inset:0;z-index:48;display:none}
#tarot.on{display:block}
#tarot .tt{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font:400 22px var(--disp);color:#f2e6c9;text-shadow:0 2px 10px #000;letter-spacing:.04em}
#tarot .ts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 98px);text-align:center;font:600 12px var(--ui);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#fan{position:absolute;left:0;right:0;bottom:12%;height:44%}
.card{position:absolute;bottom:0;left:50%;width:27%;aspect-ratio:.58;margin-left:-13.5%;transform-origin:50% 140%;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;cursor:pointer;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.card .f{transform:rotateY(180deg)}
.card svg{width:100%;height:100%;display:block}
.card.pick{z-index:5}
#reading{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:none;font:400 16px/1.4 var(--text)}
#reading.on{display:block}
#reading b{font:400 17px var(--disp);color:var(--gold);letter-spacing:.04em}
#reading p{margin:6px 0 0}
#reading .k{color:#d8cdf5;font-style:italic}
#reading .lb{font:600 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-top:8px}
#alfPeek{position:absolute;right:-6%;bottom:30%;width:36%;transform:rotate(-8deg);transition:transform .4s;cursor:pointer;display:none;z-index:6}
#alfPeek.on{display:block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:rotate(-14deg) translateX(-8px)}}
/* end screen */
#end{position:absolute;inset:0;z-index:58;background:radial-gradient(ellipse at 50% 20%,#1d1338,#07050f 70%);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 48px) 22px 30px;overflow:auto}
#end.on{display:flex}
#end h2{margin:0;font:400 34px var(--disp);color:#efe4ff;letter-spacing:.05em;text-align:center}
#end .sub{font:400 16px var(--text);color:var(--muted);margin:6px 0 20px;text-align:center}
.tl{width:100%;max-width:360px;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin:0 0 14px;font:400 15.5px/1.35 var(--text)}
.tl div::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(232,184,90,.6)}
.tl small{display:block;font:500 11.5px var(--ui);color:var(--dim);letter-spacing:.04em}
.stat{width:100%;max-width:360px;display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font:600 14px var(--ui)}
.stat span{color:var(--muted);font-weight:500}
/* demo menu */
#home{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:linear-gradient(rgba(7,5,15,.35),rgba(7,5,15,.85)),var(--homebg) center/cover}
#home h1{margin:0;font:400 58px var(--disp);color:#efe4ff;letter-spacing:.06em;text-shadow:0 0 30px rgba(169,139,255,.7)}
#home .tag{font:400 17px var(--text);color:#e6dcc4;margin:-4px 0 14px;text-shadow:0 2px 8px #000}
#home .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
#home .grid .btn{padding:11px 8px;font-size:13px}
#home .lbl{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#home .note{font:500 11.5px var(--ui);color:var(--dim);text-align:center;max-width:300px;margin-top:8px;line-height:1.45}

/* world + camera */
#world{position:absolute;top:0;bottom:0;left:0;width:100%;will-change:transform}
#world #bgA,#world #bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#world #sprites{position:absolute;inset:0}
.spr .fig{position:relative;height:100%;width:100%;display:block;transition:filter .9s}
.spr .fig img{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 14px rgba(0,0,0,.45))}
.spr .tint{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:soft-light;opacity:.55;transition:background .9s}
.spr.flip .fig{transform:scaleX(-1)}
.spr::after{content:"";position:absolute;left:50%;bottom:-2%;width:70%;height:5%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);z-index:-1}
/* panorama: people instead of dots */
.spot.talk.who{transform:translate(-50%,-100%);display:block}
.spot.talk.who img,.spot.talk.who svg{height:100%;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,214,140,.55)) brightness(.92)}
.spot.talk.who b{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-size:11px}
.spot.talk.who:active img{transform:scale(.97)}
/* QTE: carry the fire */

/* ===== v1.0.27 ===== */
/* iOS draws a faint box around filtered sprites with a blurred shadow: no drop-shadow on sprites */
.spr .fig img,.warm .spr .fig img{filter:none!important}
/* fern flowers in «Вспышка» */
/* run through the fog */
.run{position:absolute;inset:0;overflow:hidden;background:#0a0c10}

.rkosh{position:absolute;bottom:4%;height:30%;opacity:0;filter:brightness(.55) blur(3px);transform:translateX(-50%) scaleX(var(--fx,1)) scale(.6);pointer-events:none}

.rkosh.sl.past{left:-10%}.rkosh.sr.past{left:110%}.rkosh.sc.past{bottom:-30%}

.hzSpots .ex{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:4}

.hzInt .irules{position:absolute;inset:0;z-index:9;background:rgba(8,6,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

.hzDrive .lights{position:absolute;left:-50%;right:-50%;top:30%;height:40%;background:
 radial-gradient(ellipse 18px 6px at 10% 40%,rgba(255,210,140,.9),transparent 70%),radial-gradient(ellipse 30px 8px at 37% 60%,rgba(255,80,60,.8),transparent 70%),
 radial-gradient(ellipse 22px 6px at 63% 30%,rgba(200,220,255,.8),transparent 70%),radial-gradient(ellipse 26px 7px at 88% 70%,rgba(255,190,120,.85),transparent 70%);
 background-size:50% 100%;filter:blur(3px);animation:hzPass 1.6s linear infinite;mix-blend-mode:screen;opacity:.75}

@keyframes hzPass{from{transform:translateX(0) scaleX(1.6)}to{transform:translateX(-50%) scaleX(1.6)}}
.hzDrive .drops{position:absolute;inset:0;background:
 radial-gradient(circle 3px at 12% 22%,rgba(255,255,255,.35),transparent 70%),radial-gradient(circle 2px at 33% 61%,rgba(255,255,255,.3),transparent 70%),
 radial-gradient(circle 4px at 71% 34%,rgba(255,255,255,.3),transparent 70%),radial-gradient(circle 2px at 86% 78%,rgba(255,255,255,.3),transparent 70%),
 radial-gradient(circle 3px at 52% 12%,rgba(255,255,255,.3),transparent 70%),radial-gradient(circle 2px at 22% 84%,rgba(255,255,255,.28),transparent 70%);
 background-size:180px 220px;animation:hzDrop 3s linear infinite}
@keyframes hzDrop{to{background-position:-60px 220px}}

.hzIns .fld img,.hzSpots .fld>img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}

.hzRec .says{width:min(94vw,440px);max-height:17vh;overflow-y:auto;background:rgba(20,15,12,.85);border:1px solid #4e4233;border-radius:8px;padding:5px 8px;margin:2px 0}

.hzInt .bub{display:block;padding-bottom:20px}

.hzInt .res.crack{background:#7a1218;border:1px solid #e44;color:#fff}.hzInt .res.angry{background:#3a1212;border:1px solid #c33;color:#ffb2b2}.hzInt .res.wall{background:#2a241e;border:1px solid #6b5a43;color:#d9cdb5}

    const all=Object.keys(DIV),fresh=all.filter(k=>!seen.includes(k)),pool=(fresh.length>=3?fresh:all).slice().sort(()=>Math.random()-.5);
    const order=pool.slice(0,3);if(fresh.length<3)order.sort(()=>Math.random()-.5);let picked=0;const cards=[];

      c.innerHTML=`<div class="in"><div class="b">${BACK}</div><div class="f"></div></div>`;deck.appendChild(c);cards.push(c);c.onclick=()=>pick(c)}

          rd.innerHTML=`<b>Расклад для: ${g[0].toLowerCase()}</b><p class="k">${ex?ex[1]:'Карты легли спокойно. Ни беды, ни праздника: всё в твоих руках.'}</p><p style="color:var(--muted);font-style:italic;margin-top:6px">${round+1<ROUNDS?'Нажми, чтобы погадать следующей':'Нажми, чтобы закончить'}</p>`;
          await sleep(300);T.onclick=()=>{T.onclick=null;round++;if(round<ROUNDS){sfx('tick');deal()}else{T.classList.remove('on');T.innerHTML='';MODE='';res()}}};
        setTimeout(()=>{T.onclick=fin},400)}}}
  deal()})}

/* ---------- save / scenes ---------- */
function save(i){try{localStorage.setItem(SAVE_KEY,JSON.stringify({scene:i,st:ST}))}catch(e){}}
function snap(i){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY+'_snap')||'{}');o[i]=ST;localStorage.setItem(SAVE_KEY+'_snap',JSON.stringify(o))}catch(e){}}
/* сцена из списка: состояние последнего прохождения. Не дошёл до неё — берём самую позднюю сцену до неё; ничего нет — перенос из прошлой главы, и только потом пресет */
function sceneState(i){for(let k=i;k>=0;k--){const v=snapOf(k);if(v)return v}const s=ST0();const carried=Object.keys(s.flags||{}).length>0;return carried?s:(window.PRESET?window.PRESET(i):s)}
function pgReload(){try{document.body.classList.add('pgOut')}catch(_){}setTimeout(()=>location.reload(),330)}
function snapOf(i){try{return (JSON.parse(localStorage.getItem(SAVE_KEY+'_snap')||'{}'))[i]||null}catch(e){return null}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){return null}}
async function resetStage(){window.KAT_MAP=null;window.KAT_SET=null;try{muStop(.6)}catch(e){}try{voStop();amb(null,{fade:.5})}catch(e){}$('rules')&&$('rules').classList.remove('on');hideBox();$('choices').classList.remove('on');$('qte').classList.remove('on');$('qte').innerHTML='';$('tarot').classList.remove('on');$('pano').classList.remove('on');$('candles').classList.remove('on');$('panoHint').classList.remove('on');fog(0);$('stage').classList.remove('sepia');$('veil').style.opacity=0;Object.values(SPR).forEach(d=>d.remove());for(const k in SPR)delete SPR[k];{const V=$('bgV');if(V){V.classList.remove('on');try{V.pause()}catch(e){}}}$('bgA').classList.remove('on');$('bgB').classList.remove('on');$('bgA').style.filter=$('bgB').style.filter='';$('world').style.filter='';const cl=$('crowdL');if(cl)cl.innerHTML='';$('stage').classList.remove('bars');CAMZ=1;CAMY=50;lastWho='';lineN=0;$('lidT').style.height=$('lidB').style.height='0%'}
let playing=0;
async function play(from=0,st,only){
  RULES_SEEN={};const my=++playing;GEN=my;ABORT=0;if(st)ST=JSON.parse(JSON.stringify(st));else if(from===0)ST=ST0();
  await resetStage();$('home').style.display='none';
  const SC=window.SCENES;
  /* новое прохождение с начала главы: старые снимки сцен больше не про него */
  if(from===0&&!only){try{localStorage.removeItem(SAVE_KEY+'_snap')}catch(e){}}
  try{for(let i=from;i<SC.length;i++){if(my!==playing)return;save(i);if(!only)snap(i);$('chap').textContent=SC[i].tag||'';await run(SC[i].steps);if(only)break}}
  catch(e){if(e.message!=='abort')console.error(e)}
  if(my===playing){await resetStage();showHome()}}
function stop(){ABORT=1;playing++;GEN=-1;if(tapRes){const r=tapRes;tapRes=null;r()}}

/* ---------- загрузочный экран с процентами: картинки первых сцен главы ---------- */
function bootLoad(k=0){if(!(window.SCENES||[]).length||!window.ASSETS){if(k<60)setTimeout(()=>bootLoad(k+1),50);return}try{
  const A0=window.ASSETS||{},urls=new Set();
  const walk=(x,d)=>{if(!x||d>8||urls.size>60)return;if(Array.isArray(x)){x.forEach(y=>walk(y,d+1));return}if(typeof x!=='object')return;
    if(x.c==='bg'&&(A0.bg||{})[x.n]&&!/\.(mp4|webm)$/.test(A0.bg[x.n]))urls.add(A0.bg[x.n]);
    if(x.c==='show'&&((A0.sp||{})[x.w]||{})[x.e||'neutral'])urls.add(A0.sp[x.w][x.e||'neutral']);
    for(const k in x)if(k!=='c'&&typeof x[k]==='object')walk(x[k],d+1)};
  (window.SCENES||[]).slice(0,2).forEach(sc=>walk(sc.steps,0));
  ((A0.sp||{}).kat)&&Object.values(A0.sp.kat).slice(0,4).forEach(u=>urls.add(u));
  const list=[...urls].slice(0,48);if(!list.length)return;
  const b=document.createElement('div');b.id='boot';b.innerHTML='<div class="bt"><b>'+(window.STORY_TITLE||document.title.split('·')[0]||'')+'</b><div class="bb"><i></i></div><span>Загрузка… 0%</span></div>';b.style.backgroundImage='linear-gradient(rgba(5,3,10,.35),rgba(5,3,10,.85)),url(loading-'+(window.STORY_ID||'morok')+'.webp)';document.body.appendChild(b);
  const bar=b.querySelector('.bb i'),tx=b.querySelector('span');let n=0,done=false;
  const tick=()=>{n++;const p=Math.round(n/list.length*100);bar.style.width=p+'%';tx.textContent='Загрузка… '+p+'%';if(n>=list.length)fin()};
  const fin=()=>{if(done)return;done=true;bar.style.width='100%';tx.textContent='Готово';setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),600)},250)};
  list.forEach(u=>{const im=new Image();im.onload=im.onerror=tick;im.src=u});setTimeout(fin,25000)}catch(e){}}

/* ---------- Лист / улика крупно ---------- */
/* бумаги: свёрстанные документы (CSS), а не текст поверх фото. Вид по ключу картинки. */
const PKIND={paper_news_a:'news',paper_news_b:'news',paper_news_columbia:'news',paper_lined:'typed',paper_protocol:'typed',paper_card:'card',
 paper_manifest:'form',paper_note:'note',paper_sticky:'sticky',paper_rx:'rx'};
const PAPERS=PKIND;
const NEWSDATE={paper_news_columbia:'Пятница, 14 октября',paper_news_b:'Пятница',paper_news_a:'Четверг'};
function paperHTML(k,txt,extra){const kind=PKIND[k];if(!kind){const u=U(k);return u?`<img alt="" src="${u}">`:''}
  const T=String(txt||'').replace(/\n/g,'<br>');
  if(kind==='news'){const raw=String(txt||'');const m=raw.match(/<b>([\s\S]*?)<\/b>/);let head,rest;if(m){head=m[1];rest=raw.replace(m[0],'').replace(/^\s*\n/,'')}else{const p=raw.split('\n');head=p.shift()||'';rest=p.join('\n')}head=head.replace(/\n/g,'<br>');rest=rest.trim().replace(/\n/g,'<br>');
    return `<div class="pp doc news"><div class="d-mast">Сент-Ривер Курьер</div><div class="d-dl"><span>${NEWSDATE[k]||''}</span><span>Цена 2 цента</span></div>
     <div class="d-hl">${head}</div>${rest?`<div class="d-by">${rest}</div>`:''}<div class="d-cols">${'<i></i>'.repeat(18)}</div></div>`}
  if(kind==='typed')return `<div class="pp doc typed"><div class="d-tx">${T}</div></div>`;
  if(kind==='card')return `<div class="pp doc cipher"><div class="d-ch">ШИФРОВКА · КЛЮЧ 714</div><div class="d-tx">${T}</div></div>`;
  if(kind==='form'){const rows=String(txt||'').split('\n');return `<div class="pp doc form"><div class="d-fh">Грузовая накладная № 0714</div><div class="d-fs">Порт Сент-Ривер · таможенный пост</div>${rows.map(r=>`<div class="d-fr">${r}</div>`).join('')}<div class="d-st">ДОСМОТРЕНО</div></div>`}
  if(kind==='note')return `<div class="pp doc hnote"><div class="d-tx">${T}</div></div>`;
  if(kind==='sticky')return `<div class="pp doc sticky"><div class="d-tx">${T}</div></div>`;
  if(kind==='rx')return `<div class="pp doc rx"><div class="d-fh">Д-р Эллиот Морроу</div><div class="d-fs">психиатр · Управление полиции</div><div class="d-tx">${T}</div><div class="d-sig">Э. Морроу</div></div>`;
  return ''}
/* размер шрифта документа — от его ширины; если не влезает — ужимаем */
function fitPaper(root){root.querySelectorAll('.pp.doc').forEach(pp=>{const go=()=>{const w=pp.clientWidth;if(!w){setTimeout(go,120);return}
  let fs=w/18;pp.style.fontSize=fs+'px';let n=0;const lim=pp.dataset.maxh?+pp.dataset.maxh:Infinity;
  while(pp.scrollHeight>pp.clientHeight+2&&n++<30){fs*=.94;pp.style.fontSize=fs+'px'}};requestAnimationFrame(go)})}
W.HZ_PAPER={paperHTML,fitPaper};
/* ---------- Лист / улика крупно: {img, text, extra:{head|sig|low}, cap} ---------- */

/* ---------- Допрос «Одна сигарета» ----------
   c: {who, e, bg, hint, need (трещин для успеха), puffs (затяжек), id,
       tac:{press,kind,bluff,silence,deal,provoke,proof,badge}: [тип,'реплика'] тип: 'crack' | 'wall' | 'angry' | 'tell'
       cracks:['что выдал на 1-й трещине','…на 2-й', …], ok, fail} */
/* реплика Полины на каждую тактику (можно переопределить в c.my) */
const MYLINE={kind:'Я вижу, вам тяжело. Расскажите, как было. Я слушаю.',press:'Хватит. Говорите — или ночуете здесь до суда.',bluff:'Ваши уже всё рассказали. Остались вы.',
 silence:'(Полина молча смотрит и затягивается.)',deal:'Скажете правду — я помогу. Слово.',provoke:'Трус. Даже соврать как следует не можете.',proof:'А это что? (кладёт на стол улику)',badge:'(кладёт жетон на стол) Полиция Сент-Ривер. Детектив Устинова.'};
const TAC=[['kind','Сочувствие'],['press','Давление'],['bluff','Блеф'],['silence','Молчание'],['deal','Сделка'],['provoke','Провокация'],['proof','Улика'],['badge','Значок']];
function interrogUI(c){return new Promise(res=>{
  const N=c.puffs||6,need=c.need||2;let left=N,cr=0,anger=0,used={},done=false;
  const bgu=(A.bg||{})[c.bg]||'';const ic=U('ui_hz_tactics');
  const q=qWrap('hzInt',`<div class="ibg" style="background-image:url('${bgu}')"></div><div class="ish"></div>
   <img class="who" alt="" src="${spr(c.who,c.e)}"><div class="cig"><img alt="" src="${U('cig1')}"><b class="smoke"></b></div>
   <div class="qh">${esc(c.hint||'Допрос')}</div><div class="qs">Одна сигарета. Каждая тактика — затяжка.</div>
   <div class="cracks">${[...Array(need)].map(()=>'<i></i>').join('')}</div>
   <div class="tban"></div><div class="bub"><span class="bt"></span><i class="nx">нажмите ▸</i></div><div class="res"></div><div class="turn">Ваш ход: выберите тактику</div>
   <div class="tacs">${TAC.map(([k,t],i)=>`<button data-k="${k}"><img class="ic" alt="" src="${U('tac'+i)}"><b>${t}</b></button>`).join('')}</div>`);
  const cig=q.querySelector('.cig'),bub=q.querySelector('.bub'),who=q.querySelector('.who');
  if(!ST.flags.hz_int_rules){ST.flags.hz_int_rules=1;const r=el('div','irules',`<h3>Допрос: одна сигарета</h3>
    <p>У тебя <b>${N} ходов</b> — столько затяжек в сигарете. Каждый ход — одна тактика.</p>
    <p>Выбирай для каждого хода <b>разную тактику</b>: повтор не работает. Ищи слабое место человека — кто-то ломается от сочувствия, кто-то от улики, кто-то от блефа.</p>
    <p>Нужно <b>${need} ${need<5?'трещины':'трещин'}</b> — кружки наверху. Злость тратит лишнюю затяжку.</p><button class="chk">Начать</button>`);
    q.appendChild(r);r.querySelector('.chk').onclick=e=>{e.stopPropagation();r.remove()}}
  const EMB=[.9,.78,.65,.51,.41];const draw=()=>{const st=Math.min(4,Math.round((1-left/N)*4));const im=cig.querySelector('img');const u=U('cig'+(st+1));if(im.getAttribute('src')!==u)im.src=u;cig.style.setProperty('--ex',EMB[st]*100+'%');cig.classList.toggle('out',left<=0);q.querySelectorAll('.cracks i').forEach((x,i)=>x.classList.toggle('on',i<cr))};draw();
  const bt=bub.querySelector('.bt'),tban=q.querySelector('.tban'),resEl=q.querySelector('.res');
  let skip=null;bub.addEventListener('click',e=>{e.stopPropagation();skip&&skip()});
  /* реплика печатается по буквам; первое нажатие — допечатать, второе — дальше */
  const say=async(t,cls)=>{bub.className='bub on '+(cls||'');bt.textContent='';let i=0,full=false;
    await new Promise(r=>{const tick=setInterval(()=>{i+=2;bt.textContent=t.slice(0,i);if(i>=t.length){clearInterval(tick);full=true;bub.classList.add('ready')}},22);
      skip=()=>{if(!full){clearInterval(tick);bt.textContent=t;full=true;bub.classList.add('ready');return}skip=null;bub.classList.remove('ready');r()}})};
  const banner=(t,cls)=>{tban.textContent=t;tban.className='tban on '+(cls||'');setTimeout(()=>tban.classList.remove('on'),1300)};
  const result=(t,cls)=>{resEl.textContent=t;resEl.className='res on '+cls;setTimeout(()=>resEl.classList.remove('on'),1800)};
  const beats=async(L,cls)=>{const A=Array.isArray(L)?L:[L];for(let i=0;i<A.length;i++)await say(A[i],i%2?'me':cls)};
  const finish=async ok=>{if(done)return;done=true;flag((c.id||c.who)+'_int',ok?2:1);await wait(400);await qEnd(q,ok,c,res,false)};
  W.__hzSolve=ok=>{if(ok!==false){for(let i=1;i<=need;i++)flag((c.id||c.who)+'_c'+i);cr=need;finish(true)}else finish(false)};
  q.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{if(done||q.dataset.busy)return;const k=b.dataset.k;q.dataset.busy=1;q.classList.add('talk');
    b.classList.add('pick');setTimeout(()=>b.classList.remove('pick'),600);snd('tick');banner(b.querySelector('b').textContent);await wait(500);
    const [typ,line]=(c.tac||{})[k]||['wall','…'];if(used[k]){await say('Это вы уже спрашивали.','wall');delete q.dataset.busy;q.classList.remove('talk');return}used[k]=1;
    await say((c.my||{})[k]||MYLINE[k],'me');
    left--;snd('sfx_cig_inhale');draw();b.classList.add('used');
    if(typ==='crack'){cr++;who.classList.add('crack');setTimeout(()=>who.classList.remove('crack'),500);vib(40);await beats(line,'crack');
      result('Трещина '+cr+' из '+need,'crack');const ex=(c.cracks||[])[cr-1];if(ex){await say(ex,'fact');flag((c.id||c.who)+'_c'+cr)}draw()}
    else if(typ==='angry'){anger++;who.classList.add('shake');setTimeout(()=>who.classList.remove('shake'),400);vib(90);await beats(line,'angry');if(anger>=2){left=Math.max(0,left-1);draw();result('Злится: сгорела лишняя затяжка','angry')}else result('Злится','angry')}
    else{await beats(line,typ==='tell'?'tell':'wall');result(typ==='tell'?'Что-то есть… но не трещина':'Стена. Не сработало','wall')}

    if(cr>=need)return finish(true);
    if(left<=0){await say(c.out||'Сигарета догорела. Разговор окончен.','wall');finish(false)}})})}

/* свободная панорама пальцем в любую сторону: картинка больше экрана, тянем её, края не уходят за экран */
function pan2d(q,sc,fld,im,Z,start,onMove,free){let x=0,y=0,W0=0,H0=0,drag=null;im.draggable=false;im.addEventListener('dragstart',e=>e.preventDefault());
  const clamp=()=>{const vw=sc.clientWidth,vh=sc.clientHeight;if(free){x=Math.min(vw*free[0],Math.max(vw*free[0]-W0,x));y=Math.min(vh*free[1],Math.max(vh*free[1]-H0,y))}else{x=Math.min(0,Math.max(vw-W0,x));y=Math.min(0,Math.max(vh-H0,y))}fld.style.transform=`translate(${x}px,${y}px)`;onMove&&onMove()};
  const fit=()=>{const vh=sc.clientHeight,vw=sc.clientWidth,ar=(im.naturalWidth/im.naturalHeight)||16/9;H0=Math.max(vh*Z,vw/ar);W0=H0*ar;fld.style.width=W0+'px';fld.style.height=H0+'px';
    x=-(W0-vw)*(start&&start[0]!=null?start[0]:.5);y=-(H0-vh)*(start&&start[1]!=null?start[1]:.5);clamp()};
  if(im.complete&&im.naturalWidth)fit();else im.onload=fit;
  sc.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=[e.clientX,e.clientY,x,y,0];try{sc.setPointerCapture(e.pointerId)}catch(_){}});
  sc.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>6)drag[4]=1;x=drag[2]+dx;y=drag[3]+dy;clamp()});
  const up=e=>{if(drag&&drag[4]){sc.dataset.moved=1;setTimeout(()=>delete sc.dataset.moved,50)}drag=null};sc.addEventListener('pointerup',up);sc.addEventListener('pointercancel',up);
  return {fit}}
/* ---------- Осмотр с камерой ----------
   c:{bg, hint, frames, need, spots:[{id,x,y,label,key}] } — x,y в % фона. Кадр — когда точка в видоискателе. */
function inspectUI(c){return new Promise(res=>{
  const u=(A.bg||{})[c.bg]||'';let fr=c.frames||12;const got=new Set();const need=c.need||c.spots.filter(s=>s.key).length||3;let done=false;
  const q=qWrap('hzIns',`<div class="sc"><div class="fld"><img alt="" src="${u}"></div></div><div class="vf"><i></i><i></i><i></i><i></i><b></b><em class="rec">● REC</em><em class="exp">f/8 · 1/50</em></div>
   <div class="qh">${esc(c.hint||'Осмотр')}</div><div class="qs">Двигай картинку пальцем в любую сторону. Деталь в рамке — жми «Снимок».</div>
   <div class="hud"><span class="fr"></span><button class="shot">Снимок</button><button class="fin">Закончить</button></div><div class="strip"></div><div class="lab"></div>`);
  const sc=q.querySelector('.sc'),fld=q.querySelector('.fld'),im=fld.querySelector('img'),FR=q.querySelector('.fr'),strip=q.querySelector('.strip'),lab=q.querySelector('.lab');
  const hud=()=>{FR.textContent='Кадров: '+fr+' · найдено '+[...got].filter(id=>c.spots.find(s=>s.id===id&&s.key)).length+'/'+need};hud();
  const center=()=>{const r=q.getBoundingClientRect(),fr2=fld.getBoundingClientRect();return [(r.left+r.width/2-fr2.left)/fr2.width*100,(r.top+r.height*.45-fr2.top)/fr2.height*100]};
  const near=()=>{const [cx,cy]=center();const fw=fld.clientWidth,fh=fld.clientHeight;let best=null,bd=1e9;for(const s of c.spots){const dx=(s.x-cx)*fw/100,dy=(s.y-cy)*fh/100,d=Math.hypot(dx,dy);if(d<bd){bd=d;best=s}}return bd<q.clientWidth*.16?best:null};
  pan2d(q,sc,fld,im,1.25,[.5,.5],()=>{const s=near();const vf=q.querySelector('.vf');vf.classList.toggle('lock',!!s&&!got.has(s.id));vf.classList.toggle('done',!!s&&got.has(s.id))},[.5,.45]);
  const end=async()=>{if(done)return;done=true;const keys=c.spots.filter(s=>s.key).map(s=>s.id);const ok=keys.filter(k=>got.has(k)).length>=need;flag((c.id||c.bg)+'_ins',ok?2:1);
    c.spots.forEach(s=>{if(got.has(s.id))flag('ph_'+s.id)});await qEnd(q,ok,c,res,false)};
  q.querySelector('.shot').onclick=async()=>{if(done||fr<=0||q.dataset.snap)return;q.dataset.snap=1;setTimeout(()=>delete q.dataset.snap,650);fr--;snd('sfx_shutter');
    const sh=el('i','shut');q.appendChild(sh);setTimeout(()=>sh.remove(),520);
    setTimeout(()=>{const fl=el('i','flash');q.appendChild(fl);setTimeout(()=>fl.remove(),420)},140);
    q.classList.add('kick');setTimeout(()=>q.classList.remove('kick'),260);
    const s=near();if(s&&!got.has(s.id)){got.add(s.id);const t=el('div','ph','<b>'+esc(s.label)+'</b>');t.style.backgroundImage=`url('${u}')`;t.style.backgroundPosition=s.x+'% '+s.y+'%';strip.appendChild(t);
      const big=el('div','print','<i></i><b>'+esc(s.label)+'</b>');big.querySelector('i').style.backgroundImage=`url('${u}')`;big.querySelector('i').style.backgroundPosition=s.x+'% '+s.y+'%';q.appendChild(big);setTimeout(()=>big.classList.add('fly'),900);setTimeout(()=>big.remove(),1500);
      lab.textContent=s.label;lab.classList.add('on');setTimeout(()=>lab.classList.remove('on'),2600);vib(25)}
    else{lab.textContent='Пустой кадр.';lab.classList.add('on');setTimeout(()=>lab.classList.remove('on'),1200)}
    hud();if(fr<=0||c.spots.filter(s=>s.key).every(s=>got.has(s.id)))setTimeout(end,1400)};
  q.querySelector('.fin').onclick=end;W.__hzSolve=ok=>{if(ok!==false)c.spots.filter(s=>s.key).forEach(s=>got.add(s.id));end()}})}

/* ---------- Реконструкция по этапам: план, фишки-лица (силуэт, если лица нет), кто где был ----------
   c:{plan, hint, tokens:[{id,ch,e,name}], slots:[{id,x,y,name}],
      stages:[{t:'20:05 — до убийства', sub:'подсказка', tokens:[ids], answer:{token:slot}}], tries:3}
   Старый формат {answer} = один этап. В одном месте может стоять несколько человек. */
function reconUI(c){return new Promise(res=>{
  const ST_=c.stages||[{t:c.hint||'Реконструкция',tokens:c.tokens.map(t=>t.id),answer:c.answer}];
  let si=0,sel=null,place={},tries=c.tries||3,score=0,done=false;
  const tok=id=>c.tokens.find(t=>t.id===id);
  const face=t=>t&&t.ch?`style="background-image:url('${PT(t.ch,t.e)}')"`:'';
  const COL={eddie:'#8a8a8a',kav:'#f2efe6',art:'#c8432f',mal:'#2f6db8',sam:'#3f9a3f',dot:'#c99a12'};const hist={};
  const q=qWrap('hzRec',`<div class="top"><span class="trs"></span><div class="qh"></div><div class="stg"></div><div class="hb"><button class="und">Сбросить</button><button class="chk">Проверить</button></div></div><div class="qs"></div><button class="stab">Показания и улики ▾</button><div class="says"></div>
   <div class="plan"><img alt="" src="${U(c.plan)}"><svg class="rt" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>${c.slots.map(s=>`<button class="slot" data-s="${s.id}" style="left:${s.x}%;top:${s.y}%"><div class="fs"></div><span>${esc(s.name)}</span></button>`).join('')}</div>

  const trs=()=>{const e=q.querySelector('.trs');if(e)e.innerHTML='Попытки<br>'+'<i></i>'.repeat(Math.max(0,tries))+'<i class="off"></i>'.repeat(Math.max(0,(c.tries||3)-tries))};
  const tokEl=q.querySelector('.tok'),qh=q.querySelector('.qh'),qs=q.querySelector('.qs'),stg=q.querySelector('.stg');
  const says=q.querySelector('.says'),svg=q.querySelector('.rt'),stab=q.querySelector('.stab');
  stab.onclick=e=>{e.stopPropagation();const o=says.classList.toggle('on');stab.textContent=o?'Скрыть показания ▴':'Показания и улики ▾'};says.onclick=()=>{says.classList.remove('on');stab.textContent='Показания и улики ▾'};const SL=id=>c.slots.find(x=>x.id===id);
  const route=()=>{let h='';Object.keys(hist).forEach(k=>{const pts=hist[k];if(pts.length<2)return;const col=COL[k]||'#e6b867';
     for(let i=1;i<pts.length;i++){const a=SL(pts[i-1][0]),b=SL(pts[i][0]);if(!a||!b||a===b)continue;
       const mx=(a.x+b.x)/2+(b.y-a.y)*.12,my=(a.y+b.y)/2-(b.x-a.x)*.12;
       h+=`<path d="M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}" stroke="${col}" marker-end="url(#ah_${k})"/>`}});
     svg.innerHTML='<defs>'+Object.keys(COL).map(k=>`<marker id="ah_${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" fill="${COL[k]}"/></marker>`).join('')+'</defs>'+h};
  const pushHist=S=>{Object.keys(S.answer).forEach(k=>{(hist[k]=hist[k]||[]).push([S.answer[k],S.t.split(' ')[0]])});route()};
  const setStage=()=>{const S=ST_[si];place={};sel=null;tries=c.tries||3;trs();delete q.dataset.busy;
    qh.textContent=S.t;qs.textContent=(S.sub||'Нажми человека, потом место на плане.')+'';
    says.innerHTML=(S.says||[]).map(([k,t])=>{if(k==='ev')return `<p class="ev"><i class="fc ev"></i><b>Улика:</b> ${esc(t)}</p>`;const tk=tok(k);return `<p><i class="fc${tk&&tk.ch?'':' sil'}" ${face(tk)}></i><b style="color:${COL[k]||'#e6b867'}">${esc(tk?tk.name:k)}:</b> ${esc(t)}</p>`}).join('')+'<small>нажмите, чтобы закрыть</small>';says.classList.add('on');stab.textContent='Скрыть показания ▴';
    stg.innerHTML=ST_.map((x,i)=>`<i class="${i<si?'ok':i===si?'cur':''}"></i>`).join('');
    tokEl.innerHTML=S.tokens.map(id=>{const t=tok(id);return `<button data-t="${id}" style="border-color:${COL[id]||'#5a4a36'}"><span class="fc${t.ch?'':' sil'}" ${face(t)}></span><b>${esc(t.name)}</b></button>`}).join('');
    tokEl.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=sel===b.dataset.t?null:b.dataset.t;snd('tick');draw()});draw()};
  const draw=()=>{tokEl.querySelectorAll('[data-t]').forEach(b=>{b.classList.toggle('sel',b.dataset.t===sel);b.classList.toggle('placed',!!place[b.dataset.t])});

  q.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(!sel){const here=Object.keys(place).filter(k=>place[k]===s.dataset.s);if(here.length){delete place[here[here.length-1]];draw()}return}
    place[sel]=s.dataset.s;sel=null;snd('tick');draw()});
  q.querySelector('.und').onclick=()=>{place={};sel=null;draw()};
  const next=async ok=>{if(ok)score++;pushHist(ST_[si]);si++;if(si<ST_.length){await wait(900);setStage();return}
    qh.textContent='Маршруты';says.innerHTML='';qs.textContent='Кто куда шёл: 20:05 → 20:14 → 20:40.';tokEl.innerHTML='';place={};draw();await wait(3200);
    done=true;const okAll=score>=Math.ceil(ST_.length*.66);flag((c.id||'recon')+'_rec',okAll?2:1);await qEnd(q,okAll,c,res,false)};
  q.querySelector('.chk').onclick=async()=>{if(done||!ST_[si]||q.dataset.busy)return;q.dataset.busy=1;const S=ST_[si];const keys=Object.keys(S.answer);
    if(keys.some(k=>!place[k])){qs.textContent='Расставь всех.';delete q.dataset.busy;return}

    q.querySelectorAll('.slot').forEach(s=>{const here=Object.keys(place).filter(k=>place[k]===s.dataset.s);if(here.length)s.classList.add(here.every(k=>S.answer[k]===s.dataset.s)?'good':'badp')});

/* ---------- Разминирование: провода от часов к капсюлям, таймер. c:{time:45, hint, id, ok, fail} ---------- */
const BT={L:[[112,857],[172,857],[242,855],[112,950],[168,950],[238,948]],R:[[800,855],[870,855],[935,855],[805,950],[880,950],[945,950]],C:[[520,1115],[378,1062],[665,1060]]};
function bombUI(c){return new Promise(res=>{
  let left=c.time||45,done=false,cut=0;const COLS=['#5c1712','#1c2638','#2e3322','#3d2a1a','#141414'];
  const sh=a=>a.slice().sort(()=>Math.random()-.5);const caps=sh(BT.L.concat(BT.R));const cols=sh(COLS);
  const W_=[];BT.C.forEach((p,i)=>W_.push({a:p,b:caps[i],live:true}));W_.push({a:caps[3],b:caps[4],live:false});W_.push({a:caps[5],b:[Math.random()<.5?70:940,1500+Math.random()*150],live:false});
  const R=()=>Math.random();
  W_.forEach((w,i)=>{w.col=cols[i];const y1=1300+R()*380,y2=1300+R()*380;const P=[w.a,[80+R()*850,y1],[80+R()*850,y2],w.b];
    w.pts=[];const ph=R()*6,am=5+R()*7,fq=3+R()*4;for(let t=0;t<=1.0001;t+=1/70){const u=1-t;const q=[0,1].map(j=>u*u*u*P[0][j]+3*u*u*t*P[1][j]+3*u*t*t*P[2][j]+t*t*t*P[3][j]);const e=Math.sin(Math.PI*t);q[0]+=Math.sin(t*fq*6.28+ph)*am*e;q[1]+=Math.cos(t*fq*4.1+ph)*am*.7*e;w.pts.push(q)}});
  const pl=a=>a.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  const seg=(a,col)=>{const sh=a.map(p=>[p[0]+7,p[1]+10]),hl=a.map(p=>[p[0]-2.5,p[1]-3]);return `<polyline class="sh" points="${pl(sh)}"/><polyline class="wr" points="${pl(a)}" style="stroke:${col}"/><polyline class="hl" points="${pl(hl)}"/>`};
  const draw=()=>W_.map((w,i)=>w.cutAt!=null?seg(w.pts.slice(0,w.cutAt-1),w.col)+seg(w.pts.slice(w.cutAt+2),w.col)+`<circle class="cu" cx="${w.pts[w.cutAt-1][0]}" cy="${w.pts[w.cutAt-1][1]}" r="7"/><circle class="cu" cx="${w.pts[w.cutAt+2][0]}" cy="${w.pts[w.cutAt+2][1]}" r="7"/>`
    :seg(w.pts,w.col)+`<polyline class="hit" data-i="${i}" points="${pl(w.pts)}"/>`).join('')
    +W_.map(w=>`<circle class="fe" cx="${w.a[0]}" cy="${w.a[1]}" r="7"/><circle class="fe" cx="${w.b[0]}" cy="${w.b[1]}" r="7"/>`).join('');
  const q=qWrap('hzBomb',`<div class="bx"><img alt="" src="${U(c.img||'cg_hz_bomb')}"><svg viewBox="0 0 1008 1792" preserveAspectRatio="none"><g class="w">${draw()}</g>
   <line class="nd" x1="520" y1="872" x2="520" y2="725"/><circle cx="520" cy="872" r="10" fill="#7a1010"/></svg><b class="tmr"></b><img class="ct" alt="" src="${U('it_cutters')}"></div>
   <div class="qh">${esc(c.hint||'Бомба')}</div><div class="qs">Перекуси провода, что ведут от часов к капсюлям.</div>`);
  const g=q.querySelector('g.w'),nd=q.querySelector('.nd'),tmr=q.querySelector('.tmr'),ct=q.querySelector('.ct'),bx=q.querySelector('.bx');
  const upd=()=>{tmr.textContent='0:'+String(Math.max(0,left)).padStart(2,'0');nd.setAttribute('transform',`rotate(${(1-left/(c.time||45))*360} 520 872)`);tmr.classList.toggle('red',left<=10)};
  const bind=()=>g.querySelectorAll('.hit').forEach(h=>h.onpointerdown=async e=>{if(done)return;e.stopPropagation();const i=+h.dataset.i,w=W_[i];
    const r=bx.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*1008,sy=(e.clientY-r.top)/r.height*1792;let bi=0,bd=1e9;w.pts.forEach((p,k)=>{const d=(p[0]-sx)**2+(p[1]-sy)**2;if(d<bd&&k>2&&k<w.pts.length-3){bd=d;bi=k}});
    w.cutAt=bi;g.innerHTML=draw();bind();snd('sfx_snip');vib(30);ct.style.left=(e.clientX-r.left)+'px';ct.style.top=(e.clientY-r.top)+'px';ct.classList.remove('snap');void ct.offsetWidth;ct.classList.add('snap');
    if(w.live){cut++;if(cut>=3){done=true;clearInterval(T);flag((c.id||'bomb')+'_bomb',2);nd.classList.add('stop');await wait(700);await qEnd(q,true,c,res)}}
    else{left=Math.max(1,left-10);upd();q.classList.add('jolt');setTimeout(()=>q.classList.remove('jolt'),400);snd('hit')}});
  bind();upd();
  const T=setInterval(async()=>{if(done)return;left--;upd();snd('sfx_tick');if(left<=0){done=true;clearInterval(T);flag((c.id||'bomb')+'_bomb',1);q.classList.add('boom');snd('sfx_explosion_far');vib(400);await wait(600);await qEnd(q,false,c,res)}},1000);
  W.__hzSolve=async ok=>{if(done)return;done=true;clearInterval(T);flag((c.id||'bomb')+'_bomb',ok!==false?2:1);await qEnd(q,ok!==false,c,res)}})}


/* ---------- Песня-клип: слайды + строки + «поймать взгляд». c:{song, data:{lines,slides,parts}, looks:[{t,ch,txt,f}]} ---------- */
function songUI(c){return new Promise(async res=>{
  const D=c.data,LN=D.lines,SL=D.slides,LK=c.looks||[];let done=false,t0=0,h=null,si=-1,li=-2,lkOpen=null,caught=0;
  const im=k=>U(k[1])||U(k[2]);
  const q=qWrap('hzSong',`<div class="sl"><img class="a" alt=""><img class="b" alt=""></div><div class="vg"></div>
   <div class="pt"></div><div class="ly"><p class="p0"></p><p class="p1"></p><p class="p2"></p></div>
   <button class="eye" hidden><i></i><span>Поймать взгляд</span></button><div class="lk"></div><button class="skp" hidden>Пропустить ▸▸</button><div class="ttl"><small>♪ Полина у микрофона</small><b>«Тише, милый»</b></div><div class="bar"><i></i></div>`);
  const A_=q.querySelector('.sl .a'),B_=q.querySelector('.sl .b'),P=[...q.querySelectorAll('.ly p')],eye=q.querySelector('.eye'),lk=q.querySelector('.lk'),bar=q.querySelector('.bar i');
  let front=A_;
  const slide=i=>{const nb=front===A_?B_:A_;nb.src=im(SL[i]);nb.className=(front===A_?'b':'a')+' on k'+(i%3);front.classList.remove('on');front=nb};
  try{music(null,{fade:1.2})}catch(e){}
  await wait(900);
  const ctx=(typeof ac==='function')?ac():null;
  try{h=await shotSnd(c.song||'hz_song_singer',{vol:.95})}catch(e){h=null}
  const clock=h&&ctx?(()=>ctx.currentTime-t0):(()=>(performance.now()-t0)/1000);t0=h&&ctx?ctx.currentTime:performance.now();
  const dur=c.dur||210;
  const finish=async()=>{if(done)return;done=true;try{h&&h.stop()}catch(e){}flag((c.id||'song')+'_looks',caught);q.classList.remove('on');await wait(500);q.remove();res()};
  setTimeout(()=>{q.querySelector('.skp').hidden=false},25000);
  q.querySelector('.skp').onclick=e=>{e.stopPropagation();finish()};
  eye.onclick=async e=>{e.stopPropagation();if(!lkOpen)return;const o=lkOpen;lkOpen=null;eye.hidden=true;caught++;if(o.f)flag(o.f);
    lk.innerHTML=(o.ch?`<span style="background-image:url('${PT(o.ch)}')"></span>`:'')+`<b>${esc(o.txt)}</b>`;lk.classList.add('on');setTimeout(()=>lk.classList.remove('on'),4200)};
  const tick=()=>{if(done)return;const t=clock();bar.style.width=Math.min(100,t/dur*100)+'%';
    let s=0;while(s+1<SL.length&&SL[s+1][0]<=t)s++;if(s!==si){si=s;slide(s)}
    let l=-1;while(l+1<LN.length&&LN[l+1][0]<=t)l++;
    if(l!==li){li=l;const g=k=>k>=0&&k<LN.length?LN[k][1]:'';P[0].textContent=g(l-1);P[1].textContent=g(l);P[2].textContent=g(l+1);
      const ly=q.querySelector('.ly');ly.classList.remove('mv');void ly.offsetWidth;ly.classList.add('mv');
      let pp='';(D.parts||[]).forEach(p=>{if(p[0]<=t)pp=p[1]});q.querySelector('.pt').textContent=pp}
    for(const o of LK){if(!o.shown&&t>=o.t&&t<o.t+4){o.shown=1;if(o.when&&!o.when(ST))continue;lkOpen=o;eye.hidden=false;eye.classList.remove('pulse');void eye.offsetWidth;eye.classList.add('pulse');
      setTimeout(()=>{if(lkOpen===o){lkOpen=null;eye.hidden=true}},3600)}}
    q.classList.toggle('intro',t<12);if(t>=dur)return finish();requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
  W.__hzSolve=()=>finish()})}
