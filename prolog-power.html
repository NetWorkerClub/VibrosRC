<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цепь питания</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--bg:#050507;--ink:#d9c2ff;--glow:#a855f7}
@media (prefers-color-scheme:dark){:root{--bg:#050507}}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Consolas,Menlo,"Courier New",monospace;color:var(--ink)}
.game{position:relative;height:min(100dvh,calc(100vw*16/9));aspect-ratio:9/16;background:#08070c center/cover;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.hud{position:absolute;left:10%;right:10%;top:6%;display:flex;justify-content:space-between;font-size:calc(var(--u)*3.4);letter-spacing:.04em;text-shadow:0 0 8px var(--glow);z-index:2}
.area{position:absolute;left:8%;right:8%;top:14%;bottom:13%;display:flex;align-items:center;justify-content:center;z-index:1}
.board{display:grid;box-shadow:0 0 calc(var(--u)*5) rgba(168,85,247,.25)}
.cell{width:var(--c);height:var(--c);position:relative;cursor:pointer}
.cell.fixed{cursor:default}
.cell.empty{background:#0b0a10;box-shadow:inset 0 0 0 1px #17151f;cursor:default}
.rot{position:absolute;inset:0;transition:transform .2s ease-out}
.rot img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.rot img.on{opacity:0;transition:opacity .35s}
.cell.lit img.on{opacity:1}
.btn{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);z-index:2;font:inherit;font-size:calc(var(--u)*3.4);color:var(--ink);background:rgba(20,10,35,.85);border:1px solid #6d33b8;padding:.45em 1.4em;cursor:pointer;box-shadow:0 0 12px rgba(168,85,247,.35)}
.btn:hover,.btn:focus-visible{border-color:#c18bff;outline:none}
.win{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);background:rgba(8,2,18,.78);opacity:0;pointer-events:none;transition:opacity .5s;text-align:center;font-size:calc(var(--u)*5)}
.tip{position:absolute;left:8%;right:8%;bottom:11%;text-align:center;font-size:calc(var(--u)*3);opacity:.75;z-index:2;line-height:1.3}
.win.show{opacity:1;pointer-events:auto}
.win small{font-size:calc(var(--u)*3.4);opacity:.8}
.win .btn{position:static;transform:none}
@media (prefers-reduced-motion:reduce){.rot,.rot img.on,.win{transition:none}}
</style></head>
<body>
<div class="game" id="G">
  <div class="hud"><span id="mv">Ходы: 0</span><span id="pc">Контуры: 0/3</span></div>
  <div class="area" id="A"><div class="board" id="B"></div></div>
  <div class="tip" id="tip">Поворачивай узлы. Проведи ток от щита ко всем трём контурам портала</div><button class="btn" id="nb">Перемешать</button>
  <div class="win" id="W"><div>Питание восстановлено</div><small id="ws"></small><small>Портал снова гудит. Свет возвращается.</small><button class="btn" id="go">В лабораторию</button></div>
</div>

const R=5,C=3,N=R*C,D=[[-1,0],[0,1],[1,0],[0,-1]];
const BASE={s:10,c:12,t:14,p:8,e:2};
const PIC={s:['str_clear','str_lit'],c:['cor_clear','cor_lit'],t:['tee_clear','tee_lit'],p:['pc_off','pc_on'],e:['term']};
const $=id=>document.getElementById(id),G=$('G'),B=$('B'),W=$('W');
G.style.backgroundImage='url('+IMG.bg+')';
const rnd=n=>Math.floor(Math.random()*n);
const rotMask=(m,r)=>{let o=0;for(let d=0;d<4;d++)if(m>>d&1)o|=1<<((d+r)&3);return o};
const bits=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
const nb=(i,d)=>{const r=(i/C|0)+D[d][0],c=i%C+D[d][1];return r<0||r>=R||c<0||c>=C?-1:r*C+c};
const man=(a,b)=>Math.abs((a/C|0)-(b/C|0))+Math.abs(a%C-b%C);

function route(s,goal,bl){
  const dist=Array(N).fill(1e9),prev=Array(N).fill(-1),done=Array(N).fill(false);dist[s]=0;
  for(;;){
    let u=-1;for(let i=0;i<N;i++)if(!done[i]&&dist[i]<1e9&&(u<0||dist[i]<dist[u]))u=i;
    if(u<0)return null;done[u]=true;
    if(u!==s&&goal(u)){const p=[u];while(prev[p[0]]>=0)p.unshift(prev[p[0]]);return p}
    for(let d=0;d<4;d++){const v=nb(u,d);if(v<0||done[v])continue;if(bl[v]&&!goal(v))continue;
      const w=dist[u]+1+Math.random()*2;if(w<dist[v]){dist[v]=w;prev[v]=u}}
  }
}
function gen(){
  for(;;){
    const m=Array(N).fill(0),bl=Array(N).fill(false);
    const add=p=>p.forEach((c,j)=>{bl[c]=true;if(j){const a=p[j-1];for(let d=0;d<4;d++)if(nb(a,d)===c){m[a]|=1<<d;m[c]|=1<<((d+2)&3)}}});
    const T=rnd(N);let A;do{A=rnd(N)}while(man(A,T)<4);
    let p=route(A,i=>i===T,bl);if(!p)continue;add(p);
    const pcs=[A];let ok=true;
    for(let k=0;k<2&&ok;k++){
      const fr=[];for(let i=0;i<N;i++)if(!bl[i])fr.push(i);
      const S=fr[rnd(fr.length)];
      p=route(S,i=>bl[i]&&bits(m[i])===2,bl);
      if(!p)ok=false;else{add(p);pcs.push(S)}
    }
    if(ok)return{m,T,pcs};
  }
}
let cells,rot,deg,moves,won,pcs,T,mk;
function lit(){
  const on=new Set([T]),q=[T];
  while(q.length){const u=q.pop();for(let d=0;d<4;d++)if(mk[u]>>d&1){const v=nb(u,d);
    if(v>=0&&!on.has(v)&&(mk[v]>>((d+2)&3)&1)){on.add(v);q.push(v)}}}
  return on;
}
function update(){
  mk=cells.map((c,i)=>c?rotMask(BASE[c],rot[i]):0);
  const on=lit();
  document.querySelectorAll('.cell').forEach((el,i)=>el.classList.toggle('lit',on.has(i)));
  const n=pcs.filter(i=>on.has(i)).length;
  $('pc').textContent='Контуры: '+n+'/3';$('mv').textContent='Ходы: '+moves;
  return n;
}
function start(){
  const g=gen();T=g.T;pcs=g.pcs;won=false;moves=0;W.classList.remove('show');
  cells=g.m.map((m,i)=>{const b=bits(m);return !b?['c','c','c','s','t'][rnd(5)]:b===1?(i===T?'e':'p'):b===3?'t':(m===5||m===10)?'s':'c'});
  rot=cells.map(()=>rnd(4));
  deg=rot.map(r=>r*90);
  B.innerHTML='';
  cells.forEach((c,i)=>{
    const el=document.createElement('div');el.className='cell';el.dataset.i=i;
    if(c){const r=document.createElement('div');r.className='rot';r.style.transform='rotate('+deg[i]+'deg)';
      PIC[c].forEach((k,j)=>{const im=document.createElement('img');im.src=IMG[k];im.alt='';if(j)im.className='on';r.appendChild(im)});
      el.appendChild(r)}
    B.appendChild(el)});
  fit();
  const free=cells.map((c,i)=>i);
  do{free.forEach(i=>{rot[i]=rnd(4);deg[i]=rot[i]*90;B.children[i].firstChild.style.transform='rotate('+deg[i]+'deg)'})}while(update()===3);
}
B.addEventListener('click',e=>{
  const el=e.target.closest('.cell');if(!el||won)return;
  const i=+el.dataset.i;
  rot[i]=(rot[i]+1)&3;deg[i]+=90;el.firstChild.style.transform='rotate('+deg[i]+'deg)';moves++;
  if(update()===3){won=true;$('ws').textContent='Ходов: '+moves;setTimeout(()=>W.classList.add('show'),700)}
});
function fit(){
  G.style.setProperty('--u',G.clientWidth/100+'px');
  const a=$('A'),c=Math.floor(Math.min(a.clientWidth/C,a.clientHeight/R));
  B.style.setProperty('--c',c+'px');B.style.gridTemplateColumns='repeat('+C+',var(--c))';B.style.gridTemplateRows='repeat('+R+',var(--c))';
}
addEventListener('resize',fit);
$('nb').onclick=start;$('go').onclick=()=>{try{parent.postMessage('sboi:power-ok','*')}catch(e){}};
start();
</script></body></html>
