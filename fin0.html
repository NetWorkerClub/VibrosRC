<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#efe8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05030a}
#wrap{position:relative;height:100%;width:min(100vw,56.25vh);max-width:100vw;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 26px);background:linear-gradient(180deg,rgba(6,2,12,.55),rgba(6,2,12,.86) 30%,rgba(6,2,12,.97));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:5;text-align:center;overflow-y:auto}
#ov.menu{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
#ov h1{font:900 40px/1.02 system-ui;letter-spacing:.05em;margin:0 0 6px;text-shadow:0 0 26px #8a3cffaa}
#ov h2{font:900 26px/1.1 system-ui;margin:0 0 6px}
#ov .sub{font:700 11px system-ui;letter-spacing:.28em;color:#c9a6ff;text-transform:uppercase;margin-bottom:10px}
#ov p{margin:0 0 12px;color:#e2d8f2;font-size:14px;line-height:1.45;max-width:380px}
#ov ul{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;text-align:left;font-size:13.5px;color:#e6dcf5;max-width:370px}
#ov li{display:flex;gap:10px;align-items:baseline}#ov li b{width:20px;flex:none;color:#b98cff;text-align:center;font-size:15px}
.btn{pointer-events:auto;border:0;border-radius:26px;padding:14px 34px;font:800 15px system-ui;letter-spacing:.08em;background:linear-gradient(180deg,#a66bff,#6a24d6);color:#fff;box-shadow:0 6px 24px #8a3cff66;margin:4px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.07);color:#eee;box-shadow:none;border:1px solid rgba(200,170,255,.3);padding:11px 24px;font-size:13.5px}
.btn.gold{background:linear-gradient(180deg,#ffd27a,#c98a2a);color:#241400;box-shadow:0 6px 24px #ffb44a44}
.glist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;margin:6px 0 10px}
.gbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border-radius:14px;border:1px solid rgba(170,120,255,.28);background:rgba(20,8,36,.72);color:#efe8ff;font:700 15px system-ui;cursor:pointer}
.gbtn i{font-style:normal;width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#8a3cff33;border:1px solid #8a3cff99;font-size:13px}
.gbtn small{display:block;font:500 11.5px system-ui;color:#bfa9de;margin-top:2px}
.gbtn .st{margin-left:auto;font-size:11px;color:#9fe0b0}.gbtn .st.soft{color:#ffb27a}
details{width:100%;max-width:380px;text-align:left;background:rgba(15,6,28,.75);border:1px solid rgba(170,120,255,.2);border-radius:14px;padding:8px 12px;margin-top:4px}
summary{font:700 13px system-ui;color:#cdb6f2;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:700 11.5px system-ui;padding:6px 9px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#ddd;cursor:pointer}
.chip.full{border-color:#7fe0a0;color:#c8ffd8;background:#1d4a2a66}.chip.partial{border-color:#ffc070;color:#ffe0b0;background:#5a3a1066}.chip.fail{border-color:#ff6a7a;color:#ffc0c8;background:#5a102066}
.chip.on{border-color:#b98cff;color:#fff;background:#5a24a866}
.note{font-size:11px;color:#a998c4;margin:2px 0 6px}
.res{width:100%;max-width:380px;background:rgba(0,0,0,.4);border:1px solid rgba(170,120,255,.25);border-radius:14px;padding:12px 14px;margin:8px 0 12px;text-align:left;font-size:13.5px;line-height:1.45}
.res b{color:#e0c8ff}.res code{color:#ffb27a;font-size:12px}
#xbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,4,18,.6);color:#eee;font:700 16px system-ui;display:none;z-index:4;cursor:pointer}

  else if(n==='clickNear'){const d=Math.min(4,arguments[1]||4),f=1900-(4-d)*260;tone(t,.03,f,.08,'square');if(d<=2)tone(t,.09+(.06*(2-d)),f*.18,.05+(.03*(2-d)),'sine')}

      g.save();g.beginPath();g.arc(0,0,R.r1+ex,0,TAU);g.arc(0,0,R.r0+ex,0,TAU,true);g.fillStyle=R.decoy?'rgba(60,16,80,.88)':i%2?'rgba(34,18,54,.93)':'rgba(24,12,40,.93)';g.fill();
      g.strokeStyle=R.pin?'#ffd27a':R.decoy?'rgba(200,100,255,.8)':'rgba(170,120,255,.55)';g.lineWidth=2;g.beginPath();g.arc(0,0,R.r1+ex,0,TAU);g.stroke();
      const nT=Math.round(R.r1/6);for(let k=0;k<nT;k++){const a=k/nT*TAU+ar;g.fillStyle='rgba(120,90,170,.6)';g.save();g.rotate(a);g.fillRect(R.r1+ex-1,-3,5,6);g.restore()}

        let col=R.decoy?`rgba(210,140,255,${.4+.4*Math.random()})`:'rgba(220,210,240,.55)';
        if(hl){g.save();g.globalCompositeOperation='lighter';const g2=g.createRadialGradient(x,y,0,x,y,gs);g2.addColorStop(0,w.c);g2.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.55+.25*Math.sin(clock*4);g.fillStyle=g2;g.beginPath();g.arc(x,y,gs,0,TAU);g.fill();g.restore();col=w.c}
        glyph(id,x,y,gs*.95,col,3.2);
        if(hl&&o==='full'&&!s.done){g.save();g.font='700 9px system-ui';g.fillStyle=w.c;g.textAlign='center';g.translate(x,y);g.rotate(a+Math.PI/2);g.fillText(w.n.toUpperCase(),0,-gs*.6);g.restore()}});

    g.strokeStyle='rgba(255,210,122,.35)';g.lineWidth=1.5;g.setLineDash([3,5]);g.beginPath();g.moveTo(0,-top);g.lineTo(0,-46);g.stroke();g.setLineDash([]);
    g.fillStyle='#1d0b36';g.beginPath();g.arc(0,0,42,0,TAU);g.fill();g.strokeStyle='#b98cff';g.lineWidth=2.5;g.stroke();
    // замочная скважина
    g.fillStyle='#0a0514';g.beginPath();g.arc(0,-6,9,0,TAU);g.fill();g.fillRect(-3.5,0,7,16);
    g.restore();

    if(kb){rr(kb.x,kb.y,kb.w,kb.h,16);g.fillStyle=kp?'#4a2080':'#2a1250';g.fill();g.strokeStyle='#c9a6ff';g.lineWidth=1.8;g.stroke();
      g.fillStyle='#efe8ff';g.font='800 16px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('Повернуть ключ',kb.x+kb.w/2,kb.y+kb.h/2);g.textBaseline='alphabetic'}
    hud('5 · Замок Сердца',0,0,`Попыток: ${s.tries} · колец: ${s.rings.filter(R=>!R.decoy).length}${s.decoy?' + чужое':''}`);
    if(s.msgT>0&&s.msg)tipText(s.msg,kb?kb.y+kb.h+28:c.y+310,'#ffb27a');
    else if(!s.done&&s.t<8)tipText('Слушай щелчки: ниже тон — ближе · глухой удар — встал',kb?kb.y+kb.h+28:c.y+310,'#d9c2ff');
    if(s.decoy){g.font='600 12px system-ui';g.fillStyle='#d9a2ff';g.textAlign='center';g.fillText('Внешнее чужое кольцо — обманка (path_star_soft)',W/2,H-62)}
    const saved=WORLDS.filter(w=>out(w.id)!=='fail').length;g.font='600 12px system-ui';g.fillStyle='#a998c4';g.textAlign='center';g.fillText(`Спасено миров: ${saved}/9 · подсказок на кольцах: ${s.rings.filter(R=>R.t&&out(R.t)!=='fail').length}/4`,W/2,H-40)},
  hint(){const s=this,kb=s.keyBtn||{x:110,y:s.c.y+286,w:320,h:58};return {cx:s.c.x,cy:s.c.y,kx:kb.x+kb.w/2,ky:kb.y+kb.h/2,rings:s.rings.map(R=>({rm:(R.r0+R.r1)/2,a:R.a,step:R.step,need:R.t?angN(s.solveA(R)-R.a):0,decoy:R.decoy,pin:R.pin,click:!!R._click,hinted:!!(R.t&&out(R.t)!=='fail')})),tries:s.tries,done:s.done}}};
/* =====================================================================
   КАРКАС: меню, вступления, результаты, «всё по порядку»
   ===================================================================== */
const GAMES=[G_BEAR,G_STAR,G_BRIDGE,G_GAP,G_LOCK];
let CUR=null,mode='menu',chain=false,results={},curIdx=0,pdown=false;
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{audioInit();if(mode!=='play')return;pdown=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}CUR.down&&CUR.down(toLogical(e))});
cv.addEventListener('pointermove',e=>{if(mode!=='play'||!pdown)return;CUR.move&&CUR.move(toLogical(e))});
cv.addEventListener('pointerup',e=>{if(mode!=='play'||!pdown)return;pdown=false;CUR.up&&CUR.up(toLogical(e))});
cv.addEventListener('pointercancel',e=>{if(mode==='play'&&pdown&&CUR.up)CUR.up(toLogical(e));pdown=false});
addEventListener('keydown',e=>{audioInit();if(mode==='play'&&CUR.key){CUR.key(e.key);if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()}if(e.key==='Escape'&&mode==='play')menu()});
$('xbtn').onclick=()=>menu();
const ov=$('ov');
function showOv(html,cls){ov.className=cls||'';ov.innerHTML=html;ov.style.display='flex';ov.scrollTop=0;$('xbtn').style.display='none'}
function hideOv(){ov.style.display='none';$('xbtn').style.display='block'}
function chipsHtml(){const lbl={full:'спасён',partial:'частично',fail:'провал'};
  const fl=[['key_epicenter','Ключ эпицентра (Уайтчепел)'],['seventh_seen','Седьмой замечен'],['crack_scene','Сцена трещины Звезда↔Гавань'],['role_natasha_sh','Наташа Ш. — навигация'],['role_zubkova','Катя З. — ключ к замку'],['rescue','Ядро Светы / лекарство Римы']];
  return `<details id="dbg"><summary>Отладка: исходы миров и роли</summary><div class="note">Тап по миру меняет исход: спасён → частично → провал. От исходов зависят подсказки, помехи и лоскуты.</div>
  <div class="chips">${WORLDS.map(w=>`<span class="chip ${out(w.id)}" data-w="${w.id}">${w.n}: ${lbl[out(w.id)]}</span>`).join('')}</div>
  <div class="note">Флаги и роли (кто что делает в подводке, пока открытый вопрос):</div>
  <div class="chips">${fl.map(([k,n])=>`<span class="chip ${S.flags[k]?'on':''}" data-f="${k}">${S.flags[k]?'✓ ':''}${n}</span>`).join('')}</div>
  <div class="note">Флаги пути сейчас: ${Object.keys(S.path).filter(k=>S.path[k]).join(', ')||'нет'} <span class="chip" data-clr="1">сбросить</span></div></details>`}
function menu(openDbg){mode='menu';CUR=null;chain=false;staticSet(0);peakToneStop();pdown=false;
  showOv(`<div class="sub">Выброс · финал · черновик</div><h1>ПУТЬ<br>К СЕРДЦУ</h1><p>Пять мини-игр между подводкой и боем. Game over нет: провал стоит цены, но путь продолжается.</p>
  <button class="btn" id="all">Пройти всё по порядку</button>
  <div class="glist">${GAMES.map((G,i)=>{const r=results[G.id];return `<button class="gbtn" data-g="${i}"><i>${i+1}</i><span>${G.n}<small>${G.genre}</small></span>${r?`<span class="st ${r.ok?'':'soft'}">${r.ok?'чисто':'с ценой'}</span>`:''}</button>`}).join('')}</div>
  ${chipsHtml()}`,'menu');
  if(openDbg)$('dbg').open=true;
  $('all').onclick=()=>{chain=true;S.path={};results={};intro(0)};
  ov.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{chain=false;intro(+b.dataset.g)});
  ov.querySelectorAll('[data-w]').forEach(c=>c.onclick=()=>{const id=c.dataset.w,o=S.worlds[id];S.worlds[id]=o==='full'?'partial':o==='partial'?'fail':'full';saveDbg();menu(true)});
  ov.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{const k=c.dataset.f;S.flags[k]=!S.flags[k];saveDbg();menu(true)});
  ov.querySelectorAll('[data-clr]').forEach(c=>c.onclick=()=>{S.path={};results={};menu(true)})}
function intro(i){curIdx=i;const G=GAMES[i];mode='intro';CUR=G;G.init();
  showOv(`<div class="sub">${chain?`Путь к Сердцу · ${i+1} из 5`:`Мини-игра ${i+1}`} · ${G.genre}</div><h1 style="font-size:32px">${G.n.toUpperCase()}</h1><p>${G.intro}</p>
  <ul>${G.rules.map(r=>`<li><b>${r[0]}</b><span>${r[1]}</span></li>`).join('')}</ul>
  <button class="btn" id="go">Начать</button><button class="btn ghost" id="back">В меню</button>`);
  $('go').onclick=()=>start(i);$('back').onclick=()=>menu()}
function start(i){audioInit();const G=GAMES[i];CUR=G;curIdx=i;G.init();floats=[];glitchT=0;mode='play';pdown=false;hideOv();emit('start',{game:G.id})}
function finish(okRes){if(mode!=='play')return;const G=CUR;mode='result';staticSet(0);peakToneStop();pdown=false;
  const res={game:G.id,ok:!!okRes,flag:okRes?null:G.flag};results[G.id]=res;if(!okRes)S.path[G.flag]=true;else delete S.path[G.flag];emit('finish',res);window.__pmLast=res;
  if(okRes){showOv(`<div class="sub">${G.n} · чисто</div><h2>${G.win[0]}</h2><p>${G.win[1]}</p><button class="btn" id="nx">${chain&&curIdx<4?'Дальше: '+GAMES[curIdx+1].n:chain?'Итог пути':'В меню'}</button><button class="btn ghost" id="rt">Ещё раз</button>`)}
  else{showOv(`<div class="sub">${G.n} · не чисто</div><h2>Путь не закрыт</h2><p>Game over нет: отряд идёт дальше, но платит цену.</p>
    <div class="res"><b>Цена:</b> ${G.cost}<br><code>${G.flag}</code></div>
    <button class="btn" id="rt">Попробовать ещё</button><button class="btn gold" id="nx">Идти дальше с ценой</button>`)}
  $('rt').onclick=()=>{if(!okRes)delete S.path[G.flag];start(curIdx)};
  $('nx').onclick=()=>{if(chain){if(curIdx<4)intro(curIdx+1);else summary()}else menu()}}
function summary(){mode='summary';const fl=Object.keys(S.path).filter(k=>S.path[k]);const clean=fl.length===0;if(clean)S.path.path_clean=true;emit('path_done',{flags:fl,path_clean:clean});window.__pmSummary={flags:fl,path_clean:clean};
  showOv(`<div class="sub">Путь к Сердцу · итог</div><h2>${clean?'Чистый путь':'Отряд у Сердца'}</h2><p>${clean?'Все пять испытаний пройдены чисто. Флаг <b>path_clean</b> облегчает фазы боя и открывает путь к Золотой концовке.':'Отряд дошёл, но не без потерь. Эти флаги уйдут в бой и в эпилоги.'}</p>
  <div class="res">${GAMES.map(G=>{const r=results[G.id];return `${G.n}: <b>${r?r.ok?'чисто':'с ценой':'—'}</b>${r&&!r.ok?` <code>${G.flag}</code>`:''}`}).join('<br>')}</div>
  <p style="font-size:12px;color:#a998c4">Дальше три фазы боя: Человек → Пустота в маске → Шестирукий.</p><button class="btn" id="mn">В меню</button>`);$('mn').onclick=()=>menu()}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;clock+=dt;g.setTransform(RES,0,0,RES,0,0);
  try{fxTick(dt);if(mode==='play'&&CUR)CUR.update(dt);
    if(CUR&&(mode==='play'||mode==='result'||mode==='intro')){CUR.draw();drawFloats(dt);drawFxFront()}else{drawBg(.45,1);drawFxFront()}
    drawGlitch(dt)}catch(err){console.error(err)}
  requestAnimationFrame(loop)}
window.__pm={start:id=>{const i=GAMES.findIndex(G=>G.id===id);chain=false;start(i)},intro:id=>intro(GAMES.findIndex(G=>G.id===id)),menu,hint:()=>CUR&&CUR.hint(),get mode(){return mode},get game(){return CUR&&CUR.id},
  toScreen:(x,y)=>{const r=cv.getBoundingClientRect();return {x:r.left+x/W*r.width,y:r.top+y/H*r.height}},S,get results(){return results},playAll:()=>{chain=true;S.path={};results={};intro(0)}};
menu();{const qg=QS.get('game');if(qg){const i=GAMES.findIndex(G=>G.id===qg);if(i>=0)intro(i)}}
requestAnimationFrame(loop);
})();
