<script>
'use strict';
window.__errors=[];
addEventListener('error',e=>window.__errors.push(String(e.message)));
const W=360,H=640,LX=[62,180,298],PY=594,LANEW=116;
const BH=372,BBOT=488,IZH=610,IZBOT=572;
let IVW=140,IZW=340;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),bx=buf.getContext('2d');
const tmp=document.createElement('canvas'),tx=tmp.getContext('2d');
let K=1;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';K=s*dpr;
  for(const c of [cv,buf,tmp]){c.width=Math.round(W*K);c.height=Math.round(H*K);}}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT='system-ui,"Segoe UI",Roboto,"DejaVu Sans",sans-serif';

// ---------- assets ----------
let HERO,heroDark,heroRim,izDark,IV,IZ,BG,ivWhite,ivGold,ivDark,ivPts,izPts;const PUFF={};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image load failed'));i.src=src;});}
function silhouette(img,col){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return c;}
function samplePts(img,dw,dh,step,minA,tint){const c=document.createElement('canvas');c.width=Math.ceil(dw);c.height=Math.ceil(dh);const x=c.getContext('2d');x.drawImage(img,0,0,dw,dh);
  const d=x.getImageData(0,0,c.width,c.height).data,pts=[];
  for(let y=0;y<c.height;y+=step)for(let xx=0;xx<c.width;xx+=step){const i=(y*c.width+xx)*4;if(d[i+3]>minA){
    const r=Math.round(lerp(d[i],tint[0],tint[3])),g=Math.round(lerp(d[i+1],tint[1],tint[3])),b=Math.round(lerp(d[i+2],tint[2],tint[3]));
    pts.push({x:xx,y,col:`rgb(${r},${g},${b})`});}}return pts;}
function mkPuff(a,b){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,64,64);return c;}
PUFF.dark=mkPuff('rgba(4,0,10,0.95)','rgba(18,0,36,0)');
PUFF.vio=mkPuff('rgba(200,130,255,0.95)','rgba(120,40,255,0)');
PUFF.white=mkPuff('rgba(245,245,255,0.8)','rgba(220,220,240,0)');
PUFF.gold=mkPuff('rgba(255,225,150,0.95)','rgba(255,170,60,0)');
PUFF.orange=mkPuff('rgba(255,170,80,0.95)','rgba(255,90,20,0)');
PUFF.red=mkPuff('rgba(255,60,90,0.9)','rgba(255,0,60,0)');
let VIG,VIGR;
function mkVig(){VIG=bx.createRadialGradient(180,330,140,180,330,430);VIG.addColorStop(0,'rgba(8,0,18,0)');VIG.addColorStop(1,'rgba(8,0,18,0.92)');
  VIGR=bx.createRadialGradient(180,330,120,180,330,420);VIGR.addColorStop(0,'rgba(255,20,60,0)');VIGR.addColorStop(1,'rgba(255,20,70,0.85)');}

// ---------- input ----------
const inp={down:false,key:false,x:0,y:0,sx:0,sy:0,swiped:false,downT:0};
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toLocal(e);Object.assign(inp,{down:true,key:false,x:p.x,y:p.y,sx:p.x,sy:p.y,swiped:false,downT:G.t});onTap(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(!inp.down)return;const p=toLocal(e);inp.x=p.x;inp.y=p.y;const dx=p.x-inp.sx,dy=p.y-inp.sy;
  if(!inp.swiped&&Math.abs(dx)>40*(1)&&Math.abs(dx)>Math.abs(dy)){inp.swiped=true;onSwipe(Math.sign(dx));}});
function up(){if(!inp.down)return;inp.down=false;onRelease();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){onSwipe(-1);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){onSwipe(1);e.preventDefault();}
  else if(k===' '||k==='Enter'){e.preventDefault();Object.assign(inp,{down:true,key:true,swiped:false,downT:G.t});onTap(null,null);}
  else if(k==='1'||k==='k'||k==='K'){if(G.stage==='choice')doKill();}
  else if(k==='`'||k==='~'){toggleDbg();}});
addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){if(inp.key)up();}});

// ---------- state ----------
let G={t:0};let CHT=[];
function newGame(){
  CHT=Array.from({length:18},()=>Math.random()*0.9+0.08);
  G={stage:'',st:0,t:G.t||0,will:5,maxWill:5,
    f:{pressure:0,hits:0,dispelled:0,spawned:0,reached:0,choice:null,freeFails:0,handsDodged:0,handsHit:0,braced:0,slams:0,dodges:0,weakHits:0},
    player:{lane:1,x:LX[1],hurt:0,shield:0},shadows:[],parts:[],texts:[],gears:[],fx:[],
    shake:0,glitch:0,flash:0,white:0,vig:0,pressureT:0,prompt:'',promptA:0,
    boss:null,izn:{alpha:0.42,scale:1,shake:0,gone:0},chainA:1,tapT:-9,hands:null,fin:null,choice:null,res:null,endT:0};
  enter('intro');}
function prompt(s){G.prompt=s;}
function floatText(t,x,y,col,size){G.texts.push({t,x,y,col:col||'#fff',life:1.1,max:1.1,size:size||16});}
function addP(o){if(G.parts.length<7000)G.parts.push(o);}
function puff(x,y,n,img,sp,size,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(sp*0.3,sp);addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,drag:0.05,life:rnd(life*0.6,life),max:life,size:rnd(size*0.6,size),img,grow:1.2});}}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(80,260);addP({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:420,drag:0.2,life:rnd(.3,.7),max:.7,size:rnd(1.5,3),col});}}

function makeBoss(){return {hp:100,max:100,phase:'enter',pt:0,atk:0,type:null,side:1,flash:0,flashGold:0,shake:0,lurch:0,lurchT:0,rise:0,riseT:0,lean:0,leanT:0,leanX:0,leanXT:0,
  recoil:0,alpha:0,jitter:0,hitThis:false,volleys:[],opened:false,last:null,teleDur:1,impactDone:false,evalDone:false,heldAtImpact:false};}

function enter(s){G.stage=s;G.st=0;G.endT=0;
  if(s==='intro'){prompt('');}
  if(s==='shadows'){G.shadows=[];G.spawnT=0.5;prompt('Касайся теней — не дай им доползти');}
  if(s==='bossIn'){G.shadows=[];G.boss=makeBoss();G.boss.phase='enter';G.chainA=0;prompt('');G.glitch=0.3;G.shake=6;}
  if(s==='boss'){if(!G.boss)G.boss=makeBoss();const b=G.boss;b.alpha=1;G.chainA=1;b.phase='idle';b.pt=0.2;prompt('');}
  if(s==='choice'){if(!G.boss)G.boss=makeBoss();const b=G.boss;b.alpha=1;G.chainA=1;b.hp=Math.min(b.hp,14);b.phase='kneel';b.pt=0;b.volleys=[];G.gears=[];
    G.choice={hold:0,holding:false};G.player.lane=1;prompt('Цепь почти разорвана. Решай.');}
  if(s==='hands'){G.boss=null;G.gears=[];G.player.lane=1;if(!G.f.choice)G.f.choice='—';G.hands={i:0,phase:'intro',pt:0,lanes:[],n:4};prompt('Стражей нет. Шестирукая бьёт сама');}
  if(s==='final'){G.boss=null;G.hands=null;G.fin={p:0,done:0,emitted:0};prompt('Удерживай палец — разорви её хватку');}
  if(s==='result'){prompt('');G.izn.gone=1;}
}

function hurt(){if(DBG.god){floatText('(бессмертие)',G.player.x,PY-70,'#aaa',11);return;}
  G.will--;G.f.hits++;G.shake=Math.max(G.shake,12);G.glitch=0.35;G.flash=0.7;G.player.hurt=0.5;
  floatText('−воля',G.player.x,PY-74,'#ff7a9a',15);
  if(G.will<=0){G.f.pressure++;G.pressureT=2.4;G.will=3;G.glitch=0.6;}}
function dodged(msg){G.f.dodges++;floatText(msg||'Уклон!',G.player.x,PY-74,'#9fffe0',15);}

// ---------- tap/swipe/release ----------
function onTap(x,y){const s=G.stage;
  if(G.pressureT>0)return;
  if(s==='intro'){if(G.st>0.5)enter('shadows');return;}
  if(s==='shadows'){tapShadow(x,y);return;}
  if(s==='boss'){G.tapT=G.t;const b=G.boss;if(b.phase==='open'){const w=weakPos();if(x===null||Math.hypot(x-w.x,y-w.y)<54)hitWeak();else floatText('мимо',x,y,'#aaa',11);}return;}
  if(s==='choice'){const c=G.choice;if(x!==null&&inRect(x,y,KILLBTN)){doKill();return;}
    if(x===null||inRect(x,y,FREEBTN)||inBoss(x,y)){c.holding=true;c.hold=0;}return;}
  if(s==='result'){if(G.st>0.8&&(x===null||inRect(x,y,AGAINBTN)))newGame();return;}
}
function onSwipe(d){if(G.pressureT>0)return;const p=G.player;const nl=clamp(p.lane+d,0,2);if(nl!==p.lane){p.lane=nl;for(let i=0;i<5;i++)addP({x:p.x,y:PY-20,vx:-d*rnd(40,120),vy:rnd(-40,10),drag:.05,life:.35,max:.35,size:14,img:PUFF.gold,alpha:.35});}}
function onRelease(){if(G.stage==='choice'){const c=G.choice;if(c.holding&&c.hold<1){c.holding=false;const b=G.boss;b.hp=Math.min(b.hp+7,32);G.f.freeFails++;c.hold=0;b.jitter=0;
  floatText('Сорвалось — цепь стянулась',180,250,'#d9a6ff',14);G.shake=7;G.glitch=0.2;b.flash=0.8;}}}
const inRect=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
const KILLBTN={x:18,y:500,w:144,h:46},FREEBTN={x:198,y:500,w:144,h:46},AGAINBTN={x:110,y:498,w:140,h:44};
function inBoss(x,y){return x>180-IVW/2-10&&x<180+IVW/2+10&&y>BBOT-BH&&y<BBOT;}

// ---------- shadows ----------
function spawnShadow(prog){const big=Math.random()<0.15,imp=!big&&Math.random()<0.3;let x,y;const e=Math.random();
  if(e<0.6){x=rnd(20,340);y=-30;}else{x=Math.random()<0.5?-30:390;y=rnd(110,400);}
  G.shadows.push({x,y,r:big?30:imp?22:rnd(17,23),hp:big?2:1,sp:rnd(52,80)+prog*35,ph:Math.random()*9,kind:imp?'imp':'blob',kb:0});G.f.spawned++;}
function tapShadow(x,y){let best=null,bd=1e9;for(const s of G.shadows){const d=x===null?Math.hypot(s.x-G.player.x,s.y-PY):Math.hypot(s.x-x,s.y-y);if((x===null||d<s.r+22)&&d<bd){bd=d;best=s;}}
  if(!best)return;best.hp--;if(best.hp<=0){G.shadows.splice(G.shadows.indexOf(best),1);G.f.dispelled++;puff(best.x,best.y,12,PUFF.dark,90,34,.6);puff(best.x,best.y,6,PUFF.vio,70,18,.4);}
  else{best.kb=0.25;puff(best.x,best.y,5,PUFF.vio,60,16,.3);}}
function updShadows(dt){const tgx=G.player.x,tgy=PY-24;for(let i=G.shadows.length-1;i>=0;i--){const s=G.shadows[i];const dx=tgx-s.x,dy=tgy-s.y,d=Math.hypot(dx,dy);
    let v=s.sp*(0.75+0.35*Math.sin(G.t*5+s.ph));if(s.kb>0){s.kb-=dt;v=-120;}
    s.x+=dx/d*v*dt+Math.sin(G.t*3+s.ph)*14*dt;s.y+=dy/d*v*dt;
    if(Math.random()<dt*6)addP({x:s.x+rnd(-8,8),y:s.y+rnd(0,10),vx:rnd(-10,10),vy:rnd(-30,-10),life:.6,max:.6,size:s.r*1.2,img:PUFF.dark,alpha:.5});
    if(d<26){G.shadows.splice(i,1);G.f.reached++;hurt();puff(s.x,s.y,10,PUFF.dark,80,30,.5);}}}

// ---------- boss ----------
function bossT(){const b=G.boss;const kneel=b.phase==='kneel';const bob=Math.sin(G.t*2.2)*4*(kneel?0.3:1);
  let x=180+b.leanX,y=BBOT+bob-b.rise,sx=1+b.lurch*0.05,sy=1+b.lurch*0.09,rot=b.lean;
  y-=b.recoil*9;sx*=1-b.recoil*0.035;sy*=1-b.recoil*0.035;
  if(b.shake>0){x+=rnd(-1,1)*b.shake;y+=rnd(-1,1)*b.shake*0.5;}
  if(b.jitter>0){x+=rnd(-1,1)*b.jitter*6;y+=rnd(-1,1)*b.jitter*2;rot+=rnd(-1,1)*0.025*b.jitter;}
  return {x,y,sx,sy,rot};}
function bossPt(rx,ry){const T=G.bT;const lx=(rx-0.5)*IVW*T.sx,ly=-(1-ry)*BH*T.sy,c=Math.cos(T.rot),s=Math.sin(T.rot);return {x:T.x+lx*c-ly*s,y:T.y+lx*s+ly*c};}
const weakPos=()=>bossPt(0.655,0.31);
function handPos(side){return side<0?bossPt(0.1,0.62):bossPt(0.93,0.6);}
function coverLanes(side){return side<0?[0,1]:[1,2];}
function startTele(force){const b=G.boss;let type=force;if(!type){type=b.atk<3?['steam','gears','slam'][b.atk]:pick(['steam','gears','slam'].filter(t=>t!==b.last));}
  b.type=type;b.last=type;b.phase='tele';b.pt=0;b.side=Math.random()<0.5?-1:1;b.teleDur={steam:0.95,gears:0.9,slam:1.15}[type];G.player.lane=1;
  if(type==='steam')prompt(b.side<0?'Пар слева!  Свайп  ⟶':'Пар справа!  ⟵  Свайп');
  if(type==='gears')prompt('Шестерни! Свайпай в светлый просвет');
  if(type==='slam')prompt('Молот! Держи палец — или тапни в удар');}
function startAtk(){const b=G.boss;b.phase='atk';b.pt=0;b.hitThis=false;b.volleys=[];b.vi=0;b.impactDone=false;b.evalDone=false;b.heldAtImpact=false;}
function hitWeak(){const b=G.boss;const w=weakPos();const dmg=Math.round(rnd(3,4.5));b.hp=Math.max(10,b.hp-dmg);b.recoil=1;b.flash=1;b.shake=3;G.f.weakHits++;
  sparks(w.x,w.y,10,'#ffcf7a');sparks(w.x,w.y,6,'#c58bff');floatText('−'+dmg,w.x+rnd(-14,14),w.y-18,'#ffe1a0',14);G.shake=Math.max(G.shake,2.5);
  if(b.hp<=15&&b.phase==='open'){b.phase='broken';b.pt=0;prompt('');G.glitch=0.3;G.shake=8;}}
function updBoss(dt){const b=G.boss;b.pt+=dt;const k=Math.min(1,dt*10);
  b.flash=Math.max(0,b.flash-dt*3.5);b.shake=Math.max(0,b.shake-dt*25);b.recoil=Math.max(0,b.recoil-dt*5);
  const ph=b.phase,typ=b.type;
  b.leanT=0;b.leanXT=0;b.lurchT=0;b.riseT=0;
  if(ph==='tele'){const e=ease(b.pt/b.teleDur);
    if(typ==='steam'){b.leanT=-b.side*0.1*e;b.leanXT=-b.side*12*e;b.lurchT=0.3*e;}
    if(typ==='gears'){b.lurchT=0.7*e;b.riseT=6*e;b.leanT=-0.04*e*Math.sin(G.t*30);}
    if(typ==='slam'){b.riseT=30*e;b.lurchT=1.1*e;b.leanT=0;}
    if(b.pt>=b.teleDur)startAtk();}
  else if(ph==='atk'){
    if(typ==='steam'){b.leanT=b.side*0.07;b.leanXT=b.side*10;
      if(b.pt>0.12&&b.pt<0.85){const h=handPos(b.side);const lanes=coverLanes(b.side);const x0=LX[lanes[0]]-LANEW/2,x1=LX[lanes[1]]+LANEW/2;
        for(let i=0;i<3;i++){const tx2=rnd(x0+10,x1-10);addP({x:h.x,y:h.y,vx:(tx2-h.x)*2.2,vy:rnd(420,560),drag:0.3,life:.75,max:.75,size:rnd(26,46),img:PUFF.white,alpha:.55,grow:1.6});}
        if(b.pt>0.22&&!b.hitThis&&lanes.includes(G.player.lane)){b.hitThis=true;hurt();}}
      if(b.pt>1.05){if(!b.hitThis)dodged();toRec();}}
    if(typ==='gears'){b.lurchT=0.4+0.3*Math.sin(b.pt*20);
      if(b.vi<3&&b.pt>=b.vi*0.8){const pl=G.player.lane;const gap=pick([0,1,2].filter(l=>Math.abs(l-pl)===1));const cov=[0,1,2].filter(l=>l!==gap);
        const v={land:b.pt+0.72,cov,gap,done:false};b.volleys.push(v);b.vi++;
        for(const l of cov)for(let j=0;j<2;j++){const h=handPos(j?1:-1);G.gears.push({x0:h.x,y0:h.y,x1:LX[l]+(j?16:-16),y1:PY-10,t:0,dur:0.72,r:rnd(15,19),rot:Math.random()*6,spin:rnd(-12,12)});}
        G.shake=Math.max(G.shake,2);}
      for(const v of b.volleys){if(!v.done&&b.pt>=v.land){v.done=true;if(v.cov.includes(G.player.lane)){hurt();}else dodged();G.shake=Math.max(G.shake,4);
        for(const l of v.cov)sparks(LX[l],PY-10,8,'#e0a850');}}
      if(b.pt>2.55){toRec();}}
    if(typ==='slam'){const IMP=0.95;
      if(b.pt<IMP){b.riseT=30-40*ease(b.pt/IMP);b.lurchT=1.1;}
      else{b.riseT=-10;b.lurchT=-0.2;
        if(!b.impactDone){b.impactDone=true;b.heldAtImpact=inp.down&&(G.t-inp.downT)>0.08;G.shake=16;G.glitch=0.25;G.fx.push({type:'shock',t:0,dur:0.55});b.impactT=G.t;G.f.slams++;}
        if(!b.evalDone&&b.pt>IMP+0.14){b.evalDone=true;const ok=b.heldAtImpact||Math.abs(G.tapT-b.impactT)<0.24;
          if(ok){G.f.braced++;G.player.shield=0.7;floatText(b.heldAtImpact?'Выстояла!':'В точку!',G.player.x,PY-74,'#ffe39a',16);}else hurt();}}
      if(b.pt>1.6)toRec();}}
  else if(ph==='rec'){if(b.pt>0.3)G.player.lane=1;if(b.pt>0.6){b.phase='idle';b.pt=0;b.atk++;b.volleys=[];prompt('');}}
  else if(ph==='idle'){if(b.pt>1.0){if(b.atk>0&&b.atk%3===0&&!b.opened){b.phase='open';b.pt=0;b.opened=true;prompt('Он раскрылся! Часто жми по фонарю-сердцу');}else{b.opened=false;startTele();}}}
  else if(ph==='open'){b.riseT=-14;b.lurchT=-0.35;b.leanT=0.03*Math.sin(G.t*2);if(b.pt>4.2){b.phase='idle';b.pt=0.3;prompt('');}}
  else if(ph==='broken'){b.riseT=-26;b.lurchT=-0.5;b.shake=Math.max(b.shake,2);if(b.pt>0.9)enter('choice');}
  else if(ph==='kneel'){b.riseT=-30;b.lurchT=-0.5;b.leanT=0.04;}
  b.lean+=(b.leanT-b.lean)*k;b.leanX+=(b.leanXT-b.leanX)*k;b.lurch+=(b.lurchT-b.lurch)*k;b.rise+=(b.riseT-b.rise)*k;}
function toRec(){const b=G.boss;b.phase='rec';b.pt=0;}

// ---------- choice / resolve ----------
function doKill(){if(G.stage!=='choice')return;G.f.choice='kill';const b=G.boss;const T=G.bT;
  const ox=T.x-IVW/2,oy=T.y-BH;
  for(const p of ivPts){const d=Math.random()*0.5+(1-p.y/BH)*0.25;addP({x:ox+p.x,y:oy+p.y,vx:rnd(-30,30),vy:rnd(-90,-20),g:-40,drag:0.4,life:rnd(1.4,2.3)+d,max:2.3,size:3,col:p.col,delay:d});}
  b.alpha=0;G.shake=10;G.glitch=0.4;G.res={type:'kill'};enter('resolve');prompt('');floatText('Страж рассыпался',180,200,'#d9a6ff',18);}
function doFree(){G.f.choice='free';G.res={type:'free'};enter('resolve');prompt('');G.white=0.6;
  const pts=chainPts();for(const q of pts){for(let i=0;i<3;i++)addP({x:q.x,y:q.y,vx:rnd(-120,120),vy:rnd(-160,40),g:380,drag:.3,life:rnd(.6,1.2),max:1.2,size:rnd(2,4),col:pick(['#c99bff','#8f5bff','#f0e0ff'])});}
  floatText('Иван свободен',180,200,'#ffe7a8',20);}
function updChoice(dt){const c=G.choice,b=G.boss;
  if(c.holding){if(inp.down){c.hold+=dt/2;b.jitter=0.4+c.hold*1.4;if(Math.random()<dt*20){const w=weakPos();addP({x:w.x+rnd(-40,40),y:w.y+rnd(-60,120),vx:0,vy:-40,life:.5,max:.5,size:10,img:PUFF.gold,alpha:.6});}
      if(c.hold>=1){c.holding=false;b.jitter=0;doFree();}}else{onRelease();}}
  else b.jitter=Math.max(0,b.jitter-dt*3);}

// ---------- chain ----------
function iznT(){const z=G.izn;const br=Math.sin(G.t*1.4);return {x:180+Math.sin(G.t*0.5)*7,y:IZBOT,sx:z.scale*(1+br*0.012),sy:z.scale*(1+br*0.028),rot:0.03*Math.sin(G.t*0.6)};}
function iznPt(rx,ry){const T=iznT();const lx=(rx-0.5)*IZW*T.sx,ly=-(1-ry)*IZH*T.sy,c=Math.cos(T.rot),s=Math.sin(T.rot);return {x:T.x+lx*c-ly*s,y:T.y+lx*s+ly*c};}
function chainPts(){const a=weakPos(),z=iznPt(0.115,0.485);const n=CHT.length;const mx=(a.x+z.x)/2,my=Math.max(a.y,z.y)+70+Math.sin(G.t*1.6)*6;const pts=[];
  for(let i=0;i<=n;i++){const t=i/n;const x=(1-t)*(1-t)*a.x+2*(1-t)*t*mx+t*t*z.x,y=(1-t)*(1-t)*a.y+2*(1-t)*t*my+t*t*z.y;
    const dx=2*(1-t)*(mx-a.x)+2*t*(z.x-mx),dy=2*(1-t)*(my-a.y)+2*t*(z.y-my);pts.push({x,y,ang:Math.atan2(dy,dx)});}return pts;}
function drawChain(c){const b=G.boss;if(!b||G.chainA<=0)return;const integ=clamp((b.hp-10)/90,0,1);const pts=chainPts();const A=G.chainA;
  const vis=Math.floor(pts.length*A);
  c.save();c.lineCap='round';
  c.globalAlpha=0.35+0.25*Math.sin(G.t*4);c.strokeStyle='#9d5cff';c.lineWidth=2;c.beginPath();for(let i=0;i<vis;i++){const p=pts[i];i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y);}c.stroke();
  for(let i=0;i<vis;i++){const p=pts[i],th=CHT[i%CHT.length];const cracked=integ<th,gone=integ<th-0.5;if(gone)continue;
    let jx=0,jy=0,al=1;if(cracked){jx=rnd(-1.5,1.5);jy=rnd(-1.5,1.5);al=0.55+0.45*(Math.random()<0.15?0:1);}
    c.save();c.translate(p.x+jx,p.y+jy);c.rotate(p.ang);c.globalAlpha=al;
    const rw=8,rh=i%2?2.2:4.6;
    c.strokeStyle='rgba(160,80,255,0.35)';c.lineWidth=6;c.beginPath();c.ellipse(0,0,rw,rh,0,0,6.283);c.stroke();
    c.strokeStyle=cracked?'#7b52b8':'#c99bff';c.lineWidth=2.4;c.beginPath();c.ellipse(0,0,rw,rh,0,0,6.283);c.stroke();
    if(cracked){c.strokeStyle='#120620';c.lineWidth=1.4;c.beginPath();c.moveTo(-2,-rh-1);c.lineTo(1,0);c.lineTo(-1,rh+1);c.stroke();
      if(Math.random()<0.04)sparksSmall(p.x,p.y);}
    c.restore();}
  c.restore();}
function sparksSmall(x,y){addP({x,y,vx:rnd(-30,30),vy:rnd(-30,10),g:120,life:.4,max:.4,size:2,col:'#d6b0ff'});}

// ---------- hands / final ----------
const HANDSEQ=[[1],[0,1],[1,2],[0,2]];
function updHands(dt){const h=G.hands;h.pt+=dt;const z=G.izn;
  if(h.phase==='intro'){z.alpha=lerp(0.42,0.62,ease(h.pt/1.4));z.scale=lerp(1,1.1,ease(h.pt/1.4));if(h.pt>1.7){h.phase='tele';h.pt=0;h.lanes=HANDSEQ[h.i];h.dur=1.1-h.i*0.08;prompt(h.lanes.length===2&&h.lanes[0]===0&&h.lanes[1]===2?'Удар с двух сторон! Где безопасно?':'Рука! Уходи свайпом из подсвеченной зоны');}}
  else if(h.phase==='tele'){if(h.pt>=h.dur){h.phase='hit';h.pt=0;G.shake=15;G.glitch=0.3;
      if(h.lanes.includes(G.player.lane)){hurt();G.f.handsHit++;}else{G.f.handsDodged++;dodged();}
      for(const l of h.lanes){G.fx.push({type:'crack',t:0,dur:1.2,x:LX[l],y:PY-30,segs:mkCrack(LX[l],PY-30)});puff(LX[l],PY-20,10,PUFF.dark,140,46,.7);sparks(LX[l],PY-20,8,'#c99bff');}}}

function mkCrack(x,y){const segs=[];for(let i=0;i<7;i++){let a=Math.random()*6.283,px=x,py=y;const pts=[[px,py]];for(let j=0;j<4;j++){a+=rnd(-.6,.6);const l=rnd(10,26);px+=Math.cos(a)*l;py+=Math.sin(a)*l;pts.push([px,py]);}segs.push(pts);}return segs;}

function update(dt){G.t+=dt;
  G.shake=Math.max(0,G.shake-dt*40);G.glitch=Math.max(0,G.glitch-dt);G.flash=Math.max(0,G.flash-dt*2.2);G.white=Math.max(0,G.white-dt*1.4);G.vig=Math.max(0,G.vig-dt*0.8);
  const p=G.player;p.x+=(LX[p.lane]-p.x)*Math.min(1,dt*16);p.hurt=Math.max(0,p.hurt-dt);p.shield=Math.max(0,p.shield-dt);
  if(G.boss)G.bT=bossT();
  updParts(dt);
  for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.life-=dt;t.y-=28*dt;if(t.life<=0)G.texts.splice(i,1);}
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt;if(f.t>f.dur)G.fx.splice(i,1);}
  for(let i=G.gears.length-1;i>=0;i--){const g=G.gears[i];g.t+=dt;g.rot+=g.spin*dt;if(g.t>g.dur+0.25)G.gears.splice(i,1);}
  if(G.pressureT>0){G.pressureT-=dt;return;}
  G.st+=dt;const s=G.stage;
  if(s==='intro'){if(G.st>3.2)enter('shadows');}
  else if(s==='shadows'){const left=15-G.st;
    if(left>0){G.spawnT-=dt;if(G.spawnT<=0){const pr=G.st/15;spawnShadow(pr);G.spawnT=lerp(1.0,0.42,pr)*rnd(0.7,1.3);}}
    else{if(G.shadows.length&&left<-0.1){for(const sh of G.shadows)puff(sh.x,sh.y,8,PUFF.dark,60,30,.5);G.shadows=[];}
      if(!G.endT)G.endT=G.t;prompt('Тени отступают…');if(G.t-G.endT>1.0)enter('bossIn');}
    updShadows(dt);}
  else if(s==='bossIn'){const b=G.boss;b.alpha=ease(G.st/1.2);G.chainA=ease((G.st-0.6)/1.0);b.flash=Math.max(b.flash,1-G.st/1.4);updBoss(dt);if(G.st>2.6)enter('boss');}
  else if(s==='boss'){updBoss(dt);}
  else if(s==='choice'){updBoss(dt);updChoice(dt);}
  else if(s==='resolve'){const b=G.boss;
    if(G.res.type==='free'){G.chainA=0;b.flashGold=Math.min(1,G.st*1.5);b.riseT=0;b.lurchT=0.1;updBoss(dt);b.phase='free';b.rise=lerp(-30,-6,ease(G.st/1.2));
      b.alpha=G.st<1.6?1:1-ease((G.st-1.6)/1.0);if(Math.random()<dt*30){const w=bossPt(rnd(0.2,0.8),rnd(0.1,0.95));addP({x:w.x,y:w.y,vx:rnd(-10,10),vy:rnd(-60,-20),life:1,max:1,size:rnd(12,22),img:PUFF.gold,alpha:.5});}}
    else{G.chainA=Math.max(0,1-G.st*1.2);updBoss(dt);}
    if(G.st>2.9)enter('hands');}
  else if(s==='hands')updHands(dt);
  else if(s==='final')updFinal(dt);
}
function updParts(dt){const P=G.parts;let j=0;for(let i=0;i<P.length;i++){const p=P[i];

  if(G.stage==='shadows'){const k=clamp(1-G.st/15,0,1);c.fillStyle='rgba(20,8,40,0.8)';c.fillRect(200,14,110,6);c.fillStyle='#b98bff';c.fillRect(200,14,110*k,6);txt(c,'волна',180,17,10,'#cbb8ff','right',600);}
  const b=G.boss;if(b&&['bossIn','boss','choice'].includes(G.stage)){const k=b.hp/b.max;txt(c,'ИВАН · страж Изнанки',180,40,11,'#e6d6ff','center',700);
    c.fillStyle='rgba(20,8,40,0.85)';rrect(c,60,50,240,8,4);c.fill();const g=c.createLinearGradient(60,0,300,0);g.addColorStop(0,'#7b3cff');g.addColorStop(1,'#d08bff');c.fillStyle=g;rrect(c,60,50,Math.max(4,240*k),8,4);c.fill();}
  if(G.prompt){c.fillStyle='rgba(8,2,18,0.6)';const w=Math.min(340,G.prompt.length*7.2+30);rrect(c,180-w/2,70,w,26,13);c.fill();txt(c,G.prompt,180,83,13,'#f3e9ff','center',700);}
  if(G.stage==='choice'){const c2=G.choice;
    c.fillStyle='rgba(60,8,30,0.85)';rrect(c,KILLBTN.x,KILLBTN.y,KILLBTN.w,KILLBTN.h,10);c.fill();c.strokeStyle='#ff6a9a';c.lineWidth=1.5;c.stroke();
    txt(c,'Добить',KILLBTN.x+KILLBTN.w/2,KILLBTN.y+17,16,'#ffd0e0');txt(c,'тап',KILLBTN.x+KILLBTN.w/2,KILLBTN.y+35,10,'#ff9ab8','center',500);
    c.fillStyle='rgba(50,36,8,0.85)';rrect(c,FREEBTN.x,FREEBTN.y,FREEBTN.w,FREEBTN.h,10);c.fill();c.strokeStyle='#ffd27a';c.stroke();
    txt(c,'Освободить',FREEBTN.x+FREEBTN.w/2,FREEBTN.y+17,16,'#fff0c8');txt(c,'держи на нём ~2 с',FREEBTN.x+FREEBTN.w/2,FREEBTN.y+35,10,'#ffd27a','center',500);
    if(c2.holding||c2.hold>0){const w=weakPos();c.save();c.strokeStyle='rgba(255,230,160,0.25)';c.lineWidth=7;c.beginPath();c.arc(w.x,w.y,44,0,6.283);c.stroke();
      c.strokeStyle='#ffe39a';c.lineWidth=7;c.lineCap='round';c.beginPath();c.arc(w.x,w.y,44,-1.571,-1.571+6.283*c2.hold);c.stroke();c.restore();txt(c,Math.round(c2.hold*100)+'%',w.x,w.y+62,12,'#ffe39a');}}
  if(G.stage==='final'){const f=G.fin;const x=180,y=360;c.save();c.strokeStyle='rgba(230,200,255,0.25)';c.lineWidth=8;c.beginPath();c.arc(x,y,50,0,6.283);c.stroke();
    c.strokeStyle='#f0dcff';c.lineCap='round';c.beginPath();c.arc(x,y,50,-1.571,-1.571+6.283*f.p);c.stroke();c.restore();txt(c,inp.down?'ДЕРЖИ!':'ДЕРЖИ',x,y-6,16,'#fff');txt(c,Math.round(f.p*100)+'%',x,y+14,12,'#d9c2ff');}
}
function drawIntro(c){const a=G.stage==='intro'?Math.min(1,G.st*2)*(G.st>2.8?1-(G.st-2.8)/0.4:1):0;if(a<=0)return;c.save();c.globalAlpha=a*0.75;c.fillStyle='#05010c';c.fillRect(0,0,W,H);c.globalAlpha=a;
  txt(c,'ФАЗА 3',180,250,16,'#b996ff','center',700);txt(c,'Стражи',180,290,44,'#f4eaff','center',800);
  c.fillStyle='#8f5bff';c.fillRect(110,322,140,2);txt(c,'Цепи Изнанки держат тех,',180,350,14,'#d8c8f0','center',500);txt(c,'кого не успели спасти.',180,370,14,'#d8c8f0','center',500);
  if(G.st>0.6)txt(c,'коснись, чтобы начать',180,430,12,`rgba(220,200,255,${0.5+0.5*Math.sin(G.t*4)})`,'center',500);c.restore();}
function drawResult(c){if(G.stage!=='result')return;const a=Math.min(1,G.st*2);c.save();c.globalAlpha=a*0.8;c.fillStyle='#05010c';c.fillRect(0,0,W,H);c.globalAlpha=a;
  c.fillStyle='rgba(22,10,44,0.95)';rrect(c,22,100,316,460,16);c.fill();c.strokeStyle='#8f5bff';c.lineWidth=1.5;c.stroke();
  const f=G.f;txt(c,'Фаза 3 · итог',180,132,22,'#f4eaff');txt(c,'черновик прототипа',180,154,10,'#9d86c9','center',500);
  const rows=[['Страж (Иван)',f.choice==='free'?'Освобождён':f.choice==='kill'?'Добит':'—',f.choice==='free'?'#ffe39a':'#ff9ab8'],
    ['Срывы освобождения',String(f.freeFails),'#e6d6ff'],['Тени развеяны',`${f.dispelled} из ${f.spawned}`,'#e6d6ff'],['Тени дошли',String(f.reached),'#e6d6ff'],
    ['Молот выдержан',`${f.braced} из ${f.slams}`,'#e6d6ff'],['Уклоны (всего)',String(f.dodges),'#e6d6ff'],['Руки Изнанки: уклон',`${f.handsDodged} из 4`,'#e6d6ff'],
    ['Потеряно воли',String(f.hits),'#e6d6ff'],['«Изнанка давит…»',f.pressure?f.pressure+' раз · флаг':'нет','#c99bff']];
  rows.forEach((r,i)=>{const y=190+i*28;txt(c,r[0],40,y,13,'#bfaee0','left',500);txt(c,r[1],320,y,13,r[2],'right',700);c.fillStyle='rgba(143,91,255,0.15)';c.fillRect(40,y+13,280,1);});
  const flag=f.choice==='free'?'Флаг: Иван — союзник в финале':'Флаг: Иван потерян · путь к «Тьме» +1';txt(c,flag,180,462,12,f.choice==='free'?'#ffe39a':'#d9a6ff','center',700);
  c.fillStyle='rgba(60,36,120,0.9)';rrect(c,AGAINBTN.x,AGAINBTN.y,AGAINBTN.w,AGAINBTN.h,10);c.fill();c.strokeStyle='#b98bff';c.stroke();txt(c,'Заново',180,AGAINBTN.y+22,16,'#fff');c.restore();}
function drawPressure(c){if(G.pressureT<=0)return;const a=Math.min(1,G.pressureT*2,(2.4-G.pressureT)*4);c.save();c.globalAlpha=a*0.7;c.fillStyle='#0a0014';c.fillRect(0,0,W,H);c.globalAlpha=a;c.drawImage(PUFF.vio,-60,200,480,240);
  txt(c,'Изнанка давит…',180+rnd(-1.5,1.5),310,28,'#e9d6ff');txt(c,'воля частично вернулась · отмечено',180,346,11,'#b49be0','center',500);c.restore();}
function drawBossTitle(c){if(G.stage!=='bossIn')return;const a=ease(G.st/0.5)*(1-ease((G.st-2.0)/0.5));c.save();c.globalAlpha=a;txt(c,'СТРАЖ',180,118,13,'#b996ff');txt(c,'Иван',180,146,30,'#f4eaff');txt(c,'Цепь держит его у Сердца',180,174,12,'#d8c8f0','center',500);c.restore();}

function render(){const c=bx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  const sx=G.shake?rnd(-1,1)*G.shake:0,sy=G.shake?rnd(-1,1)*G.shake:0;c.setTransform(K,0,0,K,sx*K,sy*K);
  c.drawImage(BG,-14,-24,388,690);
  c.fillStyle='rgba(6,0,16,0.28)';c.fillRect(-20,-30,W+40,H+60);
  drawIzn(c);
  const vp=0.65+0.12*Math.sin(G.t*1.3)+G.vig*0.35;c.globalAlpha=clamp(vp,0,1);c.fillStyle=VIG;c.fillRect(-20,-30,W+40,H+60);c.globalAlpha=1;
  if(['boss','choice','bossIn','hands'].includes(G.stage)){c.fillStyle='rgba(200,170,255,0.07)';for(let l=0;l<3;l++){c.beginPath();c.moveTo(LX[l]-14,PY+36);c.lineTo(LX[l],PY+28);c.lineTo(LX[l]+14,PY+36);c.fill();}}
  drawAttackFX(c);
  drawBoss(c);drawChain(c);
  for(const s of G.shadows)drawShadow(c,s);
  drawHands(c);
  drawHeroine(c);
  for(const p of G.parts){if(p.delay>0){c.globalAlpha=1;c.fillStyle=p.col;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);continue;}
    const a=clamp(p.life/p.max,0,1);if(p.img){c.globalAlpha=a*(p.alpha==null?1:p.alpha);const s=p.size*(p.grow?1+(1-a)*p.grow:1);c.drawImage(p.img,p.x-s/2,p.y-s/2,s,s);}
    else{c.globalAlpha=a;c.fillStyle=p.col;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}}
  c.globalAlpha=1;
  for(const t of G.texts){c.globalAlpha=clamp(t.life/t.max*1.5,0,1);txt(c,t.t,t.x,t.y,t.size,t.col);}c.globalAlpha=1;
  if(G.flash>0){c.globalAlpha=G.flash;c.fillStyle=VIGR;c.fillRect(-20,-30,W+40,H+60);c.globalAlpha=G.flash*0.18;c.fillStyle='#ff2050';c.fillRect(-20,-30,W+40,H+60);c.globalAlpha=1;}
  c.setTransform(K,0,0,K,0,0);
  drawHUD(c);drawBossTitle(c);drawIntro(c);drawPressure(c);drawResult(c);
  if(G.white>0){c.globalAlpha=G.white;c.fillStyle='#fff';c.fillRect(0,0,W,H);c.globalAlpha=1;}
  if(DBG.on){txt(c,fps+' fps · '+G.stage+(G.boss?' · '+G.boss.phase:''),6,632,10,'#9f9','left',500);}
  // present
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(buf,0,0);
  if(G.glitch>0){const k=Math.min(1,G.glitch/0.35),dx=(3+Math.random()*6)*K*k;
    for(const col of ['#ff0000','#00ffff']){tx.globalCompositeOperation='copy';tx.drawImage(buf,0,0);tx.globalCompositeOperation='multiply';tx.fillStyle=col;tx.fillRect(0,0,tmp.width,tmp.height);
      ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.55*k;ctx.drawImage(tmp,col==='#ff0000'?dx:-dx,0);}
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    for(let i=0;i<5;i++){const y=Math.random()*buf.height,h=(3+Math.random()*16)*K;const o=(Math.random()-.5)*26*K*k;ctx.drawImage(buf,0,y,buf.width,Math.min(h,buf.height-y),o,y,buf.width,Math.min(h,buf.height-y));}}}

// ---------- debug ----------
const DBG={on:false,god:false};
function jump(s){const keepT=G.t;newGame();G.t=keepT;if(s==='boss'||s==='choice'){G.boss=makeBoss();G.boss.alpha=1;}
  if(s==='hands'||s==='final'||s==='result'){G.f.choice=G.f.choice||'free';}
  if(s==='final'||s==='result'){G.izn.alpha=0.6;G.izn.scale=1.1;}
  enter(s);if(G.boss)G.bT=bossT();}
function dbgAttack(t){if(G.stage!=='boss')jump('boss');startTele(t);}
function dbgOpen(){if(G.stage!=='boss')jump('boss');const b=G.boss;b.phase='open';b.pt=0;b.opened=true;prompt('Он раскрылся! Часто жми по фонарю-сердцу');}
const ORDER=['intro','shadows','bossIn','boss','choice','resolve','hands','final','result'];
function skip(){const s=G.stage;if(s==='choice'){doFree();return;}if(s==='resolve'){enter('hands');return;}const i=ORDER.indexOf(s);jump(ORDER[Math.min(ORDER.length-1,i+1)]);}
function toggleDbg(){DBG.on=!DBG.on;document.getElementById('dbg').classList.toggle('on',DBG.on);}
function buildDbg(){const d=document.getElementById('dbg');const items=[['▶ Интро',()=>jump('intro')],['▶ Тени (волна)',()=>jump('shadows')],['▶ Появление стража',()=>jump('bossIn')],['▶ Страж: бой',()=>jump('boss')],
  ['· атака: пар',()=>dbgAttack('steam')],['· атака: шестерни',()=>dbgAttack('gears')],['· атака: молот',()=>dbgAttack('slam')],['· слабое место',()=>dbgOpen()],
  ['▶ Выбор',()=>jump('choice')],['▶ Руки Изнанки',()=>jump('hands')],['▶ Финал (удержание)',()=>jump('final')],['▶ Итог',()=>jump('result')],['⏭ Пропустить этап',skip]];
  for(const [n,f] of items){const b=document.createElement('button');b.textContent=n;b.onclick=e=>{e.stopPropagation();f();};d.appendChild(b);}
  const g=document.createElement('button');g.textContent='Бессмертие: выкл';g.onclick=()=>{DBG.god=!DBG.god;g.textContent='Бессмертие: '+(DBG.god?'вкл':'выкл');};d.appendChild(g);
  document.getElementById('dbgBtn').onclick=toggleDbg;}
window.dbg={jump,dbgAttack,dbgOpen,skip,get G(){return G;},doKill,doFree,toggleDbg};

// ---------- loop ----------
let last=0,fps=60,fAcc=0,fN=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;fAcc+=dt;fN++;if(fAcc>0.5){fps=Math.round(fN/fAcc);fAcc=0;fN=0;}
  try{update(dt);render();}catch(e){window.__errors.push(String(e&&e.stack||e));console.error(e);}
  requestAnimationFrame(frame);}
Promise.all([loadImg(ASSETS.ivan),loadImg(ASSETS.izn),loadImg(ASSETS.bg),loadImg(ASSETS.hero)]).then(([a,b,c,h])=>{IV=a;IZ=b;BG=c;HERO=h;heroDark=document.createElement('canvas');heroDark.width=h.width;heroDark.height=h.height;{const x=heroDark.getContext('2d');x.drawImage(h,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(12,5,24,0.72)';x.fillRect(0,0,h.width,h.height);}heroRim=(()=>{const s=silhouette(h,'#ffd27a');const c=document.createElement('canvas');c.width=h.width+16;c.height=h.height+16;const x=c.getContext('2d');x.filter='blur(3px)';x.drawImage(s,8,8);return c;})();document.body.style.background='#05020a url('+ASSETS.bg+') center/cover';IVW=BH*IV.width/IV.height;IZW=IZH*IZ.width/IZ.height;
  ivWhite=silhouette(IV,'#ffffff');ivGold=silhouette(IV,'#ffcf70');ivDark=silhouette(IV,'#0a0414');izDark=silhouette(IZ,'#040009');
  ivPts=samplePts(IV,IVW,BH,3,120,[150,80,255,0.35]);izPts=samplePts(IZ,IZW,IZH,5,110,[170,100,255,0.3]);
  mkVig();buildDbg();document.getElementById('load').remove();newGame();
  const q=new URLSearchParams(location.search);if(q.get('stage'))jump(q.get('stage'));if(q.get('dbg'))toggleDbg();if(q.get('god'))DBG.god=true;
  window.__ready=true;requestAnimationFrame(frame);}).catch(e=>{window.__errors.push(String(e));document.getElementById('load').textContent='Ошибка загрузки: '+e;});

</script>
