<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07050f">
<title>Уайтчепел</title>
<link rel="stylesheet" href="fonts.css"><style>@font-face{font-family:"Ruslan Display";src:url(morok-ruslan.287f6184.woff) format("woff");font-display:block}</style><style>
:root{--night:#07050f;--ink:#f3eeff;--muted:#b9b0d6;--dim:#7f75a6;--gold:#e8b85a;--violet:#a98bff;--panel:rgba(12,9,22,.86);--line:rgba(232,184,90,.35);
--disp:"Philosopher",Georgia,serif;--text:"PT Serif",Georgia,serif;--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--text);display:flex;justify-content:center;align-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;max-width:calc(100dvh*.5625);overflow:hidden;background:var(--night)}
@media (min-aspect-ratio:9/16){#stage{max-width:calc(100dvh*.5625)}}
.layer{position:absolute;inset:0}
/* backgrounds: two stacked images for crossfade */
#bgA,#bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,filter 1.2s ease}
#bgA.on,#bgB.on{opacity:1}
.ph-bg{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22%;font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);opacity:0;transition:opacity .9s}
.ph-bg.on{opacity:1}
/* panorama */
#pano{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .8s}
#pano::-webkit-scrollbar{display:none}
#pano.on{opacity:1;pointer-events:auto}
#panoIn{position:relative;height:100%}
#panoIn img{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;transition:opacity 2.4s ease}
#panoSun{opacity:0}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;color:var(--ink);font:600 12px var(--ui);cursor:pointer}
.spot.talk{display:flex;flex-direction:column;align-items:center;gap:4px}
.spot.talk i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 25%,rgba(232,184,90,.9) 30%,rgba(232,184,90,0) 70%);box-shadow:0 0 18px 6px rgba(232,184,90,.45);animation:pulse 2.2s ease-in-out infinite}
.spot.talk b{padding:4px 9px;border-radius:99px;background:rgba(10,7,18,.72);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.spot.talk.done{opacity:.45;pointer-events:none}
.spot.talk.done i{animation:none;box-shadow:none;background:rgba(255,255,255,.4)}
.spot.hid{width:64px;height:64px}
.spot.hid.found::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.55)}
@keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 26px 10px rgba(232,184,90,.55)}}
.decor{position:absolute;pointer-events:none}
#candles{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:14px;display:none;gap:10px;z-index:30;padding:8px 10px;border-radius:12px;background:rgba(10,7,18,.6);border:1px solid var(--line)}
#candles.on{display:flex}
.cdl{width:14px;height:38px;position:relative}
.cdl::before{content:"";position:absolute;bottom:0;left:2px;width:10px;height:24px;border-radius:2px;background:linear-gradient(#f4ead2,#c9b98f)}
.cdl::after{content:"";position:absolute;bottom:25px;left:3px;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3b0,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick .18s infinite alternate}
.cdl.out::after{display:none}
.cdl.out::before{background:linear-gradient(#8d8470,#5c5546)}
@keyframes flick{to{transform:scaleY(1.12) translateY(-1px)}}
#panoHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:30;font:600 12.5px var(--ui);color:var(--ink);background:rgba(10,7,18,.7);border:1px solid var(--line);border-radius:99px;padding:7px 14px;white-space:nowrap;display:none}
#panoHint.on{display:block}
/* sprites */
#sprites{pointer-events:none}
.spr{position:absolute;bottom:0;height:76%;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .45s ease,left .5s ease,height .5s ease,filter .5s}
.spr.on{opacity:1}
.spr img{height:100%;width:auto;display:block;filter:drop-shadow(0 0 18px rgba(0,0,0,.55))}
.spr.ph{width:52%;display:flex;align-items:flex-end;justify-content:center}
.spr.ph svg{height:100%;width:auto}
.spr.ph span{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);font:600 11px var(--ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;white-space:nowrap}
.spr.small{height:30%}
.spr.dim img,.spr.dim svg{filter:brightness(.55) saturate(.7)}
/* fx */
#fx{pointer-events:none;z-index:15}
#fog{position:absolute;inset:-20%;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 30% 60%,rgba(200,205,220,.38),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(190,195,215,.3),transparent 50%),radial-gradient(ellipse at 50% 92%,rgba(215,215,230,.45),transparent 60%);animation:fogmove 18s ease-in-out infinite alternate;filter:blur(8px)}
#fog.on{opacity:1}
@keyframes fogmove{to{transform:translate(6%,-3%) scale(1.08)}}
#veil{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
#flash{position:absolute;inset:0;opacity:0;background:#b89bff;mix-blend-mode:screen}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55))}
.sepia #bgA,.sepia #bgB{filter:sepia(.9) contrast(1.1) brightness(.85)}
#memo{position:absolute;left:0;right:0;top:38%;text-align:center;font:italic 20px var(--text);color:#f5e6c4;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .25s;padding:0 30px}
#memo.on{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
/* title card */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.4s;text-align:center;padding:0 24px}
#title.on{opacity:1}
#title h1{margin:0;font:400 54px var(--disp);letter-spacing:.06em;color:#efe4ff;text-shadow:0 0 28px rgba(169,139,255,.7),0 2px 4px #000}
#title p{margin:0;font:400 18px var(--text);color:#e6dcc4;text-shadow:0 2px 8px #000}
/* dialogue */
#ui{z-index:20}
#box{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);min-height:142px;padding:16px 18px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
#box.on{display:block}
#box.port{padding-left:104px}
#name{position:absolute;top:-15px;left:16px;padding:5px 14px;border-radius:99px;background:#1a1330;border:1px solid var(--line);font:400 15px var(--disp);letter-spacing:.04em;color:var(--gold);display:none}
#box.port #name{left:104px}
#name.on{display:block}
#txt{font:400 18px/1.45 var(--text);color:var(--ink);min-height:52px}
#txt.th{font-style:italic;color:#d8cdf5}
#txt.act{font-style:italic;color:var(--muted);font-size:16.5px}
#txt.scr{font-style:italic;color:#cfc6e8;font-size:16.5px}
#portrait{position:absolute;left:12px;bottom:14px;width:82px;height:82px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);display:none;box-shadow:0 0 0 4px rgba(232,184,90,.12)}
#portrait.on{display:block}
#portrait img{width:100%;height:100%;object-fit:cover}
#more{position:absolute;right:16px;bottom:10px;width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);opacity:0;animation:bob 1s ease-in-out infinite}
#more.on{opacity:.9}
@keyframes bob{50%{transform:translate(0,4px) rotate(45deg)}}
/* choices */
#choices{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:10px;z-index:25}
#choices.on{display:flex}
#choices .cq{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:2px;text-shadow:0 1px 6px #000}
.ch{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(16,11,30,.92);color:var(--ink);font:400 16.5px/1.35 var(--text);cursor:pointer;transition:transform .15s,background .15s;animation:chin .35s both}
.ch:active{transform:scale(.98);background:rgba(40,28,70,.95)}
.ch:disabled{opacity:.4}
.ch small{display:block;margin-top:4px;font:500 11.5px var(--ui);color:var(--dim)}
@keyframes chin{from{opacity:0;transform:translateY(10px)}}
/* toast */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-10px);z-index:45;padding:9px 16px;border-radius:99px;background:rgba(18,12,34,.92);border:1px solid var(--gold);color:#f7e7c0;font:600 13.5px var(--ui);opacity:0;transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:14px;height:14px}
/* top bar */
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:35;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,7,18,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px}
#chap:empty{visibility:hidden}
#chap{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(10,7,18,.5);padding:6px 12px;border-radius:99px}
/* modal / menus */
.modal{position:absolute;inset:0;z-index:60;background:rgba(5,3,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.modal.on{display:flex}
.modal h2{margin:0 0 8px;font:400 30px var(--disp);color:#efe4ff;letter-spacing:.05em}
.btn{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(20,14,38,.95);color:var(--ink);font:600 15px var(--ui);cursor:pointer;text-align:center}
.btn.gold{background:linear-gradient(#f1c977,#c99437);color:#1c1206;border-color:#f1c977}
.btn small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px}
.btn.gold small{color:#4a3511}
#log{position:absolute;inset:0;z-index:61;background:rgba(5,3,10,.94);display:none;flex-direction:column}
#log.on{display:flex}
#logList{flex:1;overflow:auto;padding:70px 20px 30px;font:400 16px/1.45 var(--text)}
#logList p{margin:0 0 12px}
#logList b{font:400 13px var(--disp);color:var(--gold);display:block;letter-spacing:.04em}
#logList .th{font-style:italic;color:#d8cdf5}
#logList .act{font-style:italic;color:var(--muted)}
/* QTE */
#qte{position:absolute;inset:0;z-index:50;display:none;touch-action:none}
#qte.on{display:block}
#qte .qhint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);text-align:center;font:700 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px #000}
#qte .qsub{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 94px);text-align:center;font:400 16px var(--text);color:#e7dcff;text-shadow:0 2px 10px #000;padding:0 30px}
#qte .qtime{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top) + 50px);height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#qte .qtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a3a,#ffd27a);transform-origin:left}
#lantern{position:absolute;left:50%;bottom:16%;width:150px;height:150px;transform:translateX(-50%);display:grid;place-items:center}
#lantern svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
#lantern .glow{position:absolute;left:50%;top:55%;width:600px;height:600px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,170,60,.18) 35%,transparent 62%);pointer-events:none;transition:opacity .1s}
#lantern .lamp{width:70px;position:relative}
#lantern.held .lamp{transform:scale(.96)}
#mara{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);height:46%;transition:height .2s linear,opacity .3s;opacity:.9;filter:blur(1.2px)}
#mara svg{height:100%;width:auto;display:block}
#swipe{white-space:nowrap;position:absolute;left:50%;top:40%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;font:700 13px var(--ui);letter-spacing:.14em;color:#fff;text-transform:uppercase;text-shadow:0 2px 10px #000}
#swipe.on{display:flex}
#swipe svg{width:44px;height:90px;animation:sw 0.9s ease-in-out infinite}
@keyframes sw{0%{transform:translateY(-14px);opacity:0}40%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.qbars{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 150px);display:flex;flex-direction:column;gap:14px}
.qbar{font:600 13px var(--ui);color:#fff;text-shadow:0 1px 6px #000}
.qbar div{margin-top:6px;height:12px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3a,#ffe08a);border-radius:12px}
.qbar.ok i{background:linear-gradient(90deg,#8fe08a,#d8ffb0)}
#tapBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:2px solid #ffd27a;background:radial-gradient(circle,rgba(255,150,60,.55),rgba(120,40,10,.6));color:#fff;font:800 13px var(--ui);letter-spacing:.1em;display:grid;place-items:center;box-shadow:0 0 30px rgba(255,140,50,.6)}
#tapBtn.hit{transform:translateX(-50%) scale(.92)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px #ff8a3a;pointer-events:none;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.qres{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 34px var(--disp);letter-spacing:.06em;color:#fff;text-shadow:0 0 20px rgba(255,200,120,.8);opacity:0;transition:opacity .4s;white-space:nowrap}
.qres.on{opacity:1}
.qres.bad{color:#d9c8ff;text-shadow:0 0 20px rgba(150,110,255,.8)}
/* tarot */
#tarot{position:absolute;inset:0;z-index:48;display:none}
#tarot.on{display:block}
#tarot .tt{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font:400 22px var(--disp);color:#f2e6c9;text-shadow:0 2px 10px #000;letter-spacing:.04em}
#tarot .ts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 98px);text-align:center;font:600 12px var(--ui);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#fan{position:absolute;left:0;right:0;bottom:12%;height:44%}
.card{position:absolute;bottom:0;left:50%;width:27%;aspect-ratio:.58;margin-left:-13.5%;transform-origin:50% 140%;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;cursor:pointer;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.card .f{transform:rotateY(180deg)}
.card svg{width:100%;height:100%;display:block}
.card.pick{z-index:5}
#reading{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:none;font:400 16px/1.4 var(--text)}
#reading.on{display:block}
#reading b{font:400 17px var(--disp);color:var(--gold);letter-spacing:.04em}
#reading p{margin:6px 0 0}
#reading .k{color:#d8cdf5;font-style:italic}
#reading .lb{font:600 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-top:8px}
#alfPeek{position:absolute;right:-6%;bottom:30%;width:36%;transform:rotate(-8deg);transition:transform .4s;cursor:pointer;display:none;z-index:6}
#alfPeek.on{display:block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:rotate(-14deg) translateX(-8px)}}
/* end screen */
#end{position:absolute;inset:0;z-index:58;background:radial-gradient(ellipse at 50% 20%,#1d1338,#07050f 70%);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 48px) 22px 30px;overflow:auto}
#end.on{display:flex}
#end h2{margin:0;font:400 34px var(--disp);color:#efe4ff;letter-spacing:.05em;text-align:center}
#end .sub{font:400 16px var(--text);color:var(--muted);margin:6px 0 20px;text-align:center}
.tl{width:100%;max-width:360px;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin:0 0 14px;font:400 15.5px/1.35 var(--text)}
.tl div::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(232,184,90,.6)}
.tl small{display:block;font:500 11.5px var(--ui);color:var(--dim);letter-spacing:.04em}
.stat{width:100%;max-width:360px;display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font:600 14px var(--ui)}
.stat span{color:var(--muted);font-weight:500}
/* demo menu */
#home{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:linear-gradient(rgba(7,5,15,.35),rgba(7,5,15,.85)),var(--homebg) center/cover}
#home h1{margin:0;font:400 58px var(--disp);color:#efe4ff;letter-spacing:.06em;text-shadow:0 0 30px rgba(169,139,255,.7)}
#home .tag{font:400 17px var(--text);color:#e6dcc4;margin:-4px 0 14px;text-shadow:0 2px 8px #000}
#home .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
#home .grid .btn{padding:11px 8px;font-size:13px}
#home .lbl{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#home .note{font:500 11.5px var(--ui);color:var(--dim);text-align:center;max-width:300px;margin-top:8px;line-height:1.45}

/* world + camera */
#world{position:absolute;top:0;bottom:0;left:0;width:100%;will-change:transform}
#world #bgA,#world #bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#world #sprites{position:absolute;inset:0}
.spr .fig{position:relative;height:100%;width:100%;display:block;transition:filter .9s}
.spr .fig img{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 14px rgba(0,0,0,.45))}
.spr .tint{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:soft-light;opacity:.55;transition:background .9s}
.spr.flip .fig{transform:scaleX(-1)}
.spr::after{content:"";position:absolute;left:50%;bottom:-2%;width:70%;height:5%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);z-index:-1}
/* panorama: people instead of dots */
.spot.talk.who{transform:translate(-50%,-100%);display:block}
.spot.talk.who img,.spot.talk.who svg{height:100%;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,214,140,.55)) brightness(.92)}
.spot.talk.who b{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-size:11px}
.spot.talk.who:active img{transform:scale(.97)}
/* QTE: carry the fire */
.qdark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 10%,#000 75%);opacity:0;pointer-events:none}
.qwind{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.08) 60px 64px);}
.qwind.on{opacity:1;animation:wind .35s linear infinite}

/* ===== v1.0.27 ===== */

.spr .fig img,.warm .spr .fig img{filter:none!important}
/* fern flowers in «Вспышка» */
/* run through the fog */
.run{position:absolute;inset:0;overflow:hidden;background:#0a0c10}
.runbg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;opacity:0;transition:opacity .5s}
.runbg.on{opacity:1}.runbg.zoom{animation:runzoom 1.5s linear forwards}

.rkosh{position:absolute;bottom:4%;height:30%;opacity:0;filter:brightness(.55) blur(3px);transform:translateX(-50%) scaleX(var(--fx,1)) scale(.6);pointer-events:none}
.rkosh.sl{left:24%}.rkosh.sr{left:76%}.rkosh.sc{left:50%}

.rkosh.past{transition:all .45s ease-in;opacity:0;transform:translateX(-50%) scaleX(var(--fx,1)) scale(1.4)}
.rkosh.sl.past{left:-10%}.rkosh.sr.past{left:110%}.rkosh.sc.past{bottom:-30%}

@keyframes jerk{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--jx,0),var(--jy,0)) rotate(.6deg)}75%{transform:translate(calc(var(--jx,0)*-.5),calc(var(--jy,0)*-.5)) rotate(-.6deg)}}

/* fern flowers: stay where they appear; a hit flares and fades in place, a miss smoulders out */
#qte .qspark.fern{width:24vw;max-width:140px;height:auto;margin:0;border-radius:0;background:none!important;box-shadow:none!important;transform:translate(-50%,-50%)!important;transition:none!important;
 animation:fernIn .3s ease-out both;filter:drop-shadow(0 0 16px rgba(255,140,40,.85));will-change:opacity,filter}

@keyframes fernIn{from{opacity:0}to{opacity:1}}
@keyframes fernHit{0%{opacity:1}40%{opacity:1;filter:drop-shadow(0 0 40px rgba(255,230,140,1)) brightness(1.8)}100%{opacity:0;filter:drop-shadow(0 0 50px rgba(255,230,140,0)) brightness(2)}}

/* ===== «Уайтчепел»: стоп-кадр, газета, Чертоги ===== */
/* газета */
.wcPaper{position:absolute;inset:0;z-index:45;background:rgba(5,3,10,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
.wcPaper.on{opacity:1}
.wcPaper .sheet{position:relative;width:84%;transform:rotate(-2.5deg) scale(.9);transition:transform .6s cubic-bezier(.2,.8,.3,1.2);filter:drop-shadow(0 10px 26px rgba(0,0,0,.7))}
.wcPaper.on .sheet{transform:rotate(-2.5deg) scale(1)}
.wcPaper img{width:100%;display:block}
.wcPaper .tap{margin-top:18px;color:#cfc6b4;font:500 12px Manrope,sans-serif;letter-spacing:.08em;opacity:.7}

@keyframes wcWarm{0%{opacity:0}30%{opacity:1}55%{opacity:.5}75%{opacity:.9}100%{opacity:0}}
/* разрез */
.wcCut{position:absolute;inset:0;z-index:45;background:#e9dcc0;touch-action:none}

.wcCut .ink{fill:none;stroke:#8b0000;stroke-width:4px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.wcCut .wcHint{color:#2a1a10;text-shadow:none;top:5%}
.wcCut.miss .guide{stroke:#d33;opacity:1}
.wcCut.ok{box-shadow:inset 0 0 0 6px #3d8b4f}.wcCut.bad{box-shadow:inset 0 0 0 6px #a33}
.wcTime{position:absolute;left:10%;right:10%;top:10%;height:4px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden}
.wcTime i{display:block;height:100%;background:#7a1f1f;transform-origin:left}
/* планёрка */
.wcBoard{position:absolute;inset:0;z-index:45;background:#2a1d14 radial-gradient(ellipse at 50% 30%,#4a3524,#1b120b);padding:9% 5% 18%;overflow:auto;opacity:0;transition:opacity .4s;color:#f4ecd8}

.wcBoard .wcCard:nth-child(even){transform:rotate(1.2deg)}

.wcBoard b{font:700 14px "PT Serif",serif}

/* Чертоги */
.wcMind{position:absolute;inset:0;z-index:46;background:#efe4cb;color:#1f160f;display:flex;flex-direction:column;transform:translateY(4%);opacity:0;transition:.35s}

.wcMind .body{flex:1;overflow:auto;padding:4px 16px 24px}
.wcMind .empty,.wcMind .note{font:500 13px Manrope,sans-serif;opacity:.7}
.wcMap .mapS{overflow:hidden;border:1px solid #8a7556;overscroll-behavior:none}.wcMap .mapS::-webkit-scrollbar{display:none}

.wcMind .thr p{margin:0 0 8px;font:600 21px/1.05 Caveat,cursive}.wcMind .thr .ink{color:#1f160f}.wcMind .thr .red{color:#b3121b}

/* --- стоп-кадр v2 --- */

.wcScan{position:absolute;inset:0;z-index:40;animation:wcIn .45s both}

  {const w=W(),mid=w/2,d=w*.38;oa.style.transform=`translate(${mid-d-14}px,0)`;ob.style.transform=`translate(${mid+d-14}px,0)`}})}

/* ---------- QTE «Вспышка»: поймать огонёк в зарослях три раза ---------- */

      o.onpointerdown=e=>{e.stopPropagation();end(true)};

  function fin(){if(done)return;done=true;const r=$('qres');

    setTimeout(()=>{q.classList.remove('on');q.innerHTML='';MODE='';if(hits>=N)toast('+1 алмаз',1800);res(hits)},1500)}

/* ---------- QTE «Сквозь туман» (бег): кощеи выскакивают из тумана, свайп прочь ---------- */
function qteRun(cfg){return new Promise(res=>{
  hideBox();MODE='qte';ST.qteAll++;
  const q=$('qte'),N=cfg.n||6,frames=(cfg.frames||['fog_run1','fog_run2','fog_run3']).map(k=>A.bg[k]).filter(Boolean),kos=(cfg.kos?cfg.kos.map(k=>({u:k.u||((A.sp[k.sp]||{})[k.e||'neutral']),f:k.f||'c'})):[1,2,3,4,5].map(i=>({u:UI('kosh'+i),f:({1:'r',2:'l',3:'c',4:'c',5:'l'})[i]}))).filter(k=>k.u);
  q.innerHTML=`<div class="run"><img class="runbg" id="rbA" alt=""><img class="runbg" id="rbB" alt=""><img class="rkosh" id="rK" alt=""></div>
   <div class="qtime"><i></i></div><div class="qhint">${cfg.hint||'Сквозь туман'}</div><div class="qsub">${cfg.sub||'Свайп прочь от кощея'}</div>
   <div class="qhearts" id="qh"></div><div class="qarr" id="qarr"></div><div class="qres" id="qres"></div>`;
  q.classList.add('on');
  const bA=$('rbA'),bB=$('rbB'),K=$('rK'),arr=$('qarr'),tb=q.querySelector('.qtime i'),dots=$('qh');
  let front=bA,shown=-1,prog=0;const swapBg=()=>{if(!frames.length)return;const k=Math.min(frames.length-1,Math.floor(prog*frames.length));const sc=1+prog*.35;
    if(k!==shown){shown=k;const back=front===bA?bB:bA;back.src=frames[k];back.style.transform='scale('+sc+')';back.classList.add('on');front.classList.remove('on');front=back}
    front.style.transition='transform 1.4s linear,opacity .5s';front.style.transform='scale('+(sc+.06)+')'};
  swapBg();const bgT=setInterval(swapBg,1400);q.classList.add('running');
  let i=0,miss=0,done=false,dir='',t0=0,raf=0,locked=true,x0=null,y0=null;const out=[];
  const paint=()=>{dots.innerHTML=Array.from({length:N},(_,k)=>k<out.length?(out[k]?'<b class="ok">●</b>':'<b class="bad">●</b>'):'<b>○</b>').join('')};paint();
  const ARR={l:'←',r:'→',d:'↓'};
  function next(){if(done)return;if(i>=N)return finish(true);
    const side=['l','r','c'][Math.floor(Math.random()*3)];dir=side==='l'?'r':side==='r'?'l':'d';
    if(kos.length){/* side figures face the middle; a frontal one comes straight at her */const want=side==='l'?'r':side==='r'?'l':'c';let pool=kos.filter(k=>k.f===want);let flip=false;
      if(!pool.length||(side!=='c'&&Math.random()<.4)){const other=kos.filter(k=>k.f===(want==='r'?'l':want==='l'?'r':'c'));if(side!=='c'&&other.length){pool=other;flip=true}}
      const k=pool[Math.floor(Math.random()*pool.length)]||kos[0];K.src=k.u;K.style.setProperty('--fx',flip?-1:1)}
    K.className='rkosh s'+side;void K.offsetWidth;K.classList.add('in');sfx('whoosh');
    arr.textContent=ARR[dir];arr.className='qarr on';t0=performance.now();locked=false;
    const TW=Math.max(900,(cfg.window||1500)-i*60);
    (function tick(now){if(done||locked)return;const k=1-(now-t0)/TW;tb.style.transform='scaleX('+Math.max(0,k)+')';if(k<=0){judge('');return}raf=requestAnimationFrame(tick)})(t0)}
  function judge(d){if(locked)return;locked=true;cancelAnimationFrame(raf);const ok=d===dir;out.push(ok);paint();arr.className='qarr '+(ok?'good':'miss');
    if(ok){sfx('tick');K.classList.add('past');setTimeout(()=>{i++;prog=i/N;swapBg();next()},520);return}

  let lx=0,ly=0;const sw=(X,Y)=>{if(x0==null||locked||done)return;const dx=X-x0,dy=Y-y0;if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;x0=null;judge(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))};

  q.onpointermove=e=>{if(x0==null)return;lx=e.clientX;ly=e.clientY;sw(lx,ly)};
  q.onpointerup=e=>{sw(e.clientX,e.clientY);x0=null};
  q.onpointercancel=()=>{sw(lx,ly);x0=null};

/* стоп-кадр: spots = [{id,x,y,label,deduce?,hidden?,mute?,flag?}], pair = [[a,b,'d_id','Вывод']] ; fb — подписи мыслями */
const scan=(o)=>WC('scan',o,[
  glitch(250),sfx('tick'),
  ...o.spots.filter(s=>!s.hidden).map(s=>th('«'+s.label+'».','determined')),
  ...(o.pair||[]).map(p=>th(p[3]+'.','determined'))
].concat((o.pair||[]).flatMap(p=>deduce(p[2],p[3]))).concat(o.spots.filter(s=>s.flag&&!s.hidden).map(s=>find(s.flag,s.label))));
const paper=(img,head,sub,date)=>WC('paper',{img,head,sub,date},[mus('wc_deduce',{fade:1}),scr('Газеты кричат: «'+head+'»'+(sub?' '+sub:''))]);

    <div class="legend">${MPRED?'<p class="tip">Отметь, где он ударит в следующий раз.</p>':'<p class="tip">Нажми на две точки, чтобы соединить их нитью. Ещё раз — чтобы убрать.</p>'}${vs.filter(v=>v<5).map(v=>`<p><b>${v}</b> ${VERT[v][0]}${rs.includes(v)?' · <i>знак-стрелка</i>':''}</p>`).join('')||'<p>Пока ни одной точки.</p>'}${m.map.pred?`<p class="predL">Предсказание: <b>${esc(PLACES[m.map.pred][0])}</b></p>`:''}</div></div>`}
  if(tab==='cases'){const vs=m.map.v||[];return vs.map(v=>`<div class="case"><b>${VERT[v][0]}</b><small>${VERT[v][1]}</small>${CASE[v]?'<p>'+CASE[v]+'</p>':''}</div>`).join('')+
    `<div class="case"><b>Найдено</b><ul>${(m.finds||[]).map(f=>`<li>${itemImg(f[0])}${esc(f[1])}</li>`).join('')||'<li>ничего</li>'}</ul></div>`}
  if(tab==='suspects'){const ks=Object.keys(m.facts||{}).filter(k=>k!=='hale'||m.hale_sus);return (ks.map(k=>`<div class="sus"><div class="ph" style="background-image:url('${spr(k)}')"></div><div><b>${esc(NAMES[k]||k)}</b>${(m.secrets||[]).includes(k)?'<span class="sec">Тайна раскрыта</span>':''}<ul>${m.facts[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`).join('')||'<p class="empty">Пока никого.</p>')+(m.hale_card&&!m.hale_sus?'<button class="addS">+ подозреваемый</button>':'')}
  if(tab==='threads'){const cb=(ST.clueInfo||{});const t=id=>(cb[id]||{}).t||id;
    return `<div class="thr">${(m.deduce||[]).map(id=>`<p class="ink">${esc(t(id))}</p>`).join('')}${(m.theory||[]).map(id=>`<p class="red">${esc(t(id))}</p>`).join('')}</div>`+((m.deduce||[]).length+(m.theory||[]).length?'<div class="note">Чёрные чернила — выводы. Красные — теории.</div>':'<p class="empty">Нитей пока нет.</p>')}
  if(tab==='allies'){const a=(m.allies||{}).hale||[];if((m.allies||{}).hale_flip)return `<div class="sus ally flip"><div class="ph" style="background-image:url('${spr('hale')}')"></div><div><b><s>Хейл — хороший полицейский</s></b><ul>${a.map(x=>`<li><s>${esc(x)}</s></li>`).join('')}</ul><p class="red">Все убийства ночью. Знает маршруты. Ему доверяли. Сам выбрал мне комнату.</p></div></div>`;return a.length?`<div class="sus ally"><div class="ph" style="background-image:url('${spr('hale')}')"></div><div><b>Хейл — хороший полицейский</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:'<p class="empty">Пока пусто.</p>'}
  if(tab==='scraps'){return (m.scraps||[]).length?(m.scraps||[]).map(s=>`<div class="scrap">${esc(s)}</div>`).join(''):'<p class="empty">Здесь будут записки, которых не может быть в 1888 году.</p>'}
  if(tab==='profile'){const pr=m.profile||[];return `<ol class="prof">${TRAITS.map((t,i)=>`<li class="${pr.includes(i+1)?'on':''}">${pr.includes(i+1)?esc(t):'· · ·'}</li>`).join('')}</ol>`}
  return ''}
function mindUI(c){return new Promise(res=>{
  hideBox();const S=stage();let tab=c.tab||'map';MSEL=null;MPRED=c.need==='pred';const O=el('div','wcMind');
  const draw=()=>{O.innerHTML=`<div class="top"><b>Чертоги</b><button class="x" aria-label="Закрыть">×</button></div>${c.hint?`<div class="wcTip">${esc(c.hint)}</div>`:''}<div class="tabs">${TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}</div><div class="body">${mindHTML(tab)}</div>`;
    O.querySelector('.x').onclick=close;O.querySelectorAll('[data-node]').forEach(bn=>bn.onclick=()=>{const n=bn.dataset.node,mm=M(ST);mm.map.links=mm.map.links||[];if(MSEL===null||MSEL===n){MSEL=MSEL===n?null:n}else{const k=[MSEL,n].sort().join('-');const i=mm.map.links.indexOf(k);if(i>=0)mm.map.links.splice(i,1);else mm.map.links.push(k);MSEL=null;sfx('tick')}draw()});
    O.querySelectorAll('[data-pred]').forEach(bn=>bn.onclick=()=>{M(ST).map.pred=bn.dataset.pred;sfx('tick');draw()});
    O.querySelectorAll('[data-mt]').forEach(bn=>bn.onclick=()=>{if(bn.dataset.mt==='pred')MPRED=!MPRED;else{M(ST).map.links=[];MSEL=null}draw()});
    if(c.need==='pred'){const x=O.querySelector('.x');const ok=!!M(ST).map.pred;x.disabled=!ok;x.style.opacity=ok?1:.3}const ad=O.querySelector('.addS');if(ad)ad.onclick=()=>{const mm=M(ST);mm.hale_sus=true;(mm.facts.hale=mm.facts.hale||[]);['всегда первый на месте','держит фонарь, пока я ищу'].forEach(x=>{if(!mm.facts.hale.includes(x))mm.facts.hale.push(x)});draw()};O.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;c.hint='';draw()})};
  const close=()=>{O.classList.remove('on');setTimeout(()=>{O.remove();res()},300)};
  draw();S.appendChild(O);requestAnimationFrame(()=>O.classList.add('on'));ST.flags.mind_open=1})}

/* ================= мини-игры «Уайтчепела» (прототипы) ================= */
const qWrap=(cls,html)=>{hideBox();const q=el('div','wcQ '+cls,html);stage().appendChild(q);requestAnimationFrame(()=>q.classList.add('on'));return q};
const qEnd=async(q,ok,c,res)=>{ST.qteAll++;if(ok)ST.qteOk++;q.classList.add(ok?'ok':'bad');sfx(ok?'ok':'hit');vib(ok?40:140);await wait(1100);q.classList.remove('on');await wait(300);q.remove();await run(ok?(c.ok||[]):(c.fail||[]));res()};

/* «Замок»: шпилька. Метка ходит по дуге, жми, когда она в золотой зоне. 3 штифта, 2 ошибки допустимо */
function lockUI(c){return new Promise(res=>{
  const N=c.n||3;let pin=0,err=0,done=false,a=0,dir=1,zone=0;
  const q=qWrap('wcLock',`<div class="qh">Замок</div><div class="qs">Жми, когда шпилька в золотой зоне</div><svg viewBox="-60 -60 120 120"><circle r="44" class="rim"/><path class="zone"/><line class="pick" x1="0" y1="0" x2="0" y2="-44"/><circle r="6" class="hub"/></svg><div class="pins">${'<i></i>'.repeat(N)}</div><div class="tap">нажми в любом месте</div>`);
  const z=q.querySelector('.zone'),pk=q.querySelector('.pick'),pins=q.querySelectorAll('.pins i');
  const arc=(a0,a1)=>{const p=t=>[Math.sin(t*Math.PI/180)*44,-Math.cos(t*Math.PI/180)*44];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0} ${y0} A44 44 0 0 1 ${x1} ${y1}`};
  const newZone=()=>{zone=-70+Math.random()*140;const w=26-pin*5;z.setAttribute('d',arc(zone-w/2,zone+w/2));z.dataset.w=w};newZone();
  let sp=1.6;const tick=()=>{if(done)return;a+=dir*sp;if(a>80||a<-80)dir*=-1;pk.setAttribute('transform',`rotate(${a})`);requestAnimationFrame(tick)};tick();
  q.onpointerdown=async()=>{if(done)return;const w=+z.dataset.w;if(Math.abs(a-zone)<=w/2+2){pins[pin].className='ok';pin++;sfx('tick');vib(25);sp+=.7;if(pin>=N){done=true;return qEnd(q,true,c,res)}newZone()}
    else{err++;q.classList.add('miss');setTimeout(()=>q.classList.remove('miss'),250);vib(80);if(err>(c.allow!=null?c.allow:2)){done=true;return qEnd(q,false,c,res)}}};
})}

/* «Тень»: держи палец — Катя крадётся. Луч фонаря ходит туда-сюда; когда он рядом — отпусти, иначе заметят */
function shadowUI(c){return new Promise(res=>{
  let prog=0,down=false,done=false,seen=0,bx=0,bdir=1;const need=c.time||9;
  const q=qWrap('wcShadow',`<div class="qh">Тень</div><div class="qs">Держи палец — идёшь. Луч близко — отпусти</div><div class="beam"></div><div class="kat"></div><div class="trk"><i></i></div><div class="eye"></div>`);
  const beam=q.querySelector('.beam'),bar=q.querySelector('.trk i'),eye=q.querySelector('.eye');let last=performance.now();
  const loop=t=>{if(done)return;const dt=(t-last)/1000;last=t;bx+=bdir*dt*(0.55+Math.random()*.3);if(bx>1||bx<0){bdir*=-1;bx=Math.max(0,Math.min(1,bx))}
    beam.style.left=(10+bx*80)+'%';const near=bx>.62;q.classList.toggle('near',near);
    if(down){prog+=dt/need;if(near){seen+=dt;eye.style.opacity=Math.min(1,seen/0.9)}}else{seen=Math.max(0,seen-dt*.6);eye.style.opacity=seen/0.9}
    bar.style.transform='scaleX('+Math.min(1,prog)+')';
    if(seen>=0.9){done=true;return qEnd(q,false,c,res)}if(prog>=1){done=true;return qEnd(q,true,c,res)}requestAnimationFrame(loop)};requestAnimationFrame(loop);
  q.onpointerdown=()=>{down=true;q.classList.add('go')};q.onpointerup=q.onpointercancel=()=>{down=false;q.classList.remove('go')};
})}

/* «Дактилоскопия»: сравни узор. Кровавый отпечаток сверху, карточки снизу; можно ответить «нет совпадения» */
const PRINT=(type,seed)=>{let r=seed;const rnd=()=>(r=(r*9301+49297)%233280)/233280;let d='';
  for(let i=0;i<13;i++){const k=i*3.1+2;
    if(type==='arch')d+=`<path d="M${-k*1.3} ${12-i*0.4} Q0 ${-k*1.1-4} ${k*1.3} ${12-i*0.4}"/>`;
    else if(type==='loop')d+=`<path d="M${-k} 26 L${-k} ${4-k*.4} Q${-k} ${-k-6} ${k*.4} ${-k-6+i*.2} Q${k} ${-k-4} ${k*.9} ${2}"/>`;
    else d+=`<ellipse rx="${k*0.95}" ry="${k*1.18}" transform="rotate(${(rnd()-.5)*20})"/>`}
  const dots=[...Array(3)].map(()=>`<circle cx="${(rnd()-.5)*30}" cy="${(rnd()-.5)*36}" r="1.3"/>`).join('');
  return `<svg viewBox="-30 -36 60 72"><g class="ridge"${seed%2?' transform="scale(-1,1)"':''}>${d}</g><g class="mark">${dots}</g></svg>`};
function printsUI(c){return new Promise(res=>{
  const cand=c.cand||[{n:'Доктор Толбот',t:'loop',s:4},{n:'Вышибала',t:'whorl',s:7},{n:'Бармен',t:'arch',s:11}];const tgt=c.target||{t:'loop',s:5};const ans=c.answer==null?-1:c.answer;
  const q=qWrap('wcPrints',`<div class="qh">Дактилоскопия</div><div class="qs">Узор на воротнике. Чей?</div><div class="tg partial">${PRINT(tgt.t,tgt.s)}<b>воротник жертвы</b></div>
   <div class="cards">${cand.map((x,i)=>`<button data-i="${i}">${PRINT(x.t,x.s)}<b>${esc(x.n)}</b></button>`).join('')}</div><button class="none" data-i="-1">Нет совпадения</button>`);
  q.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.add('pick');qEnd(q,i===ans,c,res)});
})}

/* «Запомни надпись»: 3 с на чтение, потом собрать слова по порядку */
function recallUI(c){return new Promise(async res=>{
  const words=c.words||['Евреи','не','те','люди','что','будут','обвинены'];const decoy=c.decoy||['напрасно','никогда','Хейл'];
  const q=qWrap('wcRecall',`<div class="qh">Запомни надпись</div><div class="wall"><span>${words.join(' ')}</span></div><div class="qs">У тебя три секунды</div>`);
  await wait(c.time||3000);const wall=q.querySelector('.wall');wall.classList.add('wiped');await wait(700);
  const pool=[...words,...decoy].sort(()=>Math.random()-.5);let k=0,err=0,done=false;
  q.querySelector('.qs').textContent='Собери по порядку';
  const box=el('div','got','');q.appendChild(box);const pl=el('div','pool',pool.map(w=>`<button>${esc(w)}</button>`).join(''));q.appendChild(pl);
  pl.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(done||b.disabled)return;if(b.textContent===words[k]){b.disabled=true;box.insertAdjacentHTML('beforeend','<span>'+esc(words[k])+'</span>');k++;sfx('tick');if(k>=words.length){done=true;qEnd(q,err<=1,c,res)}}
    else{err++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),300);vib(60)}});
})}

/* «Пентаграмма»: поставь пятую вершину на карте */
