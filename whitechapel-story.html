<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07050f">
<title>Уайтчепел</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{background:#05030a;color-scheme:dark}</style><style>@font-face{font-family:"Ruslan Display";src:url(morok-ruslan.287f6184.woff) format("woff");font-display:block}#flowOv{position:fixed;inset:0;z-index:200;background:#0a0718;display:flex;flex-direction:column}#flowOv iframe{flex:1;border:0;width:100%}#flowOv .btn{margin:10px auto calc(env(safe-area-inset-bottom) + 12px);flex:none}
</style><style>
:root{--night:#07050f;--ink:#f3eeff;--muted:#b9b0d6;--dim:#7f75a6;--gold:#e8b85a;--violet:#a98bff;--panel:rgba(12,9,22,.86);--line:rgba(232,184,90,.35);
--disp:"Philosopher",Georgia,serif;--text:"PT Serif",Georgia,serif;--ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--text);display:flex;justify-content:center;align-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;max-width:calc(100dvh*.5625);overflow:hidden;background:var(--night)}
@media (min-aspect-ratio:9/16){#stage{max-width:calc(100dvh*.5625)}}
.layer{position:absolute;inset:0}
/* backgrounds: two stacked images for crossfade */
#bgA,#bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,filter 1.2s ease}
#bgA.on,#bgB.on{opacity:1}
.ph-bg{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22%;font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);opacity:0;transition:opacity .9s}
.ph-bg.on{opacity:1}
/* panorama */
#pano{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .8s}
#pano::-webkit-scrollbar{display:none}
#pano.on{opacity:1;pointer-events:auto}
#panoIn{position:relative;height:100%}
#panoIn img{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;transition:opacity 2.4s ease}
#panoSun{opacity:0}
.spot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;color:var(--ink);font:600 12px var(--ui);cursor:pointer}
.spot.talk{display:flex;flex-direction:column;align-items:center;gap:4px}
.spot.talk i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 25%,rgba(232,184,90,.9) 30%,rgba(232,184,90,0) 70%);box-shadow:0 0 18px 6px rgba(232,184,90,.45);animation:pulse 2.2s ease-in-out infinite}
.spot.talk b{padding:4px 9px;border-radius:99px;background:rgba(10,7,18,.72);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.spot.talk.done{opacity:.45;pointer-events:none}
.spot.talk.done i{animation:none;box-shadow:none;background:rgba(255,255,255,.4)}
.spot.hid{width:64px;height:64px}
.spot.hid.found::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,.55)}
@keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 26px 10px rgba(232,184,90,.55)}}
.decor{position:absolute;pointer-events:none}
#candles{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:14px;display:none;gap:10px;z-index:30;padding:8px 10px;border-radius:12px;background:rgba(10,7,18,.6);border:1px solid var(--line)}
#candles.on{display:flex}
.cdl{width:14px;height:38px;position:relative}
.cdl::before{content:"";position:absolute;bottom:0;left:2px;width:10px;height:24px;border-radius:2px;background:linear-gradient(#f4ead2,#c9b98f)}
.cdl::after{content:"";position:absolute;bottom:25px;left:3px;width:8px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3b0,#ffb43a 55%,rgba(255,120,0,0) 72%);animation:flick .18s infinite alternate}
.cdl.out::after{display:none}
.cdl.out::before{background:linear-gradient(#8d8470,#5c5546)}
@keyframes flick{to{transform:scaleY(1.12) translateY(-1px)}}
#panoHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:30;font:600 12.5px var(--ui);color:var(--ink);background:rgba(10,7,18,.7);border:1px solid var(--line);border-radius:99px;padding:7px 14px;white-space:nowrap;display:none}
#panoHint.on{display:block}
/* sprites */
#sprites{pointer-events:none}
.spr{position:absolute;bottom:0;height:76%;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .45s ease,left .5s ease,height .5s ease,filter .5s}
.spr.on{opacity:1}
.spr img{height:100%;width:auto;display:block;filter:drop-shadow(0 0 18px rgba(0,0,0,.55))}
.spr.ph{width:52%;display:flex;align-items:flex-end;justify-content:center}
.spr.ph svg{height:100%;width:auto}
.spr.ph span{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);font:600 11px var(--ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;white-space:nowrap}
.spr.small{height:30%}
.spr.dim img,.spr.dim svg{filter:brightness(.55) saturate(.7)}
/* fx */
#fx{pointer-events:none;z-index:15}
#fog{position:absolute;inset:-20%;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 30% 60%,rgba(200,205,220,.38),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(190,195,215,.3),transparent 50%),radial-gradient(ellipse at 50% 92%,rgba(215,215,230,.45),transparent 60%);animation:fogmove 18s ease-in-out infinite alternate;filter:blur(8px)}
#fog.on{opacity:1}
@keyframes fogmove{to{transform:translate(6%,-3%) scale(1.08)}}
#veil{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s}
#flash{position:absolute;inset:0;opacity:0;background:#b89bff;mix-blend-mode:screen}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55))}
.sepia #bgA,.sepia #bgB{filter:sepia(.9) contrast(1.1) brightness(.85)}
#memo{position:absolute;left:0;right:0;top:38%;text-align:center;font:italic 20px var(--text);color:#f5e6c4;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .25s;padding:0 30px}
#memo.on{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
/* title card */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.4s;text-align:center;padding:0 24px}
#title.on{opacity:1}
#title h1{margin:0;font:400 54px var(--disp);letter-spacing:.06em;color:#efe4ff;text-shadow:0 0 28px rgba(169,139,255,.7),0 2px 4px #000}
#title p{margin:0;font:400 18px var(--text);color:#e6dcc4;text-shadow:0 2px 8px #000}
/* dialogue */
#ui{z-index:20}
#box{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);min-height:142px;padding:16px 18px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
#box.on{display:block}
#box.port{padding-left:104px}
#name{position:absolute;top:-15px;left:16px;padding:5px 14px;border-radius:99px;background:#1a1330;border:1px solid var(--line);font:400 15px var(--disp);letter-spacing:.04em;color:var(--gold);display:none}
#box.port #name{left:104px}
#name.on{display:block}
#txt{font:400 18px/1.45 var(--text);color:var(--ink);min-height:52px}
#txt.th{font-style:italic;color:#d8cdf5}
#txt.act{font-style:italic;color:var(--muted);font-size:16.5px}
#txt.scr{font-style:italic;color:#cfc6e8;font-size:16.5px}
#portrait{position:absolute;left:12px;bottom:14px;width:82px;height:82px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);display:none;box-shadow:0 0 0 4px rgba(232,184,90,.12)}
#portrait.on{display:block}
#portrait img{width:100%;height:100%;object-fit:cover}
#more{position:absolute;right:16px;bottom:10px;width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);opacity:0;animation:bob 1s ease-in-out infinite}
#more.on{opacity:.9}
@keyframes bob{50%{transform:translate(0,4px) rotate(45deg)}}
/* choices */
#choices{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:10px;z-index:25}
#choices.on{display:flex}
#choices .cq{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:2px;text-shadow:0 1px 6px #000}
.ch{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(16,11,30,.92);color:var(--ink);font:400 16.5px/1.35 var(--text);cursor:pointer;transition:transform .15s,background .15s;animation:chin .35s both}
.ch:active{transform:scale(.98);background:rgba(40,28,70,.95)}
.ch:disabled{opacity:.4}
.ch small{display:block;margin-top:4px;font:500 11.5px var(--ui);color:var(--dim)}
@keyframes chin{from{opacity:0;transform:translateY(10px)}}
/* toast */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-10px);z-index:45;padding:9px 16px;border-radius:99px;background:rgba(18,12,34,.92);border:1px solid var(--gold);color:#f7e7c0;font:600 13.5px var(--ui);opacity:0;transition:opacity .35s,transform .35s;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:14px;height:14px}
/* top bar */
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:35;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,7,18,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px}
#chap:empty{visibility:hidden}
#chap{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(10,7,18,.5);padding:6px 12px;border-radius:99px}
/* modal / menus */
.modal{position:absolute;inset:0;z-index:60;background:rgba(5,3,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.modal.on{display:flex}
.modal h2{margin:0 0 8px;font:400 30px var(--disp);color:#efe4ff;letter-spacing:.05em}
.btn{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(20,14,38,.95);color:var(--ink);font:600 15px var(--ui);cursor:pointer;text-align:center}
.btn.gold{background:linear-gradient(#f1c977,#c99437);color:#1c1206;border-color:#f1c977}
.btn small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px}
.btn.gold small{color:#4a3511}
#log{position:absolute;inset:0;z-index:61;background:rgba(5,3,10,.94);display:none;flex-direction:column}
#log.on{display:flex}
#logList{flex:1;overflow:auto;padding:70px 20px 30px;font:400 16px/1.45 var(--text)}
#logList p{margin:0 0 12px}
#logList b{font:400 13px var(--disp);color:var(--gold);display:block;letter-spacing:.04em}
#logList .th{font-style:italic;color:#d8cdf5}
#logList .act{font-style:italic;color:var(--muted)}
/* QTE */
#qte{position:absolute;inset:0;z-index:50;display:none;touch-action:none}
#qte.on{display:block}
#qte .qhint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);text-align:center;font:700 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px #000}
#qte .qsub{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 94px);text-align:center;font:400 16px var(--text);color:#e7dcff;text-shadow:0 2px 10px #000;padding:0 30px}
#qte .qtime{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top) + 50px);height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#qte .qtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a3a,#ffd27a);transform-origin:left}
#lantern{position:absolute;left:50%;bottom:16%;width:150px;height:150px;transform:translateX(-50%);display:grid;place-items:center}
#lantern svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
#lantern .glow{position:absolute;left:50%;top:55%;width:600px;height:600px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,170,60,.18) 35%,transparent 62%);pointer-events:none;transition:opacity .1s}
#lantern .lamp{width:70px;position:relative}
#lantern.held .lamp{transform:scale(.96)}
#mara{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);height:46%;transition:height .2s linear,opacity .3s;opacity:.9;filter:blur(1.2px)}
#mara svg{height:100%;width:auto;display:block}
#swipe{white-space:nowrap;position:absolute;left:50%;top:40%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;font:700 13px var(--ui);letter-spacing:.14em;color:#fff;text-transform:uppercase;text-shadow:0 2px 10px #000}
#swipe.on{display:flex}
#swipe svg{width:44px;height:90px;animation:sw 0.9s ease-in-out infinite}
@keyframes sw{0%{transform:translateY(-14px);opacity:0}40%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.qbars{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 150px);display:flex;flex-direction:column;gap:14px}
.qbar{font:600 13px var(--ui);color:#fff;text-shadow:0 1px 6px #000}
.qbar div{margin-top:6px;height:12px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3a,#ffe08a);border-radius:12px}
.qbar.ok i{background:linear-gradient(90deg,#8fe08a,#d8ffb0)}
#tapBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:2px solid #ffd27a;background:radial-gradient(circle,rgba(255,150,60,.55),rgba(120,40,10,.6));color:#fff;font:800 13px var(--ui);letter-spacing:.1em;display:grid;place-items:center;box-shadow:0 0 30px rgba(255,140,50,.6)}
#tapBtn.hit{transform:translateX(-50%) scale(.92)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px #ff8a3a;pointer-events:none;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.qres{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 34px var(--disp);letter-spacing:.06em;color:#fff;text-shadow:0 0 20px rgba(255,200,120,.8);opacity:0;transition:opacity .4s;white-space:nowrap}
.qres.on{opacity:1}
.qres.bad{color:#d9c8ff;text-shadow:0 0 20px rgba(150,110,255,.8)}
/* tarot */
#tarot{position:absolute;inset:0;z-index:48;display:none}
#tarot.on{display:block}
#tarot .tt{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font:400 22px var(--disp);color:#f2e6c9;text-shadow:0 2px 10px #000;letter-spacing:.04em}
#tarot .ts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 98px);text-align:center;font:600 12px var(--ui);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#fan{position:absolute;left:0;right:0;bottom:12%;height:44%}
.card{position:absolute;bottom:0;left:50%;width:27%;aspect-ratio:.58;margin-left:-13.5%;transform-origin:50% 140%;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;cursor:pointer;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.card .f{transform:rotateY(180deg)}
.card svg{width:100%;height:100%;display:block}
.card.pick{z-index:5}
#reading{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:none;font:400 16px/1.4 var(--text)}
#reading.on{display:block}
#reading b{font:400 17px var(--disp);color:var(--gold);letter-spacing:.04em}
#reading p{margin:6px 0 0}
#reading .k{color:#d8cdf5;font-style:italic}
#reading .lb{font:600 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-top:8px}
#alfPeek{position:absolute;right:-6%;bottom:30%;width:36%;transform:rotate(-8deg);transition:transform .4s;cursor:pointer;display:none;z-index:6}
#alfPeek.on{display:block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:rotate(-14deg) translateX(-8px)}}
/* end screen */
#end{position:absolute;inset:0;z-index:58;background:radial-gradient(ellipse at 50% 20%,#1d1338,#07050f 70%);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 48px) 22px 30px;overflow:auto}
#end.on{display:flex}
#end h2{margin:0;font:400 34px var(--disp);color:#efe4ff;letter-spacing:.05em;text-align:center}
#end .sub{font:400 16px var(--text);color:var(--muted);margin:6px 0 20px;text-align:center}
.tl{width:100%;max-width:360px;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin:0 0 14px;font:400 15.5px/1.35 var(--text)}
.tl div::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(232,184,90,.6)}
.tl small{display:block;font:500 11.5px var(--ui);color:var(--dim);letter-spacing:.04em}
.stat{width:100%;max-width:360px;display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font:600 14px var(--ui)}
.stat span{color:var(--muted);font-weight:500}
/* demo menu */
#home{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:linear-gradient(rgba(7,5,15,.35),rgba(7,5,15,.85)),var(--homebg) center/cover}
#home h1{margin:0;font:400 58px var(--disp);color:#efe4ff;letter-spacing:.06em;text-shadow:0 0 30px rgba(169,139,255,.7)}
#home .tag{font:400 17px var(--text);color:#e6dcc4;margin:-4px 0 14px;text-shadow:0 2px 8px #000}
#home .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:300px}
#home .grid .btn{padding:11px 8px;font-size:13px}
#home .lbl{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:10px}
#home .note{font:500 11.5px var(--ui);color:var(--dim);text-align:center;max-width:300px;margin-top:8px;line-height:1.45}

/* world + camera */
#world{position:absolute;top:0;bottom:0;left:0;width:100%;will-change:transform}
#world #bgA,#world #bgB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#world #sprites{position:absolute;inset:0}
.spr .fig{position:relative;height:100%;width:100%;display:block;transition:filter .9s}
.spr .fig img{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 14px rgba(0,0,0,.45))}
.spr .tint{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:soft-light;opacity:.55;transition:background .9s}
.spr.flip .fig{transform:scaleX(-1)}
.spr::after{content:"";position:absolute;left:50%;bottom:-2%;width:70%;height:5%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);z-index:-1}
/* panorama: people instead of dots */
.spot.talk.who{transform:translate(-50%,-100%);display:block}
.spot.talk.who img,.spot.talk.who svg{height:100%;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,214,140,.55)) brightness(.92)}
.spot.talk.who b{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-size:11px}
.spot.talk.who:active img{transform:scale(.97)}
/* QTE: carry the fire */

/* menu: chapter picker first, then the chapter menu; scrolls instead of pushing buttons off-screen */

/* ===== v1.0.27 ===== */
/* found clue, shown big */
#clueShow{position:absolute;inset:0;z-index:57;display:none;align-items:center;justify-content:center;padding:28px;background:radial-gradient(ellipse at 50% 45%,rgba(20,14,30,.55),rgba(5,3,10,.88))}

@keyframes csIn{from{opacity:0}to{opacity:1}}

/* ===== v1.0.28: QTE «Кочки» ===== */
#qte .hop{position:absolute;inset:0;overflow:hidden;background:#05060a}
#qte .hopbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#qte .hkat{position:absolute;transform:translate(-50%,-100%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.6)) brightness(.8);z-index:2;pointer-events:none}

#qte .hkat.fall{transition:transform .8s ease-in,opacity .8s;transform:translate(-50%,-55%) scale(.9);opacity:0}

/* ===== v1.0.27 ===== */
/* iOS draws a faint box around filtered sprites with a blurred shadow: no drop-shadow on sprites */
.spr .fig img,.warm .spr .fig img{filter:none!important}
/* fern flowers in «Вспышка» */
/* run through the fog */
.run{position:absolute;inset:0;overflow:hidden;background:#0a0c10}
.runbg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;opacity:0;transition:opacity .5s}
.runbg.on{opacity:1}.runbg.zoom{animation:runzoom 1.5s linear forwards}
@keyframes runzoom{from{transform:scale(1)}to{transform:scale(1.18)}}
.running .run{animation:runbob .42s ease-in-out infinite alternate}
@keyframes runbob{from{transform:translate(-4px,0) rotate(-.4deg)}to{transform:translate(4px,6px) rotate(.4deg)}}
.rkosh{position:absolute;bottom:4%;height:30%;opacity:0;filter:brightness(.55) blur(3px);transform:translateX(-50%) scaleX(var(--fx,1)) scale(.6);pointer-events:none}
.rkosh.sl{left:24%}.rkosh.sr{left:76%}.rkosh.sc{left:50%}
.rkosh.in{transition:all .9s cubic-bezier(.3,.6,.3,1);opacity:1;height:62%;filter:brightness(.7) blur(0);transform:translateX(-50%) scaleX(var(--fx,1)) scale(1)}
.rkosh.past{transition:all .45s ease-in;opacity:0;transform:translateX(-50%) scaleX(var(--fx,1)) scale(1.4)}
.rkosh.sl.past{left:-10%}.rkosh.sr.past{left:110%}.rkosh.sc.past{bottom:-30%}
.rkosh.burn{transition:all .5s;opacity:0;filter:brightness(2) sepia(1)}
.rkosh.grab{transition:all .4s;height:95%;opacity:1}
/* hold Mara */
.shk{position:absolute;inset:0;overflow:hidden;background:#000}
.shk img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover}
.shk img.jerk{animation:jerk .6s ease-in-out infinite}
.shk img.l{--jx:-14px}.shk img.r{--jx:14px}.shk img.u{--jy:-14px}.shk img.d{--jy:14px}
@keyframes jerk{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--jx,0),var(--jy,0)) rotate(.6deg)}75%{transform:translate(calc(var(--jx,0)*-.5),calc(var(--jy,0)*-.5)) rotate(-.6deg)}}
/* divination */
#tarot .tbl.dv{background:radial-gradient(ellipse at 50% 40%,#2a1c14,#0b0806 70%)}
.dvdeck{top:30%!important;height:34%!important}
.card2.dvc{width:26%;transform:translate(-50%,0)}
.card2.dvc .dvl{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font:600 12px var(--ui);color:#e6dcc4;letter-spacing:.08em;text-transform:uppercase}
/* gat clues: barely visible, a slow dim glint */

#panoIn .decor.gat{animation:gatglint 7s ease-in-out infinite}

#qte .qhearts{left:0;right:0;text-align:center;top:calc(env(safe-area-inset-top) + 132px);font-size:17px}
#qte .run,#qte .shk{touch-action:none}#qte .run img,#qte .shk img{pointer-events:none;-webkit-user-drag:none;user-select:none}
#home.chapsel #hReset#hReset#hReset{display:block!important}#home:not(.chapsel) #hReset{display:none!important}
#tapGo{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 45%,#2a1830,#07040b 70%);color:#f3e6d0;cursor:pointer}
#tapGo b{font:400 34px var(--text,serif)}#tapGo span{font:600 13px var(--ui,sans-serif);letter-spacing:.14em;text-transform:uppercase;opacity:.75;animation:tgp 1.6s ease-in-out infinite}
@keyframes tgp{50%{opacity:.35}}
#panoIn .decor.girls2{transform:translate(-50%,-100%)!important;pointer-events:none}#panoIn .decor.girls2 img{filter:brightness(.7) saturate(.85)}
#panoIn .decor.girls2 img{position:static!important;inset:auto!important;width:100%!important;height:auto!important;display:block}

/* fern flowers: stay where they appear; a hit flares and fades in place, a miss smoulders out */
#qte .qspark.fern{width:24vw;max-width:140px;height:auto;margin:0;border-radius:0;background:none!important;box-shadow:none!important;transform:translate(-50%,-50%)!important;transition:none!important;
 animation:fernIn .3s ease-out both;filter:drop-shadow(0 0 16px rgba(255,140,40,.85));will-change:opacity,filter}

@keyframes fernIn{from{opacity:0}to{opacity:1}}
@keyframes fernHit{0%{opacity:1}40%{opacity:1;filter:drop-shadow(0 0 40px rgba(255,230,140,1)) brightness(1.8)}100%{opacity:0;filter:drop-shadow(0 0 50px rgba(255,230,140,0)) brightness(2)}}
@keyframes fernOut{from{opacity:1;filter:brightness(.7)}to{opacity:0;filter:brightness(.3)}}

/* заголовок сцены: переносы по словам, пробелы видны */
#title h1{white-space:normal!important;max-width:92vw;font-size:min(54px,9.2vw);line-height:1.18;text-wrap:balance;word-spacing:.18em}

@keyframes pgIn{from{opacity:0}to{opacity:1}}

body{animation:pgIn .45s ease-out both}

#home .grid,#home .btn{animation:homeIn .4s cubic-bezier(.2,.8,.3,1) both}

/* 1.0.53: загрузочный экран с процентами */
#boot{position:fixed;inset:0;z-index:300;background:#05030a radial-gradient(ellipse at 50% 40%,rgba(120,70,220,.25),transparent 60%);display:flex;align-items:center;justify-content:center;transition:opacity .55s}

.wcPaper{position:absolute;inset:0;z-index:45;background:rgba(5,3,10,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
.wcPaper.on{opacity:1}
.wcPaper .sheet{position:relative;width:84%;transform:rotate(-2.5deg) scale(.9);transition:transform .6s cubic-bezier(.2,.8,.3,1.2);filter:drop-shadow(0 10px 26px rgba(0,0,0,.7))}

.wcTime{position:absolute;left:10%;right:10%;top:10%;height:4px;background:rgba(0,0,0,.15);border-radius:4px;overflow:hidden}

/* планёрка */

.wcMap .mapS{overflow:hidden;border:1px solid #8a7556;overscroll-behavior:none}.wcMap .mapS::-webkit-scrollbar{display:none}

/* ===== 1.0.47 ===== */
/* газета: всё потоком, ничего не накладывается */
.wcPaper .sheet{width:min(88%,430px);background:linear-gradient(#e9dcc0,#d8c7a4);padding:3.2cqw 4cqw 4cqw;border-radius:2px;box-shadow:inset 0 0 40px rgba(90,60,30,.35)}
.wcPaper .mast,.wcPaper .date,.wcPaper .head,.wcPaper .sub{position:static!important;left:auto;right:auto;top:auto}
.wcPaper .mast{white-space:normal;font-size:6.2cqw;line-height:1.05;margin-bottom:1.6cqw}
.wcPaper .date{margin-bottom:2.4cqw}
.wcPaper .head{font-size:8cqw;line-height:1.02;margin-bottom:1.6cqw;text-wrap:balance}
.wcPaper .sub{font-size:3.6cqw;margin-bottom:2.6cqw;text-wrap:balance}
.wcPaper .pic{width:100%;aspect-ratio:4/3;overflow:hidden;border:1px solid #2a1d12}
.wcPaper .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 82%;filter:sepia(.25) contrast(1.05)}
/* фотороботы: влезают по ширине, без вылезания поворотом */
.wcSketch .grid{max-width:min(100%,400px);gap:14px 10px;padding:0 6px}
.wcSketch figure{min-width:0}
.wcSketch img{filter:none;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.wcSketch figcaption{font-size:14px;overflow-wrap:anywhere}
/* вальс */
.wcWaltz .wbg{position:absolute;inset:0;background:center/cover no-repeat;transform:scale(1.04);animation:wsway 3.6s ease-in-out infinite}
@keyframes wsway{50%{transform:scale(1.07) rotate(-.6deg)}}
.wcWaltz .wsh{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(10,6,16,.25),rgba(10,6,16,.85) 80%)}
.wcWaltz .qh,.wcWaltz .qs{text-shadow:0 2px 8px #000}
.wcWaltz .beat{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 150px);display:flex;justify-content:center;gap:16px}
.wcWaltz .beat i{width:10px;height:10px;border-radius:50%;background:rgba(244,236,216,.25);transition:transform .15s,background .15s}
.wcWaltz .beat i.on{background:#e8c25a;transform:scale(1.6)}
.wcWaltz .ring{position:absolute;left:50%;top:52%;width:150px;height:150px;margin:-75px 0 0 -75px}
.wcWaltz .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.wcWaltz .ring .tm{fill:rgba(10,6,16,.45);stroke:#e8c25a;stroke-width:3;stroke-dasharray:290;stroke-dashoffset:0}
.wcWaltz .arr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.wcWaltz .arr::before{content:"";width:62px;height:62px;background:#f4ecd8;clip-path:polygon(0 38%,58% 38%,58% 14%,100% 50%,58% 86%,58% 62%,0 62%)}
.wcWaltz .arr.on,.wcWaltz .arr.good,.wcWaltz .arr.bad{opacity:1}
.wcWaltz .arr.good::before{background:#9fdc7c}.wcWaltz .arr.bad::before{background:#d9534f}
.wcWaltz.slip .wbg{filter:blur(2px)}
.wcWaltz .hearts{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 60px);display:flex;justify-content:center;gap:8px}
.wcWaltz .hearts i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(244,236,216,.6)}
.wcWaltz .hearts i.ok{background:#9fdc7c;border-color:#9fdc7c}.wcWaltz .hearts i.no{background:#d9534f;border-color:#d9534f}
/* тень */
.wcShadow2 .sbg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.55) saturate(.7)}
.wcShadow2 .dark{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.2) 60%,rgba(0,0,0,.6))}
.wcShadow2 .tol{position:absolute;right:8%;bottom:14%;height:46%;filter:brightness(.8);transition:transform .25s}
.wcShadow2 .tol.back{transform:scaleX(-1)}
.wcShadow2 .lamp{position:absolute;right:4%;bottom:18%;width:60%;height:50%;background:radial-gradient(ellipse at 85% 60%,rgba(255,214,140,.45),transparent 60%);opacity:.35;transition:opacity .25s;pointer-events:none}
.wcShadow2 .tol.back~.lamp{opacity:1}
.wcShadow2 .kat{position:absolute;bottom:12%;height:44%;transform:translateX(-50%);filter:brightness(.35) saturate(.4);transition:filter .2s}
.wcShadow2.go .kat{animation:wcStep .5s infinite}
.wcShadow2.caught .kat{filter:brightness(.9) drop-shadow(0 0 14px #c33)}
.wcShadow2 .qh,.wcShadow2 .qs{text-shadow:0 2px 8px #000}
.wcShadow2 .trk{position:absolute;left:10%;right:10%;bottom:calc(env(safe-area-inset-bottom) + 40px);height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.wcShadow2 .trk i{display:block;height:100%;background:#e8c25a;transform-origin:left;transform:scaleX(0)}
.wcShadow2 .warn{position:absolute;right:14%;bottom:62%;font:700 40px "PT Serif",serif;color:#e8c25a;opacity:0;text-shadow:0 0 12px #000;transition:opacity .15s}
.wcShadow2 .warn.on{opacity:1;animation:wcRec .3s steps(2) infinite}
/* стоп-кадр: таймер */
.wcClock{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 92px);height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;z-index:8}
.wcClock i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#e8c25a);transform-origin:left}
.wcClock.low i{background:#c0392b;animation:wcRec .5s steps(2) infinite}
.wcLate{position:absolute;left:20px;right:20px;top:42%;z-index:9;text-align:center;font:italic 17px/1.35 "PT Serif",serif;color:#f4ecd8;background:rgba(20,6,6,.82);border:1px solid #c0392b;border-radius:10px;padding:14px;opacity:0;transform:scale(.9);transition:.3s}
.wcLate.on{opacity:1;transform:none}
/* лупа */
.wcLoupe{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.wcLoupe .lens{position:relative;width:min(78vw,320px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid #b08a3e;box-shadow:0 0 0 2px #2a1d12,0 10px 30px #000}
.wcLoupe .lens img{position:absolute;max-width:none}
.wcLoupe .tg{position:absolute;width:22%;height:22%;margin:-11% 0 0 -11%;border-radius:50%;border:0;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.wcLoupe .tg.hit{background:radial-gradient(circle,rgba(159,220,124,.6),transparent 70%)}
.wcLoupe p{margin:0;font:italic 15px "PT Serif",serif;color:#f4ecd8;text-align:center;padding:0 24px}
.wcLab.fake{color:#ff9a8a}

/* «Колбы» */
.wcFlasks .fbg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.45) saturate(.8)}
.wcFlasks .fsh{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(10,6,16,.2),rgba(10,6,16,.85) 80%)}
.wcFlasks .qh,.wcFlasks .qs{text-shadow:0 2px 8px #000}
.wcFlasks .rack{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(88vw,360px);display:grid;grid-template-columns:repeat(6,1fr);row-gap:34px}
.wcFlasks .fl{grid-column:span 2;position:relative;justify-self:center;width:58px;height:150px;padding:0;border:2px solid rgba(220,230,255,.55);border-top:0;border-radius:6px 6px 26px 26px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 40%,rgba(255,255,255,.1));box-shadow:inset 0 0 12px rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,.7,.3,1);overflow:visible}
.wcFlasks .fl:nth-child(4){grid-column:2/span 2}
.wcFlasks .fl .neck{position:absolute;left:8px;right:8px;top:-12px;height:12px;border:2px solid rgba(220,230,255,.55);border-bottom:0;border-radius:4px 4px 0 0}
.wcFlasks .fl .liq{position:absolute;left:3px;right:3px;bottom:3px;top:10px;border-radius:0 0 22px 22px;overflow:hidden}
.wcFlasks .fl .liq i{position:absolute;left:0;right:0;height:25%;box-shadow:inset 0 6px 8px rgba(255,255,255,.18),inset 0 -2px 4px rgba(0,0,0,.3)}
.wcFlasks .fl .liq i.v{box-shadow:inset 0 6px 8px rgba(255,255,255,.25),0 0 14px #9b5cff;background-image:radial-gradient(circle at 30% 40%,rgba(255,255,255,.5) 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.4) 0 1px,transparent 2px)!important}
.wcFlasks .fl.sel{transform:translateY(-22px)}
.wcFlasks .fl.full{border-color:#e8c25a;box-shadow:0 0 16px rgba(232,194,90,.5)}
.wcFlasks .fl.no{animation:fno .3s}
@keyframes fno{25%{translate:-5px 0}75%{translate:5px 0}}
.wcFlasks .legend{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font:13px "PT Serif",serif;color:#e9e2d2}
.wcFlasks .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wcFlasks .fbtns{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;gap:10px}
.wcFlasks .fbtns button{padding:10px 16px;border-radius:999px;border:1px solid rgba(244,236,216,.5);background:rgba(8,6,16,.7);color:#f4ecd8;font:600 13px Manrope,sans-serif}
.wcFlasks .fl{background:linear-gradient(90deg,rgba(255,255,255,.16) 0 8%,rgba(255,255,255,.03) 14% 70%,rgba(255,255,255,.12) 78%,rgba(255,255,255,.03));border-color:rgba(225,235,255,.6)}
.wcFlasks .fl::after{content:"";position:absolute;left:18%;top:6%;width:9%;height:78%;border-radius:4px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08));pointer-events:none;z-index:2}
.wcFlasks .fl .liq i{background-image:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.08) 40%,rgba(0,0,0,.3))}
.wcFlasks .fbg{filter:brightness(.7) saturate(.9)}
.wcFlasks .rack{top:57%}
.wcFlasks .fsh{background:radial-gradient(ellipse at 50% 60%,rgba(10,6,16,0),rgba(10,6,16,.55) 85%),linear-gradient(rgba(10,6,16,.55),rgba(10,6,16,0) 30%)}
.wcFlasks .fbg{filter:brightness(.95)}

/* «Замок» с деталями */
.wcLock2{background:#120c08}
.wcLock2 .lk{position:absolute;left:50%;top:52%;width:min(128vw,760px);aspect-ratio:16/9;transform:translate(-50%,-50%)}
.wcLock2 .body{position:absolute;inset:0;width:100%;height:100%}
.wcLock2 .win{position:absolute;overflow:hidden}
.wcLock2 .shear{position:absolute;left:0;right:0;height:3px;background:#e8c25a;box-shadow:0 0 8px #e8c25a;transition:bottom .2s}
.wcLock2 .pin{position:absolute;top:30%;height:30%;margin-left:0;transform-origin:50% 0;filter:drop-shadow(0 2px 3px #000);transition:filter .2s}
.wcLock2 .pin.cur{filter:drop-shadow(0 0 8px #e8c25a)}
.wcLock2 .pin.set{filter:drop-shadow(0 0 10px #9fdc7c)}
.wcLock2 .pick{position:absolute;top:57%;width:62%;pointer-events:none;transition:left .05s}
.wcLock2 .tens{position:absolute;left:12%;top:60%;width:24%;opacity:.9}
.wcLock2 .lk.slip{animation:fno .25s}.wcLock2 .lk.open .body{filter:brightness(1.25)}
.wcLock2 .qh,.wcLock2 .qs{text-shadow:0 2px 8px #000}
.wcLock2 .hearts{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 50px);text-align:center;color:#d9534f;font:600 14px Manrope,sans-serif}
.wcLock2 .hearts i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #e8c25a;margin:0 4px;vertical-align:middle}.wcLock2 .hearts i.ok{background:#9fdc7c;border-color:#9fdc7c}

/* «Замок» 9:16 */
.wcLock3{background:#0e0805}
.wcLock3 .lk{position:absolute;left:50%;top:50%;height:100%;aspect-ratio:9/16;transform:translate(-50%,-50%) scale(1.55);transform-origin:50% 47%}
.wcLock3 .body{position:absolute;inset:0;width:100%;height:100%}
.wcLock3 .slot{position:absolute;overflow:hidden}
.wcLock3 .slot .spr{position:absolute;left:4%;width:92%;top:0;object-fit:fill}
.wcLock3 .slot .cyl{position:absolute;left:4%;width:92%;height:72%;object-fit:fill;filter:drop-shadow(0 0 2px #000)}
.wcLock3 .slot .mark{position:absolute;z-index:2;left:-10%;right:-10%;height:2px;background:#e8c25a;box-shadow:0 0 6px #e8c25a;opacity:.0;transition:opacity .2s}
.wcLock3 .slot.cur .mark{opacity:1}
.wcLock3 .slot.cur .cyl{filter:drop-shadow(0 0 4px #e8c25a)}
.wcLock3 .slot.set .cyl{filter:drop-shadow(0 0 5px #9fdc7c)}
.wcLock3 .pick{position:absolute;width:58%;transform:translateY(-50%);pointer-events:none}
.wcLock3 .lk.slip{animation:fno .25s}.wcLock3 .lk.open .body{filter:brightness(1.3)}
.wcLock3 .qh,.wcLock3 .qs{z-index:2;text-shadow:0 2px 8px #000}
.wcLock3 .hearts{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 50px);text-align:center;color:#d9534f;font:600 14px Manrope,sans-serif;z-index:2}
.wcLock3 .hearts i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #e8c25a;margin:0 4px;vertical-align:middle}.wcLock3 .hearts i.ok{background:#9fdc7c;border-color:#9fdc7c}

/* погоня */
.wcChase{background:#070a12;overflow:hidden}
.wcChase canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.wcChase .hud{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;gap:12px;pointer-events:none;font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#9aa3b5}
.wcChase .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.wcChase .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8c25a,#fff3c4)}
.wcChase .lives{color:#d9534f;letter-spacing:.2em}
.wcChase .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font:600 12px system-ui,sans-serif;color:rgba(241,234,216,.55);pointer-events:none}
.wcChase .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#f1ead8;background:radial-gradient(ellipse at 50% 45%,rgba(10,14,28,.6),rgba(5,7,14,.94) 75%)}
.wcChase .ov[hidden]{display:none}
.wcChase .ov h1{margin:0;font:700 32px/1.1 Georgia,serif}
.wcChase .ov p{margin:0;max-width:30ch;color:#d9d2c0}.wcChase .ov p.m{color:#9aa3b5;font-size:13px}
.wcChase .ov ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font:14px system-ui,sans-serif;color:#cfd6e4}
.wcChase .ov li b{color:#e8c25a;margin-right:6px}
.wcChase .go{margin-top:8px;padding:13px 26px;border-radius:999px;border:1px solid #e8c25a;background:rgba(232,194,90,.12);color:#f1ead8;font:700 15px system-ui,sans-serif}

/* ручные связи в стоп-кадре места */
.wcScan .wcSpot.got{opacity:1;pointer-events:auto}
.wcScan .wcSpot.got::before{width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid #f4ecd8;background:rgba(224,71,63,.55);animation:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
.wcScan .wcSpot.got.hid::before{display:none}
.wcScan .wcSpot.sel::before{background:#e0473f;box-shadow:0 0 0 4px rgba(224,71,63,.35),0 0 14px #e0473f;transform:scale(1.25)}
.wcScan .wcDot{display:none}
.wcLines .bad{stroke:rgba(244,236,216,.75);stroke-width:1.1;stroke-dasharray:4 4;transition:opacity .6s}
.wcLines .bad.gone{opacity:0}
.wcSkip.fin{background:rgba(224,71,63,.85);border-color:#e0473f}

.wcMind .case .cs{font:700 11px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:8px 0 2px}
.wcMind .case ul.ded li{color:#8b0d14}
.wcPaper .pic{aspect-ratio:1/1;width:100%;max-width:calc(100svh - 340px);margin:0 auto}
.wcPaper .pic img{object-position:50% 80%}

/* 1.0.50: отпечатки — карточки */
.wcPrints .tg{width:50%;max-width:250px}
.wcPrints .pc{position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.wcPrints .pc img{width:100%;display:block}
.wcPrints .pc i{position:absolute;left:8%;right:8%;bottom:4.5%;text-align:center;font:italic 400 clamp(10px,3.2vw,15px)/1.1 "Marck Script","Caveat","PT Serif",serif;color:#2a1d12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcPrints .tg .pc i{font-size:clamp(12px,3.8vw,17px);color:#5a0d10}
.wcPrints .cards.n4{grid-template-columns:repeat(4,1fr);gap:7px}
.wcPrints .cards.n1{grid-template-columns:1fr;width:36%;left:32%;right:auto}
.wcPrints .cards.n2{grid-template-columns:repeat(2,1fr);width:66%;left:17%;right:auto}
.wcPrints .cards button{padding:4px}

/* 1.0.50: замок — без выделения/перетаскивания картинок, пружины видны */
.wcLock3{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wcLock3 img{pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.wcLock3 .slot{background:rgba(0,0,0,.35)}
.wcLock3 .slot .spr{z-index:0;height:42%;min-height:2px;filter:brightness(.85);opacity:1!important;transform:none!important;transition:none!important}
.wcLock3 .slot .cyl{z-index:1;height:58%}
.wcLock3 .slot .mark{opacity:.35}
.wcLock3 .slot.cur .mark{opacity:1}
.wcLock3 .pick.snap{transition:left .12s ease-out}
.wcLock3 .qs{font-size:13px}

/* 1.0.50: колбы — длинные пробирки в один ряд, слияние слоёв, струя, свечение и блёстки фиолетовой пыли */
.wcFlasks .rack{display:flex!important;justify-content:center;align-items:flex-end;gap:14px;width:min(94vw,380px);top:55%!important;transform:translate(-50%,-50%)!important}
.wcFlasks .fl,.wcFlasks .fl:nth-child(4){grid-column:auto;width:46px;height:min(250px,34vh);border-radius:5px 5px 23px 23px;transition:transform .38s cubic-bezier(.3,.7,.3,1),box-shadow .3s;transform-origin:50% 0}
.wcFlasks .fl.sel{transform:translateY(-26px)}
.wcFlasks .fl.pour{z-index:5}
.wcFlasks .fl .neck{left:6px;right:6px}
.wcFlasks .fl .liq{left:3px;right:3px;bottom:3px;top:14px;border-radius:0 0 20px 20px}
.wcFlasks .fl .liq i{position:absolute;left:0;right:0;background:var(--c)!important;background-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.14) 35%,rgba(255,255,255,.04) 60%,rgba(0,0,0,.32))!important;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35)!important}
.wcFlasks .fl .liq i.top::before{content:"";position:absolute;left:-30%;right:-30%;top:-5px;height:10px;border-radius:50%;background:var(--c);filter:brightness(1.35);opacity:.9;animation:fwave 2.4s ease-in-out infinite}
@keyframes fwave{0%,100%{transform:translateX(-6%) scaleY(.7)}50%{transform:translateX(6%) scaleY(1.1)}}
.wcFlasks .fl .liq i.v{box-shadow:inset 0 0 12px rgba(255,255,255,.35),0 0 18px #b07cff!important;overflow:hidden}
.wcFlasks .fl .liq i.v::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,#e9d8ff 0 1px,transparent 1.8px),radial-gradient(circle,#fff 0 .8px,transparent 1.4px);background-size:14px 19px,21px 27px,9px 13px;background-position:0 0,7px 9px,3px 4px;animation:fspark 3.2s linear infinite,ftw 1.1s ease-in-out infinite alternate;opacity:.9}
@keyframes fspark{to{background-position:0 -38px,7px -45px,3px -26px}}
@keyframes ftw{from{opacity:.45}to{opacity:1}}
.wcFlasks .fl.hasv{box-shadow:0 0 22px rgba(155,92,255,.45),inset 0 0 14px rgba(155,92,255,.25)}
.wcFlasks .fl.full.hasv{box-shadow:0 0 30px rgba(176,124,255,.8),0 0 60px rgba(155,92,255,.4)}
.wcFlasks .jet{position:absolute;z-index:4;width:6px;border-radius:3px;background:var(--c);box-shadow:0 0 6px var(--c);pointer-events:none}
.wcFlasks .jet.v{background:linear-gradient(#e3d0ff,#9b5cff);box-shadow:0 0 12px #b07cff}

/* 1.0.50: вальс по видео */
.wcWaltz.vid{background:#0a0610}
.wcWaltz .wv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.wcWaltz.vid .wsh{background:linear-gradient(rgba(10,6,16,.65),rgba(10,6,16,0) 28%,rgba(10,6,16,0) 75%,rgba(10,6,16,.7))}
.wcWaltz.vid .ring{top:auto;bottom:calc(env(safe-area-inset-bottom) + 110px);width:110px;height:110px;margin:0 0 0 -55px}
.wcWaltz.vid .ring .tm{transition:none!important}
.wcWaltz.vid .arr::before{width:48px;height:48px}
.wcWaltz.vid .hearts{bottom:calc(env(safe-area-inset-bottom) + 64px)}

  let front=bA,shown=-1,prog=0;const swapBg=()=>{if(!frames.length)return;const k=Math.min(frames.length-1,Math.floor(prog*frames.length));const sc=1+prog*.35;

  const L=q.querySelector('.lk'),slots=[...q.querySelectorAll('.slot')],pick=q.querySelector('.pick'),H=q.querySelector('.hearts');
  const st=slots.map((_,i)=>({h:0,set:false,need:.09+((i*37+(c.seed||5))%5)*.05}));

      s.classList.toggle('set',st[i].set);s.classList.toggle('cur',i===cur&&mode!=='drag')});pick.style.left=(px-58)+'%'};
  const nearest=v=>{let b=0;SX.forEach((x,i)=>{if(Math.abs(x-v)<Math.abs(SX[b]-v))b=i});return b};
  let last=performance.now();const loop=t=>{if(done)return;const dt=Math.min(.05,(t-last)/1000);last=t;

const KEYED={};
function keyImg(url){if(KEYED[url])return KEYED[url];return KEYED[url]=new Promise(r=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{

  const D=g.getImageData(0,0,w,h),d=D.data;const c0=[d[0],d[1],d[2]];const blue=c0[2]>c0[1];
  for(let i=0;i<d.length;i+=4){const R=d[i],G=d[i+1],B=d[i+2];const key=blue?B-Math.max(R,G):G-Math.max(R,B);

/* ---------- «Колбы» (лаборатория Толи): разделить три вещества по пяти колбам ---------- */
function flasksUI(c){return new Promise(res=>{
  const COL=c.colors||[['b','#2f5fd0','синяя соль'],['v','#9b5cff','фиолетовая пыль'],['r','#7a1730','бордовая кровь']],H=4,NF=c.n||5;
  /* случайная, но всегда решаемая раскладка: перемешать и проверить перебором */
  const key=s=>s.map(x=>x.join('')).join('|');
  const moves=s=>{const out=[];for(let i=0;i<s.length;i++){if(!s[i].length)continue;const top=s[i][s[i].length-1];let k=0;for(let q=s[i].length-1;q>=0&&s[i][q]===top;q--)k++;
    for(let j=0;j<s.length;j++){if(i===j||s[j].length>=H)continue;if(s[j].length&&s[j][s[j].length-1]!==top)continue;if(!s[j].length&&k===s[i].length)continue;out.push([i,j,Math.min(k,H-s[j].length)])}}return out};
  const apply=(s,[i,j,k])=>{const n=s.map(x=>x.slice());for(let q=0;q<k;q++)n[j].push(n[i].pop());return n};
  const solved=s=>s.every(x=>!x.length||(x.length===H&&x.every(y=>y===x[0])));
  const solvable=s=>{const seen=new Set([key(s)]);let fr=[s];for(let d=0;d<40&&fr.length;d++){const nx=[];for(const st of fr){if(solved(st))return d;for(const m of moves(st)){const n=apply(st,m),k=key(n);if(!seen.has(k)){seen.add(k);nx.push(n)}}}fr=nx}return -1};
  let S0;for(let tries=0;tries<200;tries++){const pool=[];COL.forEach(x=>{for(let i=0;i<H;i++)pool.push(x[0])});for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
    const s=[];for(let i=0;i<COL.length;i++)s.push(pool.slice(i*H,i*H+H));while(s.length<NF)s.push([]);if(!solved(s)&&solvable(s)>=(tries<150?(c.minMoves||7):1)){S0=s;break}}
  if(!S0)S0=[['b','v','r','b'],['v','r','b','v'],['r','b','v','r'],[],[]];
  let S=S0.map(x=>x.slice()),hist=[],sel=-1,busy=false,done=false,t0=performance.now();
  const bg=(A.bg||{})[c.bg||'lab_street']||'';
  const q=qWrap('wcFlasks',`<div class="fbg" style="background-image:url('${bg}')"></div><div class="fsh"></div><div class="qh">${esc(c.hint||'Колбы')}</div><div class="qs">${esc(c.sub||'Разлей вещества по колбам: в каждой — одно. Лить можно только на такое же или в пустую.')}</div>
    <div class="rack"></div><div class="legend">${COL.map(x=>`<span><i style="background:${x[1]}"></i>${esc(x[2])}</span>`).join('')}</div><div class="fbtns"><button class="undo">↶ Назад</button><button class="again">Заново</button><button class="give" hidden>Пусть Толя</button></div>`);
  const rack=q.querySelector('.rack'),CC=Object.fromEntries(COL.map(x=>[x[0],x[1]]));
  /* одинаковые соседние слои сливаются в одну ячейку; верхний слой — с волной поверхности */
  const runs=f=>{const r=[];f.forEach((x,k)=>{const l=r[r.length-1];if(l&&l.c===x)l.n++;else r.push({c:x,k,n:1})});return r};
  const SEG=100/H;
  /* 1.0.50: две деревянные подставки (3 + 2 гнезда), стеклянные пробирки из ассета, жидкость — кодом под стеклом */
  const HX=[.239,.4975,.752],ROWS=NF<=3?[[0,1,2].slice(0,NF)]:[[0,1,2],[...Array(NF-3)].map((_,k)=>3+k)];
  const layout=()=>{const qr=q.getBoundingClientRect(),avail=qr.height-300,rowH=Math.min(avail/ROWS.length,300);
    const W=Math.min(qr.width*.9,rowH/0.83);rack.style.setProperty('--rw',W+'px');rack.style.setProperty('--th',(W*.7)+'px')};
  rack.innerHTML=ROWS.map(r=>`<div class="row"><img class="rk" alt="" draggable="false" src="${(A.ui||{}).flask_rack||''}">${r.map((i,k)=>`<button class="fl" data-i="${i}" style="left:${HX[k]*100}%" aria-label="колба ${i+1}"><span class="liq"></span><img class="gl" alt="" draggable="false" src="${(A.ui||{}).flask_glass||''}"><img class="ck" alt="" draggable="false" src="${(A.ui||{}).flask_cork||''}"></button>`).join('')}</div>`).join('');
  layout();addEventListener('resize',layout);
  rack.querySelectorAll('.fl').forEach(b=>b.onclick=()=>tap(+b.dataset.i));
  const draw=()=>{S.forEach((f,i)=>{const b=rack.querySelector(`.fl[data-i="${i}"]`);if(!b)return;const R=runs(f);
      b.className='fl'+(i===sel?' sel':'')+(f.length===H&&f.every(y=>y===f[0])?' full':'')+(f.includes('v')?' hasv':'');
      b.querySelector('.liq').innerHTML=R.map((r,j)=>`<i class="${r.c}${j===R.length-1?' top':''}" style="--c:${CC[r.c]};bottom:${r.k*SEG}%;height:${r.n*SEG}%"></i>`).join('')})};
  const tap=async i=>{if(busy||done)return;if(sel<0){if(!S[i].length)return;sel=i;sfx('tick');return draw()}
    if(i===sel){sel=-1;return draw()}
    const m=moves(S).find(m=>m[0]===sel&&m[1]===i);if(!m){vib(60);const b=rack.querySelector(`[data-i="${i}"]`);b.classList.add('no');setTimeout(()=>b.classList.remove('no'),300);sel=-1;return draw()}
    busy=true;const from=rack.querySelector(`[data-i="${sel}"]`),to=rack.querySelector(`[data-i="${i}"]`);
    const fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect(),right=tr.left>=fr.left,col=CC[S[sel][S[sel].length-1]];

    /* струя из горлышка в колбу */

    const tTop=rack.querySelector(`[data-i="${i}"] .liq i.top`);if(tTop){const h1=parseFloat(tTop.style.height),h0=h1-m[2]*SEG;tTop.animate([{height:Math.max(0,h0)+'%'},{height:h1+'%'}],{duration:520,easing:'ease-out'})}
    const fEl=rack.querySelector(`[data-i="${fromI}"]`);fEl.style.transition='none';fEl.style.transform=from.style.transform;fEl.classList.add('pour');
    await wait(520);jet.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});setTimeout(()=>jet.remove(),200);
    fEl.style.transition='';fEl.style.transform='';fEl.classList.remove('pour');await wait(280);busy=false;
    if(solved(S)){done=true;ST.flags.flasks_moves=hist.length;await wait(500);qEnd(q,true,c,res)}};
  q.querySelector('.undo').onclick=()=>{if(busy||done||!hist.length)return;S=hist.pop();sel=-1;draw()};
  q.querySelector('.again').onclick=()=>{if(busy||done)return;S=S0.map(x=>x.slice());hist=[];sel=-1;draw()};
  const gv=q.querySelector('.give');setTimeout(()=>{if(!done)gv.hidden=false},(c.giveAfter||45)*1000);gv.onclick=()=>{if(done)return;done=true;qEnd(q,false,c,res)};
  draw()})}


/* «Погоня в тумане» (wc_chase): сайд-скроллер. Свайп ↑ — прыжок, тап — фонарь (если Потрошитель рядом, иначе прыжок).

function chaseUI(c){return new Promise(res=>{
